<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Lost? 🎮 PlayDaily10</title>
<style>
  /* Inline fallback: hosts may serve this 404 at a deep path where the shared CSS URL misses */
  body{margin:0;background:#0f172a;color:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:24px}
  .hero{text-align:center}.tag{color:#cbd5e1;line-height:1.6}
  .act{display:block;background:#22c55e;color:#052e16;text-align:center;padding:14px;border-radius:14px;font-weight:900;text-decoration:none}
  footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px}
</style>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
<main>
  <header class="hero" style="margin-top:60px">
    <div style="font-size:64px">🕹️</div>
    <h1>Oops — <span class="grad">wrong turn!</span></h1>
    <p class="tag">This page wandered off the board.<br>But today's 10 daily challenges are right here:</p>
    <a class="act green" id="arcadeLink" href="index.html" style="max-width:300px;margin:18px auto">🎮 Go to the Arcade</a>
  </header>
  </main>
<footer>PlayDaily10 • 10 daily games • one link</footer>
</div>
<script>
/* A custom 404 may be served at an arbitrarily deep wrong URL. Walk up the
   path until this app's manifest is found, then point Home at the real root. */
(async () => {
  const link = document.getElementById("arcadeLink"); if (!link || !window.fetch) return;
  let dir = location.pathname;
  if (!dir.endsWith("/")) dir = dir.slice(0, dir.lastIndexOf("/") + 1);
  while (true) {
    const controller = "AbortController" in window ? new AbortController() : null;
    const timer = controller ? setTimeout(() => controller.abort(), 1500) : null;
    try {
      const res = await fetch(dir + "manifest.webmanifest", {cache:"no-store", signal: controller ? controller.signal : undefined});
      if (res.ok) {
        const manifest = await res.json();
        if (manifest && String(manifest.name || "").startsWith("PlayDaily10")) {
          link.href = dir + "index.html";
          const css = document.querySelector('link[rel="stylesheet"]');
          if (css) css.href = dir + "assets/style.css";
          break;
        }
      }
    } catch(e) {}
    if (timer) clearTimeout(timer);
    if (dir === "/") break;
    dir = dir.slice(0, dir.slice(0, -1).lastIndexOf("/") + 1);
  }
})();
</script>
</body>
</html>
