px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}\n.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}\n.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}\n.stat{background:#00000030;border:1px solid var(--line);border-radius:15px;padding:9px 4px;text-align:center;min-width:0}\n.stat b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.stat span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:800}\n.modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}\n.modes button{min-height:41px;border:2px solid var(--line);background:var(--card);color:var(--text);padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:900;cursor:pointer}\n.modes button.active{background:var(--gold);color:#422006;border-color:var(--gold)}\n.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}\n.btns.one{grid-template-columns:1fr}\nbutton.act,a.act{border:0;border-radius:15px;padding:13px 8px;font-size:14.5px;font-weight:900;cursor:pointer;text-align:center;text-decoration:none;color:inherit;display:block}\n.act.primary{background:linear-gradient(135deg,#fde047,#f59e0b);color:#451a03}\n.act.green{background:linear-gradient(135deg,#4ade80,#16a34a);color:#052e16}\n.act.pink{background:linear-gradient(135deg,#f9a8d4,#db2777);color:#fff}\n.act.blue{background:linear-gradient(135deg,#7dd3fc,#2563eb);color:#fff}\n.act.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}\nbutton:disabled{opacity:.45;cursor:not-allowed}\ndetails.howto{background:#ffffff0d;border:1px solid var(--line);border-radius:16px;padding:11px 15px;font-size:14px;line-height:1.62;margin-top:12px}\ndetails.howto summary{font-weight:900;cursor:pointer}\ndetails.howto ul{margin:7px 0 3px;padding-left:19px}\n.msg{text-align:center;min-height:26px;font-weight:900;color:#fde68a;font-size:15.5px;margin:8px 0 2px}\n.subtxt{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5}\n.banner{display:none;font-weight:900;border-radius:13px;padding:10px 12px;text-align:center;font-size:13.5px;margin:9px 0;line-height:1.45}\n.banner.chall{display:block;background:#052e16;border:1.5px solid var(--green);color:#bbf7d0}\n.banner.target{display:block;background:#422006;border:1.5px solid var(--gold);color:#fef08a}\nfooter{text-align:center;font-size:12px;color:#94a3b8;margin-top:18px;line-height:1.75}\nfooter a{color:#fde68a;font-weight:800;text-decoration:none}\n#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(90px);background:var(--gold);color:#422006;\n  font-weight:900;padding:12px 19px;border-radius:999px;transition:.3s;z-index:60;box-shadow:0 10px 30px #0009;font-size:14px;max-width:92vw;text-align:center}\n#toast.show{transform:translateX(-50%) translateY(0)}\n.overlay{position:fixed;inset:0;background:rgba(2,6,23,.82);display:none;align-items:center;justify-content:center;padding:18px;z-index:50;overflow-y:auto}\n.overlay.show{display:flex}\n.modal{background:linear-gradient(180deg,#1e293b,#0f172a);border:1.5px solid #ffffff30;border-radius:24px;padding:26px 20px;max-width:410px;width:100%;text-align:center;box-shadow:var(--shadow);max-height:calc(100dvh - 36px);overflow-y:auto;margin:auto}\n.modal .big{font-size:56px}\n.modal h2{margin:4px 0 8px;font-size:26px}\n.modal p{color:var(--muted);font-size:14.5px;line-height:1.6}\n.modal .act{width:100%;margin-top:8px}\n.confetti{position:fixed;top:-30px;z-index:70;font-size:22px;pointer-events:none;animation:fall linear forwards}\n@keyframes fall{to{transform:translateY(108vh) rotate(540deg)}}\ncanvas.game{display:block;width:100%;height:auto;border-radius:18px;touch-action:none;background:#0b1226}\n.progress{background:#ffffff14;border-radius:999px;height:13px;overflow:hidden}\n.progress>div{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-rad <style id="pd-all-css">:root{
  --bg1:#070b1a;--bg2:#121a35;--card:#ffffff12;--card2:#ffffff1c;--line:#ffffff24;
  --gold:#facc15;--green:#22c55e;--pink:#f472b6;--cyan:#38bdf8;--red:#fb7185;--text:#f8fafc;--muted:#cbd5e1;
  --radius:20px;--shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
   radial-gradient(900px 500px at 15% -10%,#7c3aed55,transparent 60%),
   radial-gradient(800px 450px at 105% 0%,#0891b255,transparent 55%),
   radial-gradient(700px 500px at 50% 115%,#db277733,transparent 60%),
   linear-gradient(160deg,var(--bg1),var(--bg2));}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 42px}
.wrap.wide{max-width:920px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px}
.back,.iconbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer}
.iconbtn{padding:8px 13px;min-height:40px}
.back{min-height:40px}
.brand{font-weight:900;letter-spacing:.4px;font-size:14px;opacity:.95}
.brand b{color:var(--gold)}
header.hero{text-align:center;padding:8px 4px 4px}
h1{margin:4px 0 6px;font-size:34px;line-height:1.08;letter-spacing:-.5px}
h1 .grad{background:linear-gradient(92deg,#facc15,#f472b6 55%,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--muted);font-size:14.5px;line-height:1.55;margin:4px auto 10px;max-width:520px}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.pills i{font-style:normal;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.panel{background:linear-gradient(180deg,var(--card2),#ffffff0d);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{background:#00000030;border:1px solid var(--line);border-radius:15px;padding:9px 4px;text-align:center;min-width:0}
.stat b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:800}
.modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.modes button{min-height:41px;border:2px solid var(--line);background:var(--card);color:var(--text);padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:900;cursor:pointer}
.modes button.active{background:var(--gold);color:#422006;border-color:var(--gold)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.btns.one{grid-template-columns:1fr}
button.act,a.act{border:0;border-radius:15px;padding:13px 8px;font-size:14.5px;font-weight:900;cursor:pointer;text-align:center;text-decoration:none;color:inherit;display:block}
.act.primary{background:linear-gradient(135deg,#fde047,#f59e0b);color:#451a03}
.act.green{background:linear-gradient(135deg,#4ade80,#16a34a);color:#052e16}

<body>
<script>
/* PlayDaily10 — Shared Daily Engine (100% static, no server)
   Seeded daily challenges, streaks, sharing, challenge links, sound, confetti. */
/* Older-browser safety: Canvas roundRect (Safari <16 / old WebViews) */
if (typeof CanvasRenderingContext2D !== "undefined" && !CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r = Math.min(r || 0, w/2, h/2);
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this;
  };
}
const PD = (() => {
  const $ = id => document.getElementById(id);
  const readRouteParams = () => { const q = location.hash.includes("?") ? location.hash.slice(location.hash.indexOf("?")+1) : ""; return new URLSearchParams(location.search || q); };
  const params = { get: key => readRouteParams().get(key) };
  const engineScriptSrc = (document.currentScript && document.currentScript.src) ||
    (document.querySelector('script[src*="engine.js"]') || {}).src || "";

  /* Daily challenges are keyed to the UTC date, so at any instant the whole
     planet really is playing the SAME board — not 24 different local days. */
  function todayStr(){
    return new Date().toISOString().slice(0,10);
  }
  function dailyNumberFor(dateStr){
    return Math.floor((new Date(dateStr+"T00:00:00Z") - new Date("2026-01-01T00:00:00Z")) / 86400000) + 1;
  }
  function dailyNumber(){ return dailyNumberFor(todayStr()); }
  function nextResetMs(){
    const d = new Date();
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()+1) - d.getTime();
  }
  function hashSeed(str){
    let h = 1779033703 ^ str.length;
    for (let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; }
    return h >>> 0;
  }
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a>>>15, 1 | a);
      t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
      return ((t ^ t>>>14) >>> 0) / 4294967296;
    };
  }
  const rngFrom = seedStr => mulberry32(hashSeed(String(seedStr)));

  /* Storage helpers — never crash if web storage is unavailable.
     Fallback order: localStorage -> sessionStorage -> in-memory. */
  const memoryStore = new Map();
  const pickStorage = name => {
    try {
      const s = window[name];
      s.setItem("__pd_probe","1"); s.removeItem("__pd_probe");
      return s;
    } catch(e) { return null; }
  };
  let ls = pickStorage("localStorage") || pickStorage("sessionStorage");
  const lsGet = k => { try { return ls ? ls.getItem(k) : (memoryStore.has(k) ? memoryStore.get(k) : null); } catch(e){ return memoryStore.has(k) ? memoryStore.get(k) : null; } };
  const lsSet = (k,v) => { const val = String(v); memoryStore.set(k,val); try { ls && ls.setItem(k,val); } catch(e){} };
  const get = (k, d=0) => { const v = lsGet(k); const n = v===null ? d : +v; return Number.isFinite(n) ? n : d; };
  const set = (k,v) => lsSet(k, v);
  const bestKey = (g, variant) => "pd_" + g + "_best" + (variant ? "_" + variant : "");

  /* Mode-aware bests: a 40-move Free score must never pollute the Daily best. */
  function getBest(game, variant){
    const v = get(bestKey(game, variant));
    if (v || !variant) return v;
    if (variant === "daily" || variant.startsWith("daily-")) return get(bestKey(game)); // legacy migration
    return v;
  }
  function saveBest(game, score, variant){
    score = Math.round(score*100)/100;
    if (score > getBest(game, variant)) set(bestKey(game, variant), score);
    return getBest(game, variant);
  }
  function markPlayed(game){
    const t = todayStr(), lastK = "pd_" + game + "_last", stK = "pd_" + game + "_streak";
    /* Replaying a friend's OLD daily board (or a custom free-seed puzzle) is a
       challenge attempt — it must not light up today's hub card/streak. */
    const seedStr = params.get("seed") || "";
    const seedDate = seedStr.match(/\d{4}-\d{2}-\d{2}/);
    if (seedStr.includes("-free-") || (seedDate && seedDate[0] !== t)) return get(stK);
    const last = lsGet(lastK);
    if (last !== t){
      const ys = new Date(new Date(t+"T00:00:00Z").getTime() - 86400000).toISOString().slice(0,10);
      set(stK, last === ys ? get(stK)+1 : 1);
      set(lastK, t);
    }
    return get(stK);
  }
  const streak = game => get("pd_" + game + "_streak");
  const playedToday = game => lsGet("pd_" + game + "_last") === todayStr();

  /* Toast */
  let toastTimer;
  function toast(msg){
    let t = $("toast");
    if (!t){ t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
    t.setAttribute("role", "status"); t.setAttribute("aria-live", "polite");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2500);
  }

  /* Sound (WebAudio, no files) */
  let audioCtx = null;
  const soundOn = () => lsGet("pd_sound") !== "0";
  function beep(freq=440, dur=0.12, type="sine", vol=0.14){
    if (!soundOn()) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur + 0.02);
    }catch(e){}
  }
  const sfx = {
    click:()=>beep(520,.06,"triangle"),
    good :()=>{beep(660,.1,"sine"); setTimeout(()=>beep(880,.14,"sine"),70)},
    great:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,"sine"),i*80))},
    bad  :()=>beep(160,.25,"sine",.18),
    pop  :(n=0)=>beep(300+n*45,.11,"sine")
  };
  function initSoundBtn(){
    const b = $("soundBtn"); if (!b) return;
    const paint = ()=>{ b.textContent = soundOn() ? "🔊 ON" : "🔇 OFF";
      b.setAttribute("aria-pressed", soundOn() ? "true" : "false");
      b.setAttribute("aria-label", soundOn() ? "Sound on — tap to mute" : "Sound off — tap to unmute"); };
    paint();
    b.onclick = ()=>{ lsSet("pd_sound", soundOn() ? "0" : "1"); paint(); if (soundOn()) sfx.click(); };
  }

  /* Confetti emoji burst */
  function celebrate(emojis=["🎉","⭐","🍉","🎊","✨"], count=26){
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){ sfx.great(); return; }
    for (let i=0;i<count;i++){
      const s = document.createElement("span");
      s.className = "confetti";
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = Math.random()*98 + "vw";
      s.style.animationDuration = (1.6 + Math.random()*1.8) + "s";
      s.style.animationDelay = (Math.random()*0.35) + "s";
      document.body.appendChild(s);
      setTimeout(()=>s.remove(), 4200);
    }
    sfx.great();
  }

  /* Sharing */
  const cleanUrl = () => location.href.split("#")[0] + "#" + ((location.hash.slice(1).split("?")[0]) || "/");
  async function share(text, title="PlayDaily10 🎮"){
    const url = cleanUrl();
    if (navigator.share){ try{ await navigator.share({title, text, url}); return; }catch(e){ if(e && e.name==="AbortError") return; } }
    try{ await navigator.clipboard.writeText(text + "\n" + url); toast("✅ Copied! Paste it anywhere to share"); }
    catch(e){ prompt("Copy your result:", text + "\n" + url); }
  }
  function whatsapp(text){
    window.open("https://wa.me/?text=" + encodeURIComponent(text + "\n" + cleanUrl()), "_blank", "noopener");
  }
  async function challengeLink(score, seedStr, label="friend"){
    const u = cleanUrl() + "?seed=" + encodeURIComponent(seedStr) + "&beat=" + encodeURIComponent(Math.round(score*100)/100);
    const msg = "⚔️ I scored " + (Math.round(score*100)/100).toLocaleString("en-US") + " — same challenge, beat me if you can, " + label + "!\n" + u;
    try{ await navigator.clipboard.writeText(msg); toast("⚔️ Challenge link copied — send it to a friend!"); }
    catch(e){ prompt("Copy your challenge link:", u); }
    return u;
  }

  /* Challenge banner (when arriving from a friend's link) */
  function challengeBanner(){
    const beat = params.get("beat");
    if (beat === null || !Number.isFinite(Number(beat))) return null;
    const el = $("challBanner");
    if (el){
      el.className = "banner chall";
      el.innerHTML = "⚔️ <b>CHALLENGE MODE</b> — Beat <b>" + (+beat).toLocaleString("en-US") + "</b> on the exact same challenge. Fair fight!";
    }
    return +beat;
  }
  const challengeSeed = () => params.get("seed");
  const challengeBeat = () => params.get("beat")===null ? null : +params.get("beat");

  function challengeResultLine(score, beat, lowerIsBetter=false){
    if (beat===null || beat===undefined || !Number.isFinite(Number(beat))) return "";
    beat = Number(beat);
    const won = lowerIsBetter ? score < beat : score > beat;
    const tie = score === beat;
    return tie ? "<br>🤝 Exactly tied with the challenge score (" + beat.toLocaleString("en-US") + ")!"
               : won ? "<br>🏆 <b>You beat the challenge score of " + beat.toLocaleString("en-US") + "!</b>"
                     : "<br>The challenge score was " + beat.toLocaleString("en-US") + " — so close, try again! 💪";
  }

  /* Modal helpers */
  let modalReturnFocus = null;
  function modalFocusable(ov){
    return Array.from(ov.querySelectorAll('button:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'))
      .filter(el => el.getClientRects().length);
  }
  function initModal(){
    const ov = $("overlay"); if (!ov) return;
    ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
    if ($("ovTitle")) ov.setAttribute("aria-labelledby","ovTitle");
    if ($("ovText")) ov.setAttribute("aria-describedby","ovText");
    ov.addEventListener("pointerdown", e => { if (e.target === ov) hideModal(); });
    document.addEventListener("keydown", e => {
      if (!ov.classList.contains("show")) return;
      if (e.key === "Escape") { hideModal(); return; }
      if (e.key !== "Tab") return;
      const items = modalFocusable(ov);
      if (!items.length) { e.preventDefault(); return; }
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus({preventScroll:true}); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus({preventScroll:true}); }
      else if (!ov.contains(document.activeElement)) { e.preventDefault(); first.focus({preventScroll:true}); }
    });
  }
  function showModal(emoji, title, html){
    const ov = $("overlay"); if (!ov) return;
    if (!ov.classList.contains("show")) modalReturnFocus = document.activeElement;
    $("ovEmoji") && ($("ovEmoji").textContent = emoji);
    $("ovTitle") && ($("ovTitle").textContent = title);
    $("ovText") && ($("ovText").innerHTML = html);
    ov.classList.add("show");
    const firstBtn = modalFocusable(ov)[0];
    if (firstBtn) { try { firstBtn.focus({preventScroll:true}); } catch(e){} }
  }
  function hideModal(){
    const ov = $("overlay"); if (!ov) return;
    const wasShown = ov.classList.contains("show");
    ov.classList.remove("show");
    if (wasShown && modalReturnFocus && modalReturnFocus !== document.body && modalReturnFocus.isConnected) {
      try { modalReturnFocus.focus({preventScroll:true}); } catch(e){}
    }
    if (wasShown) modalReturnFocus = null;
  }

  const fmt = n => Number.isFinite(+n) ? Math.round(+n).toLocaleString("en-US") : "0";
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* Offline PWA: register from EVERY page (hub or a direct game/challenge link).
     The worker URL is derived from this engine's own URL, so subpath deploys work. */
  function registerServiceWorker(){
    if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol) || !engineScriptSrc) return;
    try {
      const swUrl = new URL(engineScriptSrc);
      if (!/\/assets\/engine\.js$/.test(swUrl.pathname)) return;
      swUrl.pathname = swUrl.pathname.replace(/\/assets\/engine\.js$/, "/sw.js");
      swUrl.search = ""; swUrl.hash = "";
      navigator.serviceWorker.register(swUrl.href).catch(()=>{});
    } catch(e) {}
  }

  function initPage(){ initSoundBtn(); initModal(); }

  return { $, todayStr, dailyNumber, dailyNumberFor, nextResetMs, hashSeed, rngFrom, get, set, lsGet, lsSet, saveBest, getBest, bestKey,
           markPlayed, streak, playedToday, toast, beep, sfx, celebrate, share, whatsapp,
           challengeLink, challengeBanner, challengeSeed, challengeBeat, challengeResultLine,
           showModal, hideModal, fmt, sleep, cleanUrl, initPage };
})();

</script>
<script>
(()=>{
let trackingPage=false;const pageListeners=[];const pageTimers=new Set(),pageFrames=new Set();
const nativeST=window.setTimeout.bind(window),nativeSI=window.setInterval.bind(window),nativeCT=window.clearTimeout.bind(window),nativeCI=window.clearInterval.bind(window),nativeRAF=window.requestAnimationFrame?.bind(window),nativeCAF=window.cancelAnimationFrame?.bind(window);
window.setTimeout=function(fn,ms,...args){let id;id=nativeST(()=>{pageTimers.delete(id);if(typeof fn==='function')fn(...args);},ms);if(trackingPage)pageTimers.add(id);return id};
window.setInterval=function(fn,ms,...args){const id=nativeSI(fn,ms,...args);if(trackingPage)pageTimers.add(id);return id};
window.clearTimeout=function(id){pageTimers.delete(id);return nativeCT(id)};window.clearInterval=function(id){pageTimers.delete(id);return nativeCI(id)};
if(nativeRAF){window.requestAnimationFrame=function(fn){let id;id=nativeRAF(t=>{pageFrames.delete(id);fn(t)});if(trackingPage)pageFrames.add(id);return id};window.cancelAnimationFrame=function(id){pageFrames.delete(id);return nativeCAF(id)}}
for(const target of [window,document]){const add=target.addEventListener.bind(target),remove=target.removeEventListener.bind(target);target.addEventListener=function(type,fn,opts){if(trackingPage)pageListeners.push([target,type,fn,opts]);return add(type,fn,opts)};target.removeEventListener=function(type,fn,opts){for(let i=pageListeners.length-1;i>=0;i--)if(pageListeners[i][0]===target&&pageListeners[i][1]===type&&pageListeners[i][2]===fn)pageListeners.splice(i,1);return remove(type,fn,opts)}}
function cleanupPage(){trackingPage=false;for(const id of pageTimers){nativeCT(id);nativeCI(id)}pageTimers.clear();if(nativeCAF)for(const id of pageFrames)nativeCAF(id);pageFrames.clear();for(const [t,type,fn,opts] of pageListeners)t.removeEventListener(type,fn,opts);pageListeners.length=0}
const data=JSON.parse(document.getElementById('pd-bundle').textContent);
const pages=data.pages;
const routeMap={hub:'/',blockfit:'/games/blockfit.html',colorsort:'/games/colorsort.html',match3:'/games/match3.html',mergemelon:'/games/mergemelon.html','mini-sudoku':'/games/mini-sudoku.html','perfect-circle':'/games/perfect-circle.html',snake:'/games/snake.html',stackup:'/games/stackup.html',stop5000:'/games/stop5000.html',tapfly:'/games/tapfly.html'};
const keyByPath=Object.fromEntries(Object.entries(routeMap).map(([k,v])=>[v,k]));
const base=location.href.split('#')[0];
const routeNow=()=>location.hash.slice(1).split('?')[0]||'/';
const getKey=()=>keyByPath[routeNow()]||'hub';
const routerHref=path=>{let s=String(path||'');if(s==='index.html'||s==='../index.html'||s==='/index.html')return '#/';if(s.startsWith('../'))s=s.slice(3);if(!s.startsWith('/'))s='/'+s;return '#'+s;};
PD.go=path=>{const h=routerHref(path);if(location.hash===h)render();else location.hash=h;};
function runPageScript(code,body){
 const declared=new Set([...code.matchAll(/\bfunction\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(x=>x[1]));
 for(const x of code.matchAll(/\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?(?:\([^)]*\)|[A-Za-z_$][\w$]*)\s*=>/g))declared.add(x[1]);
 const handlers=[...body.matchAll(/\bon[a-z]+\s*=\s*(["'])(.*?)\1/gi)].map(x=>x[2]).join('\n');
 const needed=new Set([...handlers.matchAll(/(?<![\w$.])([A-Za-z_$][\w$]*)\s*\(/g)].map(x=>x[1]));
 const exports=[...needed].filter(n=>declared.has(n));
 const tail=exports.length?';return {'+exports.map(n=>n+':'+n).join(',')+'}':' ;return {}';
 const wrapped='window.__pdExports = (()=>{\n'+code+'\n'+tail+'\n})(); Object.assign(window,window.__pdExports);';
 const script=document.createElement('script');script.textContent=wrapped;document.body.appendChild(script);script.remove();
}
function render(){
 cleanupPage();trackingPage=true;
 const key=getKey(),page=pages[key]||pages.hub;
 document.title=page.title;
 document.getElementById('pd-page-css').textContent=page.css;
 document.body.innerHTML=page.body;
 PD.initPage();
 runPageScript(page.js,page.body);
 trackingPage=false;
 window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
 const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
 const raw=a.getAttribute('href')||'';
 if(raw==='../index.html'||raw==='index.html'||raw==='/index.html'){e.preventDefault();PD.go('/');return;}
 if(/^games\/[a-z0-9-]+\.html(?:[?#].*)?$/i.test(raw)){e.preventDefault();PD.go('/'+raw.split(/[?#]/)[0]);return;}
});
window.addEventListener('hashchange',render);
render();
