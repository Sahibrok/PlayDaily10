<script type="application/json" id="pd-bundle">{"pages":{"hub":{"title":"PlayDaily10 🎮 — 10 Daily Games. One Link. No Words Needed.","body":"<div class=\"wrap wide\">\n  <nav class=\"topbar\" aria-label=\"Arcade navigation\">\n    <span class=\"brand\">🎮 Play<b>Daily10<\/b><\/span>\n    <button class=\"iconbtn\" id=\"soundBtn\" title=\"Sound on/off\">🔊<\/button>\n  <\/nav>\n  <main>\n\n  <header class=\"hero\">\n    <div class=\"heroArt\" aria-hidden=\"true\">🎮🌍🏆<\/div>\n    <h1>10 Games a Day.<br><span class=\"grad\">Zero Words Needed.<\/span><\/h1>\n    <p class=\"tag\">Every day, the <b>whole world gets the exact same 10 challenges<\/b>. Learn each game in 10 seconds,\n      play from one link, share your result, and challenge a friend to beat you on the <i>identical<\/i> board.<\/p>\n    <div class=\"pills\"><i>⏱️ Learn in 10 seconds<\/i><i>🌍 No language barrier<\/i><i>🔗 One link, instant play<\/i><i>☀️ New every day<\/i><i>📲 Fun to share<\/i><i>⚔️ Challenge friends<\/i><\/div>\n    <div class=\"quick\">\n      <button class=\"act green\" id=\"surpriseBtn\">🎲 Surprise Me<\/button>\n      <a class=\"act ghost\" href=\"#gamesSection\">⬇️ Browse All 10<\/a>\n    <\/div>\n  <\/header>\n  <noscript><p class=\"banner target\">JavaScript is required to load today's games. Please enable JavaScript and reload PlayDaily10.<\/p><\/noscript>\n\n  <div class=\"quest panel\">\n    <div class=\"questTitle\" style=\"font-weight:900\">🎯 Today's Quest: complete <b>3 scored attempts<\/b><\/div>\n    <div class=\"progress\" role=\"progressbar\" aria-label=\"Daily quest progress\" aria-valuemin=\"0\" aria-valuemax=\"3\" aria-valuenow=\"0\"><div id=\"questBar\" style=\"width:0%\"><\/div><\/div>\n    <div class=\"subtxt\" id=\"questTxt\">0 of 10 attempts completed today<\/div>\n  <\/div>\n\n  <h2 class=\"bigday\" id=\"gamesSection\"><span id=\"dayLine\">☀️ Today's Challenges<\/span><\/h2>\n  <div class=\"resetLine\" id=\"resetLine\">↻ New challenges at 00:00 UTC<\/div>\n  <div class=\"filters\" id=\"filters\" role=\"group\" aria-label=\"Filter games by category\">\n    <button class=\"active\" data-f=\"all\" aria-pressed=\"true\">🎮 All Games<\/button>\n    <button data-f=\"puzzle\" aria-pressed=\"false\">🧩 Puzzle<\/button>\n    <button data-f=\"timing\" aria-pressed=\"false\">⏱️ Timing<\/button>\n    <button data-f=\"arcade\" aria-pressed=\"false\">🕹️ Arcade<\/button>\n  <\/div>\n\n  <div class=\"grid\" id=\"grid\"><\/div>\n\n  <div class=\"why\">\n    <div><b>☀️ One board for the planet<\/b>A date-seeded generator builds today's challenge identically for everyone — no server, no account, pure fairness.<\/div>\n    <div><b>⚔️ The link IS the multiplayer<\/b>Your score and seed travel inside the challenge link. Friends replay your exact game and try to beat you.<\/div>\n    <div><b>🔥 Streaks that stick<\/b>Play daily to grow your flame on every game. Miss a day and it resets — see you tomorrow!<\/div>\n    <div><b>📱 Made for every phone<\/b>Each game is a few KB of HTML/CSS/JS. It flies on budget phones and slow connections, anywhere on Earth.<\/div>\n  <\/div>\n\n  <\/main>\n  <footer>\n    100% Free • No Download • No Signup • No Ads inside gameplay<br>\n    Built with HTML + CSS + Vanilla JavaScript • Ready for GitHub Pages\n  <\/footer>\n<\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>","js":"\nconst GAMES = [\n {r:1, key:\"blockfit\", em:\"🧩\", name:\"BlockFit Daily\", cat:\"puzzle\", glow:\"#38bdf866\", file:\"games/blockfit.html\",\n  one:\"Drag the blocks onto the 8×8 board. Fill a full line to blast it away!\", best:\"Best score\"},\n {r:2, key:\"mergemelon\", em:\"🍉\", name:\"MergeMelon Daily\", cat:\"puzzle\", glow:\"#22c55e66\", file:\"games/mergemelon.html\",\n  one:\"Drop fruits, merge twins, grow the giant watermelon. 🍒→🍉\", best:\"Best score\"},\n {r:3, key:\"circle\", em:\"⭕\", name:\"Perfect Circle Daily\", cat:\"timing\", glow:\"#a78bfa66\", file:\"games/perfect-circle.html\",\n  one:\"Draw one freehand circle. How perfect can you get? 95%+ earns the halo 😇\", best:\"Best circle\"},\n {r:4, key:\"colorsort\", em:\"🧪\", name:\"ColorSort Daily\", cat:\"puzzle\", glow:\"#f472b666\", file:\"games/colorsort.html\",\n  one:\"Pour the colors between test tubes until every tube holds a single color.\", best:\"Best score\"},\n {r:5, key:\"tapfly\", em:\"🚀\", name:\"TapFly Daily\", cat:\"arcade\", glow:\"#fb923c66\", file:\"games/tapfly.html\",\n  one:\"Tap to fly. Thread all 30 gates of today's course — if you can!\", best:\"Best score\", bestVariant:\"daily\"},\n {r:6, key:\"stackup\", em:\"🏗️\", name:\"StackUp Daily\", cat:\"timing\", glow:\"#facc1566\", file:\"games/stackup.html\",\n  one:\"Tap at the perfect moment to stack the sliding block. How tall can you build?\", best:\"Best score\", bestVariant:\"daily\"},\n {r:7, key:\"match3\", em:\"🍬\", name:\"Match3 Daily\", cat:\"puzzle\", glow:\"#f472b666\", file:\"games/match3.html\",\n  one:\"One shared board, only 25 moves. Swap, match, cascade — chase today's top score!\", best:\"Best score\", bestVariant:\"daily\"},\n {r:8, key:\"snake\", em:\"🐍\", name:\"Snake Daily Maze\", cat:\"arcade\", glow:\"#4ade8066\", file:\"games/snake.html\",\n  one:\"The classic snake in a brand-new maze every day. Eat, grow, survive!\", best:\"Best score\", bestVariant:\"daily\"},\n {r:9, key:\"stop5\", em:\"⏱️\", name:\"Stop 5.000\", cat:\"timing\", glow:\"#38bdf866\", file:\"games/stop5000.html\",\n  one:\"Stop the hidden timer at exactly 5.000 seconds + reaction & precision rounds.\", best:\"Best total\"},\n {r:10, key:\"sudoku\", em:\"🔢\", name:\"Mini Sudoku Daily\", cat:\"puzzle\", glow:\"#fca5a566\", file:\"games/mini-sudoku.html\",\n  one:\"A friendly 6×6 sudoku in 2–4 minutes. Every row, column & box: 1–6, once.\", best:\"Best score\"},\n];\n\nfunction render(filter=\"all\"){\n  document.getElementById(\"grid\").innerHTML = GAMES\n    .filter(g => filter===\"all\" || g.cat===filter)\n    .map(g => {\n      const variant = g.key === \"colorsort\"\n        ? \"daily-c\" + (([0,5,6].includes(new Date().getUTCDay())) ? 5 : 4)\n        : g.bestVariant;\n      const best = PD.getBest(g.key, variant);\n      const done = PD.playedToday(g.key);\n      const stk = PD.streak(g.key);\n      return `<article class=\"gcard\" style=\"--glow:${g.glow}\">\n        <span class=\"done\" style=\"display:${done?\"block\":\"none\"}\">✅ DONE TODAY<\/span>\n        <span class=\"rank\">#${g.r} ${stk?(\"• 🔥\"+stk):\"\"}<\/span>\n        <div class=\"em\">${g.em}<\/div>\n        <div class=\"cat\">${{puzzle:\"🧩 Puzzle\",timing:\"⏱️ Timing & Skill\",arcade:\"🕹️ Arcade\"}[g.cat]}<\/div>\n        <h3>${g.name}<\/h3>\n        <p>${g.one}<\/p>\n        <div class=\"best\">${best ? (\"🏆 \"+g.best+\": \"+PD.fmt(best)) : \"🌱 Not completed yet — today's board is waiting!\"}<\/div>\n        <a class=\"act green\" href=\"${g.file}\">▶️ Play Day #${PD.dailyNumber()}<\/a>\n      <\/article>`;\n    }).join(\"\");\n  const played = GAMES.filter(g => PD.playedToday(g.key)).length;\n  document.getElementById(\"questBar\").style.width = Math.min(100, played/3*100) + \"%\";\n  document.getElementById(\"questBar\").parentElement.setAttribute(\"aria-valuenow\", Math.min(3, played));\n  document.getElementById(\"questTxt\").textContent =\n    played + \"/10 completed today\" + (played>=10 ? \" — 👑 PERFECT DAY!\" : played>=3 ? \" — 🎉 Quest complete!\" : \" — \" + (3-played) + \" more for the quest\");\n}\ndocument.getElementById(\"dayLine\").textContent = \"☀️ Today's Challenges — Day #\" + PD.dailyNumber();\ndocument.getElementById(\"filters\").addEventListener(\"click\", e => {\n  if (e.target.tagName !== \"BUTTON\") return;\n  document.querySelectorAll(\"#filters button\").forEach(b => { b.classList.remove(\"active\"); b.setAttribute(\"aria-pressed\",\"false\"); });\n  e.target.classList.add(\"active\"); e.target.setAttribute(\"aria-pressed\",\"true\");\n  render(e.target.dataset.f);\n});\nrender();\ndocument.getElementById(\"surpriseBtn\").addEventListener(\"click\", () => {\n  const fresh = GAMES.filter(g => !PD.playedToday(g.key));\n  const pool = fresh.length ? fresh : GAMES;\n  PD.go(pool[Math.floor(Math.random()*pool.length)].file);\n});\nconst bootDay = PD.todayStr();\nfunction tickReset(){\n  if (PD.todayStr() !== bootDay) { location.reload(); return; }\n  let sec = Math.ceil(PD.nextResetMs()/1000);\n  const h = String(Math.floor(sec/3600)).padStart(2,\"0\"),\n        m = String(Math.floor(sec%3600/60)).padStart(2,\"0\"),\n        s2 = String(sec%60).padStart(2,\"0\");\n  document.getElementById(\"resetLine\").textContent = \"↻ New challenges in \" + h + \":\" + m + \":\" + s2 + \" • 00:00 UTC 🌍\";\n}\ntickReset(); setInterval(tickReset, 1000);\n/* Service Worker registration lives in assets/engine.js so direct game links get offline mode too. */\n","css":"\n  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px;margin-top:14px}\n  .gcard{background:linear-gradient(180deg,#ffffff17,#ffffff0a);border:1.5px solid #ffffff22;border-radius:21px;padding:18px;position:relative;transition:.16s;overflow:hidden}\n  .gcard:before{content:\"\";position:absolute;inset:-40% -20% auto;height:110px;background:radial-gradient(closest-side,var(--glow,#facc1555),transparent);opacity:.5}\n  .gcard:hover{transform:translateY(-4px);border-color:#ffffff55}\n  .gcard .rank{position:absolute;top:13px;right:15px;font-size:11px;font-weight:900;opacity:.55}\n  .gcard .em{font-size:48px;position:relative}\n  .gcard h3{margin:7px 0 4px;font-size:19px;position:relative}\n  .gcard p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55;min-height:42px;position:relative}\n  .gcard .cat{font-size:10.5px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:#fde68a;position:relative}\n  .gcard .done{position:absolute;top:12px;left:14px;background:#16a34a;color:#fff;font-size:10.5px;font-weight:900;border-radius:999px;padding:4px 9px;display:none}\n  .gcard .best{font-size:12px;color:#fde68a;font-weight:800;margin-top:8px;position:relative;min-height:15px}\n  .gcard a.act{margin-top:10px;position:relative}\n  .quest{text-align:center;margin:16px auto 6px;max-width:520px}\n  .quest .progress{margin:8px 0 5px}\n  .filters{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:14px}\n  .filters button{border:1.5px solid var(--line);background:var(--card);color:#fff;border-radius:999px;padding:7px 15px;font-weight:900;font-size:13px;cursor:pointer}\n  .filters button.active{background:var(--gold);color:#422006;border-color:var(--gold)}\n  .why{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px;margin-top:22px}\n  .why div{background:#ffffff0d;border:1px solid var(--line);border-radius:16px;padding:14px;font-size:13.5px;line-height:1.6}\n  .why b{display:block;font-size:15px;margin-bottom:3px}\n  .bigday{text-align:center;font-size:21px;font-weight:900;color:#fde68a;margin-top:16px}\n  .heroArt{font-size:42px;line-height:1.15}\n  .quick{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;max-width:520px;margin:12px auto 2px}\n  .resetLine{text-align:center;color:var(--muted);font-size:12.5px;font-weight:700;margin-top:3px}\n  .filters{position:sticky;top:8px;z-index:20;background:rgba(10,17,40,.88);backdrop-filter:blur(10px);padding:8px;border-radius:999px;border:1px solid #ffffff17}\n  #gamesSection{scroll-margin-top:74px}\n  @media (max-width:560px){\n    .heroArt{font-size:28px}\n    .hero h1{font-size:26px;line-height:1.14;margin:4px 0 6px}\n    .hero .tag{font-size:12.5px;line-height:1.42;margin-bottom:5px}\n    .pills{display:flex;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;max-width:none;margin:7px -4px 0;padding:0 4px 3px;scrollbar-width:none}\n    .pills::-webkit-scrollbar{display:none}\n    .pills i{font-size:11px;padding:5px 9px;text-align:center;flex:0 0 auto;white-space:nowrap}\n    .quick{grid-template-columns:1fr 1fr;margin-top:8px}\n    .quick .act{font-size:13.5px;padding:10px 7px;min-height:44px}\n    .quest{padding:10px 12px;margin-top:11px}\n    .quest .questTitle{font-size:14px}\n    .quest .progress{margin:6px 0 4px}\n    .filters{display:flex;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;border-radius:999px;scrollbar-width:none;margin-top:10px}\n    .filters::-webkit-scrollbar{display:none}\n    .filters button{min-height:40px;flex:0 0 auto;white-space:nowrap}\n    .bigday{font-size:18px;margin-top:11px}\n    .resetLine{font-size:11.5px}\n    #gamesSection{scroll-margin-top:62px}\n  }\n"},"blockfit":{"title":"BlockFit Daily 🧩 — Fit the Blocks, Blast the Lines!","body":"<div class=\"wrap\">\n  <nav class=\"topbar\" aria-label=\"Arcade navigation\"><a class=\"back\" href=\"../index.html\">⬅ Arcade<\/a><span class=\"brand\">🎮 Play<b>Daily10<\/b><\/span><button class=\"iconbtn\" id=\"soundBtn\" title=\"Sound\">🔊<\/button><\/nav>\n  <main>\n  <header class=\"hero\">\n    <div style=\"font-size:42px\">🧩<\/div>\n    <h1>Block<span class=\"grad\">Fit<\/span> Daily<\/h1>\n    <p class=\"tag\"><b>Drag<\/b> a block onto the board (or tap a block, then tap the board).<br>Fill a whole row or column to <b>blast it!<\/b> 💥<\/p>\n  <\/header>\n  <noscript><p class=\"banner target\">JavaScript is required to play this game. Please enable JavaScript and reload.<\/p><\/noscript>\n\n  <div id=\"challBanner\"><\/div>\n  <div class=\"modes\">\n    <button id=\"mDaily\" class=\"active\" onclick=\"setMode('daily')\">☀️ Daily #<span id=\"dNum\"><\/span><\/button>\n    <button id=\"mFree\" onclick=\"setMode('free')\">♾️ Free Play<\/button>\n  <\/div>\n\n  <div class=\"stats\">\n    <div class=\"stat\"><b id=\"score\">0<\/b><span>Score<\/span><\/div>\n    <div class=\"stat\"><b id=\"best\">0<\/b><span>Best<\/span><\/div>\n    <div class=\"stat\"><b id=\"lines\">0<\/b><span>Lines<\/span><\/div>\n    <div class=\"stat\"><b id=\"streak\">🔥0<\/b><span>Streak<\/span><\/div>\n  <\/div>\n\n  <div class=\"panel\">\n    <div id=\"board\"><\/div>\n    <div class=\"msg\" id=\"msg\"><\/div>\n    <div id=\"tray\"><\/div>\n    <div class=\"toolbar\">\n      <button onclick=\"undo()\" id=\"undoBtn\">↩️ Undo<\/button>\n      <button onclick=\"hint()\">💡 Hint<\/button>\n      <button onclick=\"newGame()\">🔄 Restart<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"btns\">\n    <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n    <button class=\"act primary\" onclick=\"newGame()\">🎮 New Game<\/button>\n    <button class=\"act ghost\" onclick=\"challengeMe()\">⚔️ Challenge a Friend<\/button>\n    <button class=\"act ghost\" onclick=\"PD.whatsapp(shareText())\">💬 WhatsApp<\/button>\n  <\/div>\n\n  <details class=\"howto\"><summary>🎮 How to Play (10 seconds)<\/summary>\n    <ul>\n      <li><b>Drag<\/b> any of the 3 blocks onto the 8×8 board — or tap a block, then tap where it should go.<\/li>\n      <li>Complete a <b>full row or column<\/b> and it blasts away. Two lines at once = 4× points, three = 9×!<\/li>\n      <li>Clearing lines on back-to-back moves builds a <b>streak bonus<\/b> 🔥<\/li>\n      <li>Blocks <b>cannot rotate<\/b> — plan ahead and always keep a corner free for the big 3×3!<\/li>\n      <li>☀️ <b>Daily:<\/b> the whole world receives the pieces in the same order. Outscore everyone!<\/li>\n      <li>Game ends when none of your 3 blocks fits anywhere.<\/li>\n    <\/ul>\n  <\/details>\n  <\/main>\n  <footer>🧩 Puzzle • Game #1 of 10 • <a href=\"../index.html\">Play the other 9 today →<\/a><\/footer>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\"><div class=\"modal\">\n  <div class=\"big\" id=\"ovEmoji\">🧩<\/div><h2 id=\"ovTitle\"><\/h2><p id=\"ovText\"><\/p>\n  <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n  <button class=\"act primary\" onclick=\"PD.hideModal();newGame()\">▶️ Play Again<\/button>\n  <button class=\"act ghost\" onclick=\"PD.hideModal()\">👀 View Board<\/button>\n<\/div><\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>","js":"\nconst GAME=\"blockfit\", N=8;\nconst COLORS=[\"#ef4444\",\"#f97316\",\"#eab308\",\"#22c55e\",\"#38bdf8\",\"#a78bfa\",\"#f472b6\"];\nconst CEMOJI=[\"🟥\",\"🟧\",\"🟨\",\"🟩\",\"🟦\",\"🟪\",\"🩷\"];\nconst SHAPES=[\n [\"X\"],[\"XX\"],[\"X\",\"X\"],[\"XXX\"],[\"X\",\"X\",\"X\"],[\"XXXX\"],[\"X\",\"X\",\"X\",\"X\"],[\"XXXXX\"],[\"X\",\"X\",\"X\",\"X\",\"X\"],\n [\"XX\",\"XX\"],[\"XXX\",\"XXX\"],[\"XX\",\"XX\",\"XX\"],[\"XXX\",\"XXX\",\"XXX\"],\n [\"XX\",\"X.\"],[\"XX\",\".X\"],[\"X.\",\"XX\"],[\".X\",\"XX\"],\n [\"X.\",\"X.\",\"XX\"],[\".X\",\".X\",\"XX\"],[\"XX\",\"X.\",\"X.\"],[\"XX\",\".X\",\".X\"],\n [\"XXX\",\"X..\"],[\"XXX\",\"..X\"],[\"X..\",\"XXX\"],[\"..X\",\"XXX\"],\n [\"XXX\",\".X.\"],[\".X.\",\"XXX\"],[\"X.\",\"XX\",\"X.\"],[\".X\",\"XX\",\".X\"],\n [\"XX.\",\".XX\"],[\".XX\",\"XX.\"],[\"X.\",\"XX\",\".X\"],[\".X\",\"XX\",\"X.\"]\n].map(rows=>{const cells=[];rows.forEach((r,y)=>[...r].forEach((ch,x)=>ch===\"X\"&&cells.push([y,x])));\n  return{cells,h:rows.length,w:Math.max(...rows.map(r=>r.length))}});\nlet board,score,moves,lines,clearStreak,mode=\"daily\",rng,seq,nextIdx,tray,selected=-1,undoStack=[],drag=null,over=false,currentSeed=\"\",busy=false,runId=0;\nlet beat=PD.challengeBanner(), challSeed=PD.challengeSeed();\ndocument.getElementById(\"dNum\").textContent=PD.dailyNumber();\n\nfunction pieceAt(i){\n  while(seq.length<=i){\n    const si=Math.floor(rng()*SHAPES.length);\n    seq.push({shape:SHAPES[si],color:Math.floor(rng()*COLORS.length)});\n  } return seq[i];\n}\nfunction setMode(m){mode=m; beat=(m===\"daily\")?PD.challengeBanner():null; if(m!==\"daily\"){const cb=document.getElementById(\"challBanner\"); if(cb)cb.className=\"banner\";}document.getElementById(\"mDaily\").classList.toggle(\"active\",m===\"daily\");\n  document.getElementById(\"mFree\").classList.toggle(\"active\",m===\"free\");newGame();}\nfunction newGame(){\n  runId++; busy=false;\n  if(drag){drag.fl.remove();drag=null;window.removeEventListener(\"pointermove\",moveDrag)}\n  board=Array.from({length:N},()=>Array(N).fill(-1));\n  score=0;moves=0;lines=0;clearStreak=0;seq=[];nextIdx=3;undoStack=[];selected=-1;over=false;\n  currentSeed=(mode===\"daily\"&&challSeed)||(mode===\"daily\"?\"blockfit-\"+PD.todayStr():\"blockfit-free-\"+Date.now());\n  rng=PD.rngFrom(currentSeed); tray=[0,1,2]; tray.forEach(pieceAt);\n  PD.hideModal(); render();\n  setMsg(mode===\"daily\"?\"☀️ Daily #\"+PD.dailyNumber()+\" — same pieces for the whole world!\":\"♾️ Free play — good luck!\");\n}\nfunction setMsg(t){document.getElementById(\"msg\").textContent=t}\nfunction stats(){\n  document.getElementById(\"score\").textContent=PD.fmt(score);\n  document.getElementById(\"best\").textContent=PD.fmt(PD.get(PD.bestKey(GAME)));\n  document.getElementById(\"lines\").textContent=lines;\n  document.getElementById(\"streak\").textContent=\"🔥\"+PD.streak(GAME);\n  document.getElementById(\"undoBtn\").disabled=!undoStack.length;\n}\nfunction cellEl(r,c){return document.querySelector(`.bcell[data-r=\"${r}\"][data-c=\"${c}\"]`)}\nfunction render(placedCells=[]){\n  const fk=document.activeElement?.dataset?.kb;\n  const b=document.getElementById(\"board\"); b.innerHTML=\"\";\n  for(let r=0;r<N;r++)for(let c=0;c<N;c++){\n    const d=document.createElement(\"div\");d.className=\"bcell\";d.dataset.r=r;d.dataset.c=c;\n    if(board[r][c]>=0){d.style.background=`linear-gradient(145deg,${COLORS[board[r][c]]}dd,${COLORS[board[r][c]]}88)`;d.style.borderColor=\"#ffffff35\"}\n    if(placedCells.some(([rr,cc])=>rr===r&&cc===c))d.classList.add(\"placed\");\n    d.tabIndex=-1; d.dataset.kb=\"cell-\"+r+\"-\"+c; d.setAttribute(\"role\",\"button\");\n    d.setAttribute(\"aria-label\",\"Board row \"+(r+1)+\", column \"+(c+1)+(board[r][c]>=0?\", filled\":\", empty\"));\n    d.addEventListener(\"pointerdown\",e=>{if(e.button>0)return;if(selected>=0)tryPlace(selected,r,c)});\n    d.addEventListener(\"pointerenter\",()=>{if(selected>=0&&tray[selected]!==null)showGhost(pieceAt(tray[selected]),r,c)});\n    d.addEventListener(\"focus\",()=>{if(selected>=0&&tray[selected]!==null)showGhost(pieceAt(tray[selected]),r,c)});\n    d.addEventListener(\"keydown\",e=>{\n      if(e.code===\"Space\"||e.code===\"Enter\"){e.preventDefault();if(selected>=0)tryPlace(selected,r,c);return}\n      const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.code];\n      if(mv){e.preventDefault();cellEl(Math.max(0,Math.min(N-1,r+mv[0])),Math.max(0,Math.min(N-1,c+mv[1])))?.focus();}\n    });\n    b.appendChild(d);\n  }\n  const t=document.getElementById(\"tray\"); t.innerHTML=\"\";\n  tray.forEach((pi,slot)=>{\n    const s=document.createElement(\"div\");s.className=\"slot\"+(pi===null?\" used\":\"\")+(selected===slot?\" sel\":\"\");\n    s.innerHTML=`<span class=\"pno\">BLOCK ${slot+1}<\/span>`;\n    if(pi!==null){\n      const p=pieceAt(pi); s.appendChild(pieceEl(p, Math.min(19, 84/p.shape.w, 74/p.shape.h)));\n      s.tabIndex=0; s.dataset.kb=\"slot-\"+slot; s.setAttribute(\"role\",\"button\");\n      const shapeDesc=Array.from({length:p.shape.h},(_,y)=>\"row \"+(y+1)+\": \"+Array.from({length:p.shape.w},(_,x)=>p.shape.cells.some(([cy,cx])=>cy===y&&cx===x)?\"filled\":\"empty\").join(\" \")).join(\"; \");\n      s.setAttribute(\"aria-label\",\"Block \"+(slot+1)+\": \"+shapeDesc+(selected===slot?\", selected\":\", press Enter to select\"));\n      s.addEventListener(\"pointerdown\",e=>startDrag(e,slot));\n      s.addEventListener(\"keydown\",e=>{if(e.code===\"Space\"||e.code===\"Enter\"){e.preventDefault();if(busy||over)return;selected=(selected===slot?-1:slot);PD.sfx.click();render();if(selected>=0)cellEl(0,0)?.focus();}});\n    } else s.innerHTML+=\"<span style='font-size:24px;opacity:.5'>✓<\/span>\";\n    t.appendChild(s);\n  });\n  if(fk)document.querySelector(`[data-kb=\"${fk}\"]`)?.focus({preventScroll:true});\n  stats();\n}\nfunction pieceEl(p,cell){\n  const d=document.createElement(\"div\");d.className=\"piece\";\n  d.style.gridTemplateColumns=`repeat(${p.shape.w},${cell}px)`;\n  const set=new Set(p.shape.cells.map(([y,x])=>y+\",\"+x));\n  for(let y=0;y<p.shape.h;y++)for(let x=0;x<p.shape.w;x++){\n    const q=document.createElement(\"div\");q.style.width=q.style.height=cell+\"px\";\n    if(set.has(y+\",\"+x))q.style.background=`linear-gradient(145deg,${COLORS[p.color]},${COLORS[p.color]}99)`;\n    else q.className=\"off\";\n    d.appendChild(q);\n  } return d;\n}\nfunction canPlace(p,R,C){\n  return p.shape.cells.every(([y,x])=>{const r=R+y,c=C+x;return r>=0&&r<N&&c>=0&&c<N&&board[r][c]===-1});\n}\nfunction clearGhost(){document.querySelectorAll(\".bcell.ghost-ok,.bcell.ghost-bad\").forEach(e=>e.classList.remove(\"ghost-ok\",\"ghost-bad\"))}\nfunction showGhost(p,R,C){\n  clearGhost(); if(!p)return;\n  const ok=canPlace(p,R,C);\n  p.shape.cells.forEach(([y,x])=>{const e=cellEl(R+y,C+x); e&&e.classList.add(ok?\"ghost-ok\":\"ghost-bad\")});\n}\n/* ---------- Drag & drop ---------- */\nfunction cancelDrag(){\n  window.removeEventListener(\"pointermove\",moveDrag);\n  if(drag){drag.fl.remove();drag=null} clearGhost();\n}\nfunction startDrag(e,slot){\n  if(busy||over||tray[slot]===null)return;\n  e.preventDefault();\n  const p=pieceAt(tray[slot]);\n  const boardEl=document.getElementById(\"board\"), rect=boardEl.getBoundingClientRect();\n  const cell=rect.width/N;\n  const fl=pieceEl(p,cell-5); fl.id=\"floater\"; document.body.appendChild(fl);\n  drag={slot,p,fl,cell,sx:e.clientX,sy:e.clientY,anchor:null,moved:false};\n  moveDrag(e);\n  window.addEventListener(\"pointermove\",moveDrag);\n  window.addEventListener(\"pointerup\",endDrag,{once:true});\n  window.addEventListener(\"pointercancel\",cancelDrag,{once:true});\n}\nfunction moveDrag(e){\n  if(!drag)return;\n  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8)drag.moved=true;\n  const w=drag.p.shape.w*drag.cell,h=drag.p.shape.h*drag.cell;\n  const left=e.clientX-w/2, top=e.clientY-h-44;\n  drag.fl.style.left=left+\"px\"; drag.fl.style.top=top+\"px\";\n  const rect=document.getElementById(\"board\").getBoundingClientRect();\n  const C=Math.round((left-rect.left)/drag.cell), R=Math.round((top-rect.top)/drag.cell);\n  drag.anchor=[R,C]; showGhost(drag.p,R,C);\n}\nfunction endDrag(){\n  window.removeEventListener(\"pointermove\",moveDrag);\n  window.removeEventListener(\"pointercancel\",cancelDrag);\n  if(!drag)return;\n  const {slot,anchor,moved}=drag; drag.fl.remove(); drag=null; clearGhost();\n  if(!moved){ selected = selected===slot ? -1 : slot; PD.sfx.click(); render();\n    setMsg(selected>=0?\"👆 Block \"+(slot+1)+\" selected — tap the board to place it\":\"\"); return; }\n  if(anchor) tryPlace(slot,anchor[0],anchor[1],true);\n}\n/* ---------- Core ---------- */\nfunction snapshot(){return JSON.stringify({board,score,moves,lines,clearStreak,tray,nextIdx})}\nasync function tryPlace(slot,R,C,fromDrag=false){\n  if(busy||over||slot<0||tray[slot]===null)return;\n  const p=pieceAt(tray[slot]);\n  if(!canPlace(p,R,C)){ if(fromDrag||selected>=0){PD.toast(\"🚫 It doesn't fit there\");PD.sfx.bad();} render(); return; }\n  busy=true; const myRun=runId;\n  undoStack.push(snapshot()); if(undoStack.length>25)undoStack.shift();\n  const placed=p.shape.cells.map(([y,x])=>{board[R+y][C+x]=p.color;return[R+y,C+x]});\n  score+=placed.length; moves++; selected=-1; PD.sfx.pop(2);\n  render(placed); await PD.sleep(160);\n  if(myRun!==runId)return;\n  // find full lines\n  const rows=[],cols=[];\n  for(let r=0;r<N;r++)if(board[r].every(v=>v>=0))rows.push(r);\n  for(let c=0;c<N;c++)if(board.every(row=>row[c]>=0))cols.push(c);\n  const total=rows.length+cols.length;\n  if(total){\n    rows.forEach(r=>{for(let c=0;c<N;c++)cellEl(r,c)?.classList.add(\"flash\")});\n    cols.forEach(c=>{for(let r=0;r<N;r++)cellEl(r,c)?.classList.add(\"flash\")});\n    PD.sfx.good(); await PD.sleep(260);\n    if(myRun!==runId)return;\n    rows.forEach(r=>board[r].fill(-1)); cols.forEach(c=>board.forEach(row=>row[c]=-1));\n    clearStreak++; lines+=total;\n    const pts=total*total*10+(clearStreak>1?(clearStreak-1)*10:0); score+=pts;\n    setMsg(total>1?`💥 ${total} LINES AT ONCE! +${pts}`:`💥 Line blasted! +${pts}`+(clearStreak>1?` • 🔥 Streak ×${clearStreak}`:\"\"));\n    if(total>=2)PD.celebrate([\"🧩\",\"💥\",\"⭐\"],16);\n  } else { clearStreak=0; setMsg(\"\"); }\n  tray[slot]=null;\n  if(tray.every(v=>v===null)){ tray=[nextIdx,nextIdx+1,nextIdx+2]; nextIdx+=3; tray.forEach(pieceAt); }\n  busy=false;\n  PD.saveBest(GAME,score); render();\n  if(!anyMoveLeft()) gameOver();\n}\nfunction anyMoveLeft(){\n  return tray.some(pi=>{ if(pi===null)return false; const p=pieceAt(pi);\n    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(canPlace(p,r,c))return true; return false; });\n}\nfunction undo(){\n  if(busy||!undoStack.length||over)return;\n  const s=JSON.parse(undoStack.pop());\n  ({board,score,moves,lines,clearStreak,tray,nextIdx}=s); selected=-1; render(); setMsg(\"↩️ Undone!\"); PD.sfx.click();\n}\nfunction hint(){\n  if(busy||over)return;\n  let bestFit=null,bestScore=-1e9;\n  tray.forEach((pi,slot)=>{ if(pi===null)return; const p=pieceAt(pi);\n    for(let R=0;R<N;R++)for(let C=0;C<N;C++){\n      if(!canPlace(p,R,C))continue;\n      const sim=board.map(r=>[...r]); p.shape.cells.forEach(([y,x])=>sim[R+y][C+x]=p.color);\n      let ln=0; for(let r=0;r<N;r++)if(sim[r].every(v=>v>=0))ln++;\n      for(let c=0;c<N;c++)if(sim.every(r2=>r2[c]>=0))ln++;\n      let touch=0; p.shape.cells.forEach(([y,x])=>{[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dy,dx])=>{\n        const r=R+y+dy,c=C+x+dx; if(r>=0&&r<N&&c>=0&&c<N&&board[r][c]>=0)touch++})});\n      const sc=ln*100+touch;\n      if(sc>bestScore){bestScore=sc;bestFit={slot,p,R,C,ln}}\n    }});\n  if(!bestFit){PD.toast(\"😬 No moves left…\");return}\n  selected=bestFit.slot; render(); showGhost(bestFit.p,bestFit.R,bestFit.C);\n  setMsg(\"💡 Try Block \"+(bestFit.slot+1)+\" where it glows\"+(bestFit.ln?\" — it blasts \"+bestFit.ln+\" line(s)!\":\"\"));\n  PD.sfx.click();\n}\nfunction gameOver(){\n  over=true; if(mode===\"daily\")PD.markPlayed(GAME); PD.saveBest(GAME,score); stats(); PD.sfx.bad();\n  const medal=score>=1200?\"🥇 LEGENDARY!\":score>=700?\"🥈 Excellent!\":score>=350?\"🥉 Great job!\":\"🌱 Good start!\";\n  PD.showModal(\"🧩\",\"No More Fits — Game Over!\",\n    \"Score: <b>\"+PD.fmt(score)+\"<\/b> • Lines blasted: \"+lines+\" • Blocks placed: \"+moves+\n    \"<br>\"+medal+PD.challengeResultLine(score,beat)+\"<br>Tip: always save a 3×3 corner for the giant square!\");\n}\nfunction shareText(){\n  return \"🧩 BlockFit \"+(mode===\"daily\"?\"Daily #\"+PD.dailyNumber():\"Free Play\")+\"\\nScore: \"+PD.fmt(score)+\n   \" | Lines: \"+lines+\" | 🔥\"+PD.streak(GAME)+\"\\n\\n\"+\n   board.map(r=>r.map(v=>v<0?\"⬛\":CEMOJI[v]).join(\"\")).join(\"\\n\")+\"\\n\\nSame pieces, same order — beat my score! 👇\"}\nfunction challengeMe(){if(mode!==\"daily\"){PD.toast(\"☀️ Switch to Daily mode to create a fair, same-rules challenge\");return} PD.challengeLink(score,currentSeed)}\nfunction doShare(){PD.share(shareText(),\"BlockFit Daily 🧩\")}\nnewGame();\n","css":"\n  #board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;touch-action:none}\n  .bcell{aspect-ratio:1;border-radius:9px;background:#ffffff0e;border:1px solid #ffffff10;transition:background .08s}\n  .bcell.ghost-ok{background:#4ade80aa!important;box-shadow:inset 0 0 0 2px #bbf7d0}\n  .bcell.ghost-bad{background:#f87171aa!important}\n  .bcell.flash{animation:flash .18s infinite alternate}\n  @keyframes flash{from{filter:brightness(1)}to{filter:brightness(1.9)}}\n  .bcell.placed{animation:pl .2s ease}\n  @keyframes pl{from{transform:scale(.6)}to{transform:scale(1)}}\n  #tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}\n  .slot{background:#0000002c;border:1.5px dashed #ffffff2c;border-radius:16px;min-height:104px;display:flex;align-items:center;justify-content:center;touch-action:none;position:relative}\n  .slot.used{opacity:.35}\n  .slot.sel{border-color:var(--gold);border-style:solid;box-shadow:0 0 0 2px #facc1555}\n  .slot .pno{position:absolute;top:5px;left:9px;font-size:10px;font-weight:900;opacity:.55}\n  .piece{display:grid;gap:3px;cursor:grab;touch-action:none}\n  .piece div{border-radius:5px}\n  .piece .off{visibility:hidden}\n  #floater{position:fixed;z-index:80;pointer-events:none;filter:drop-shadow(0 10px 14px #000a);opacity:.96}\n  .toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:11px}\n  .toolbar button{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:12px;padding:10px 4px;font-weight:900;cursor:pointer;font-size:13px}\n"},"colorsort":{"title":"ColorSort Daily 🧪 — Sort Every Color Into Its Own Tube!","body":"<div class=\"wrap\">\n  <nav class=\"topbar\" aria-label=\"Arcade navigation\"><a class=\"back\" href=\"../index.html\">⬅ Arcade<\/a><span class=\"brand\">🎮 Play<b>Daily10<\/b><\/span><button class=\"iconbtn\" id=\"soundBtn\" title=\"Sound\">🔊<\/button><\/nav>\n  <main>\n  <header class=\"hero\">\n    <div style=\"font-size:42px\">🧪<\/div>\n    <h1>Color<span class=\"grad\">Sort<\/span> Daily<\/h1>\n    <p class=\"tag\">Tap a tube, then tap another to <b>pour<\/b>.<br>Win when every tube holds <b>one single color<\/b>.<\/p>\n  <\/header>\n  <noscript><p class=\"banner target\">JavaScript is required to play this game. Please enable JavaScript and reload.<\/p><\/noscript>\n\n  <div id=\"challBanner\"><\/div>\n  <div class=\"modes\">\n    <button id=\"mDaily\" class=\"active\" onclick=\"setMode('daily')\">☀️ Daily #<span id=\"dNum\"><\/span><\/button>\n    <button id=\"mFree\" onclick=\"setMode('free4')\">🎲 Free (4 colors)<\/button>\n    <button id=\"mExp\" onclick=\"setMode('free5')\">🔥 Expert (5)<\/button>\n  <\/div>\n\n  <div class=\"stats\">\n    <div class=\"stat\"><b id=\"moves\">0<\/b><span>Moves<\/span><\/div>\n    <div class=\"stat\"><b id=\"par\">–<\/b><span>Par<\/span><\/div>\n    <div class=\"stat\"><b id=\"time\">0:00<\/b><span>Time<\/span><\/div>\n    <div class=\"stat\"><b id=\"best\">0<\/b><span>Best Score<\/span><\/div>\n  <\/div>\n\n  <div class=\"panel\">\n    <div id=\"lab\"><\/div>\n    <div class=\"msg\" id=\"msg\">Generating today's puzzle…<\/div>\n    <div class=\"toolbar\">\n      <button onclick=\"undo()\" id=\"undoBtn\">↩️ Undo<\/button>\n      <button onclick=\"hint()\">💡 Hint (−75)<\/button>\n      <button onclick=\"addTube()\" id=\"tubeBtn\">🧪 +Tube (−150)<\/button>\n      <button onclick=\"newGame()\">🔄 Restart<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"btns\">\n    <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n    <button class=\"act primary\" onclick=\"newGame()\">🎮 New Puzzle<\/button>\n    <button class=\"act ghost\" onclick=\"PD.challengeLink(lastScore,currentSeed)\">⚔️ Challenge a Friend<\/button>\n    <button class=\"act ghost\" onclick=\"PD.whatsapp(shareText())\">💬 WhatsApp<\/button>\n  <\/div>\n\n  <details class=\"howto\"><summary>🎮 How to Play (10 seconds)<\/summary>\n    <ul>\n      <li><b>Tap a tube<\/b> to pick it up, then <b>tap a destination<\/b> to pour.<\/li>\n      <li>You may pour onto the <b>same color<\/b>, or into an <b>empty tube<\/b>. Only the top matching layer pours.<\/li>\n      <li>Sort so each color sits alone in a full tube. Fewer moves than <b>Par<\/b> = bonus score!<\/li>\n      <li>Every daily puzzle is <b>verified solvable by our solver<\/b> before you ever see it — it's always possible!<\/li>\n      <li>Stuck? A <b>💡 Hint<\/b> shows a proven good move, and <b>🧪 +Tube<\/b> adds an emergency empty tube (once per game).<\/li>\n    <\/ul>\n  <\/details>\n  <\/main>\n  <footer>🧩 Puzzle • Game #4 of 10 • <a href=\"../index.html\">Play the other 9 today →<\/a><\/footer>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\"><div class=\"modal\">\n  <div class=\"big\" id=\"ovEmoji\">🧪<\/div><h2 id=\"ovTitle\"><\/h2><p id=\"ovText\"><\/p>\n  <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n  <button class=\"act primary\" onclick=\"PD.hideModal();newGame()\">▶️ Play Again<\/button>\n  <button class=\"act ghost\" onclick=\"PD.hideModal()\">👀 View Tubes<\/button>\n<\/div><\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>","js":"\nconst GAME=\"colorsort\", CAP=4;\nconst COLORS=[\"#ef4444\",\"#38bdf8\",\"#22c55e\",\"#eab308\",\"#a855f7\",\"#f472b6\"];\nconst CEMOJI=[\"🟥\",\"🟦\",\"🟩\",\"🟨\",\"🟪\",\"🩷\"];\nconst SYMBOLS=[\"●\",\"▲\",\"■\",\"◆\",\"★\",\"♥\"]; // colorblind-safe: every color also has a shape\nconst COLORNAMES=[\"red\",\"sky blue\",\"green\",\"yellow\",\"purple\",\"pink\"];\nlet tubes,par,mode=\"daily\",nColors=4,selected=-1,movesN=0,hints=0,extraUsed=false,genRun=0,\n    undoStack=[],timerInt=null,startAt=null,elapsed=0,wonGame=false,lastScore=0,currentSeed=\"\",hintMark=null;\nlet beat=PD.challengeBanner(), challSeed=PD.challengeSeed();\ndocument.getElementById(\"dNum\").textContent=PD.dailyNumber();\n\n/* ---------- Solver (BFS) — also guarantees daily puzzles are solvable ---------- */\nconst key=s=>s.map(t=>t.join(\"\")).join(\"|\");\nconst isSolved=s=>s.every(t=>t.length===0||(t.length===CAP&&t.every(x=>x===t[0])));\nfunction topRun(t){let n=1;for(let i=t.length-2;i>=0;i--){if(t[i]===t[t.length-1])n++;else break}return n}\nfunction genMoves(s){\n  const out=[];\n  for(let i=0;i<s.length;i++){ let emptyUsed=false;\n    const a=s[i]; if(!a.length)continue;\n    if(a.length===CAP&&a.every(x=>x===a[0]))continue;\n    const top=a[a.length-1], run=topRun(a), pure=a.every(x=>x===top);\n    for(let j=0;j<s.length;j++){\n      if(i===j)continue; const b=s[j]; if(b.length>=CAP)continue;\n      if(b.length&&b[b.length-1]!==top)continue;\n      if(!b.length){ if(emptyUsed)continue; if(pure)continue; }\n      const amt=Math.min(run,CAP-b.length);\n      const ns=s.map(t=>[...t]); const moved=ns[i].splice(ns[i].length-amt,amt); ns[j].push(...moved);\n      out.push({ns,mv:[i,j]}); if(!b.length)emptyUsed=true;\n    }\n  } return out;\n}\nfunction solve(s,maxNodes=160000){\n  if(isSolved(s))return[];\n  const parent=new Map([[key(s),null]]), moveTo=new Map();\n  const q=[s]; let head=0,nodes=0;\n  while(head<q.length){\n    const cur=q[head++]; if(++nodes>maxNodes)return null;\n    for(const {ns,mv} of genMoves(cur)){\n      const k=key(ns); if(parent.has(k))continue;\n      parent.set(k,key(cur)); moveTo.set(k,mv);\n      if(isSolved(ns)){ const path=[]; let x=k; while(parent.get(x)){path.push(moveTo.get(x));x=parent.get(x)} return path.reverse(); }\n      q.push(ns);\n    }\n  } return null;\n}\nfunction generate(seedStr,nc){\n  const rng=PD.rngFrom(seedStr);\n  for(let attempt=0;attempt<120;attempt++){\n    const units=[]; for(let c=0;c<nc;c++)for(let i=0;i<CAP;i++)units.push(c);\n    for(let i=units.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[units[i],units[j]]=[units[j],units[i]]}\n    const s=[]; for(let c=0;c<nc;c++)s.push(units.slice(c*CAP,c*CAP+CAP)); s.push([],[]);\n    if(isSolved(s))continue;\n    const sol=solve(s);\n    if(sol&&sol.length>=7)return{state:s,par:sol.length};\n  }\n  // Verified fallback pattern for ANY color count, with its true solver par\n  const fb=[]; for(let i=0;i<nc;i++)fb.push([i,(i+1)%nc,i,(i+1)%nc]); fb.push([],[]);\n  const fsol=solve(fb);\n  if(fsol)return{state:fb,par:fsol.length};\n  // Last resort: solved tubes with only the first two tops swapped (always solvable)\n  const near=[]; for(let i=0;i<nc;i++)near.push([i,i,i,i]); near[0][3]=1; near[1][3]=0; near.push([],[]);\n  const nsol=solve(near); return{state:near,par:nsol?nsol.length:4};\n}\n/* ---------- Game flow ---------- */\nfunction setMode(m){mode=m; beat=(m===\"daily\")?PD.challengeBanner():null; if(m!==\"daily\"){const cb=document.getElementById(\"challBanner\"); if(cb)cb.className=\"banner\";}\n  document.getElementById(\"mDaily\").classList.toggle(\"active\",m===\"daily\");\n  document.getElementById(\"mFree\").classList.toggle(\"active\",m===\"free4\");\n  document.getElementById(\"mExp\").classList.toggle(\"active\",m===\"free5\"); newGame();}\nfunction newGame(){\n  const myGen=++genRun;\n  clearInterval(timerInt); startAt=null; elapsed=0; movesN=0; hints=0; extraUsed=false;\n  undoStack=[]; selected=-1; wonGame=false; lastScore=0; hintMark=null;\n  document.getElementById(\"tubeBtn\").disabled=false;\n  document.getElementById(\"msg\").textContent=\"🧪 Mixing today's colors…\";\n  setTimeout(()=>{\n    if(myGen!==genRun)return;\n    const csParts=(mode===\"daily\"&&challSeed&&challSeed.includes(\"|\"))?challSeed.split(\"|\"):null;\n    const parsedNc=csParts?Number(csParts[0]):NaN;\n    if(csParts&&(parsedNc===4||parsedNc===5)&&csParts[1]){ nColors=parsedNc; currentSeed=challSeed;\n      const g=generate(csParts.slice(1).join(\"|\"),nColors); tubes=g.state; par=g.par; }\n    else{\n      const weekend=[0,5,6].includes(new Date().getUTCDay());\n      nColors = mode===\"daily\" ? (weekend?5:4) : mode===\"free5\" ? 5 : 4;\n      const core = mode===\"daily\" ? \"colorsort-\"+PD.todayStr() : \"colorsort-free-\"+Date.now();\n      currentSeed = nColors+\"|\"+core;\n      const g=generate(core,nColors); tubes=g.state; par=g.par;\n    }\n    PD.hideModal(); render();\n    document.getElementById(\"msg\").textContent = mode===\"daily\"\n      ? \"☀️ Daily puzzle #\"+PD.dailyNumber()+\" — \"+nColors+\" colors, Par \"+par+\". Good luck!\"\n      : \"🎲 Fresh \"+nColors+\"-color puzzle — Par \"+par;\n  },30);\n}\nfunction timerStart(){ if(startAt)return; startAt=Date.now();\n  timerInt=setInterval(()=>{elapsed=Math.floor((Date.now()-startAt)/1000);\n    document.getElementById(\"time\").textContent=Math.floor(elapsed/60)+\":\"+String(elapsed%60).padStart(2,\"0\")},500); }\nfunction render(){\n  const fk=document.activeElement?.dataset?.kb;\n  const lab=document.getElementById(\"lab\"); lab.innerHTML=\"\";\n  tubes.forEach((t,i)=>{\n    const d=document.createElement(\"div\"); d.className=\"tube\"+\n      (selected===i?\" sel\":\"\")+(hintMark&&hintMark[0]===i?\" hintA\":\"\")+(hintMark&&hintMark[1]===i?\" hintB\":\"\");\n    t.forEach(c=>{const s=document.createElement(\"div\");s.className=\"seg\";s.style.background=COLORS[c];s.textContent=SYMBOLS[c];d.appendChild(s)});\n    if(t.length===CAP&&t.every(x=>x===t[0]))d.innerHTML+='<div class=\"doneBadge\">✅<\/div>';\n    d.tabIndex=0; d.dataset.kb=\"tube-\"+i; d.setAttribute(\"role\",\"button\");\n    d.setAttribute(\"aria-label\",\"Tube \"+(i+1)+(t.length?\": bottom to top: \"+t.map(c=>COLORNAMES[c]).join(\", \"):\": empty\")+(selected===i?\", selected\":\"\"));\n    d.onclick=()=>tapTube(i);\n    d.onkeydown=e=>{if(e.code===\"Space\"||e.code===\"Enter\"){e.preventDefault();tapTube(i)}\n      if(e.code===\"ArrowRight\")document.querySelector('[data-kb=\"tube-'+Math.min(tubes.length-1,i+1)+'\"]')?.focus();\n      if(e.code===\"ArrowLeft\")document.querySelector('[data-kb=\"tube-'+Math.max(0,i-1)+'\"]')?.focus();};\n    lab.appendChild(d);\n  });\n  if(fk)document.querySelector(`[data-kb=\"${fk}\"]`)?.focus({preventScroll:true});\n  document.getElementById(\"moves\").textContent=movesN;\n  document.getElementById(\"par\").textContent=par??\"–\";\n  document.getElementById(\"best\").textContent=PD.fmt(PD.getBest(GAME,\"daily-c\"+nColors));\n  document.getElementById(\"undoBtn\").disabled=!undoStack.length;\n  if(!startAt)document.getElementById(\"time\").textContent=\"0:00\";\n}\nfunction canPour(i,j){\n  if(i===j||!tubes[i].length||tubes[j].length>=CAP)return false;\n  return !tubes[j].length||tubes[j][tubes[j].length-1]===tubes[i][tubes[i].length-1];\n}\nfunction tapTube(i){\n  if(wonGame)return; hintMark=null;\n  if(selected===-1){ if(!tubes[i].length){PD.toast(\"That tube is empty\");return} selected=i; PD.sfx.click(); render(); return; }\n  if(selected===i){selected=-1;render();return}\n  if(!canPour(selected,i)){ PD.toast(tubes[i].length>=CAP?\"🚫 Tube is full\":\"🚫 You can only pour onto the same color or an empty tube\");\n    PD.sfx.bad(); selected=i; render(); return; }\n  undoStack.push(JSON.stringify({tubes,movesN,extraUsed})); timerStart();\n  const amt=Math.min(topRun(tubes[selected]),CAP-tubes[i].length);\n  const moved=tubes[selected].splice(tubes[selected].length-amt,amt); tubes[i].push(...moved);\n  movesN++; selected=-1; PD.sfx.pop(moved[0]); render();\n  if(isSolved(tubes))onWin();\n}\nfunction undo(){ if(!undoStack.length||wonGame)return; const s=JSON.parse(undoStack.pop());\n  tubes=s.tubes; movesN=s.movesN; extraUsed=!!s.extraUsed;\n  document.getElementById(\"tubeBtn\").disabled=extraUsed;\n  selected=-1; hintMark=null; render(); PD.toast(\"↩️ Undone\"); }\nfunction hint(){\n  if(wonGame)return; timerStart();\n  document.getElementById(\"msg\").textContent=\"💡 Calculating a proven move…\";\n  const myGen=genRun;\n  setTimeout(()=>{\n    if(myGen!==genRun)return;\n    const sol=solve(tubes,90000);\n    if(!sol||!sol.length){document.getElementById(\"msg\").textContent=\"💡 No proven path from here — try Undo a few steps\";return}\n    hints++; hintMark=sol[0]; render();\n    document.getElementById(\"msg\").textContent=\"💡 Pour the yellow-ringed tube into the green-ringed one (−75 pts)\";\n  },30);\n}\nfunction addTube(){\n  if(extraUsed||wonGame)return;\n  undoStack.push(JSON.stringify({tubes,movesN,extraUsed}));\n  tubes.push([]); extraUsed=true; document.getElementById(\"tubeBtn\").disabled=true;\n  render(); PD.toast(\"🧪 Emergency tube added (−150 pts)\");\n}\nfunction onWin(){\n  wonGame=true; clearInterval(timerInt);\n  const secs=startAt?Math.floor((Date.now()-startAt)/1000):0;\n  let sc=1200 - Math.max(0,movesN-par)*25 - hints*75 - (extraUsed?150:0) - Math.floor(secs/5)*2;\n  if(movesN<=par)sc+=250;\n  lastScore=Math.max(100,sc);\n  if(mode===\"daily\")PD.markPlayed(GAME);\n  PD.saveBest(GAME,lastScore,\"daily-c\"+nColors); render(); PD.celebrate([\"🧪\",\"🌈\",\"🎉\"],28);\n  const eff=movesN<=par?\"🏆 At or under Par — masterful!\":movesN<=par+5?\"🥈 Very efficient!\":\"✅ Sorted!\";\n  PD.showModal(\"🧪\",\"All Sorted! 🌈\",\"Score: <b>\"+PD.fmt(lastScore)+\"<\/b> • Moves: \"+movesN+\" (Par \"+par+\") • Time: \"+\n    Math.floor(secs/60)+\":\"+String(secs%60).padStart(2,\"0\")+(hints?\" • Hints: \"+hints:\"\")+\"<br>\"+eff+PD.challengeResultLine(lastScore,beat));\n}\nfunction tubesEmoji(){\n  const rows=[];\n  for(let level=CAP-1;level>=0;level--)rows.push(tubes.map(t=>level<t.length?CEMOJI[t[level]]:\"⬛\").join(\"\"));\n  return rows.join(\"\\n\");\n}\nfunction shareText(){\n  return \"🧪 ColorSort \"+(mode===\"daily\"?\"Daily #\"+PD.dailyNumber():\"Free\")+\"\\n\"+\n   (wonGame?(\"✅ Solved! Score: \"+PD.fmt(lastScore)+\" • Moves: \"+movesN+\" (Par \"+par+\")\"):\"Moves so far: \"+movesN+\" (Par \"+par+\")\")+\n   \" • 🔥\"+PD.streak(GAME)+\"\\n\\n\"+tubesEmoji()+\"\\n\\nSame puzzle — sort it in fewer moves! 👇\"}\nfunction doShare(){PD.share(shareText(),\"ColorSort Daily 🧪\")}\nnewGame();\n","css":"\n  #lab{background:linear-gradient(180deg,#0ea5e918,#a855f714);border-radius:18px;padding:20px 8px 16px;display:flex;flex-wrap:wrap;gap:16px 12px;justify-content:center}\n  .tube{width:56px;height:196px;border:3.5px solid #e2e8f0cc;border-top:0;border-radius:0 0 26px 26px;position:relative;cursor:pointer;\n    background:linear-gradient(90deg,#ffffff16,#ffffff05 45%,#ffffff20);display:flex;flex-direction:column-reverse;overflow:hidden;transition:transform .16s}\n  .tube:before{content:\"\";position:absolute;top:0;left:-4px;right:-4px;height:7px;border:3px solid #e2e8f0cc;border-bottom:0;border-radius:8px 8px 0 0}\n  .tube.sel{transform:translateY(-15px)}\n  .tube.hintA{box-shadow:0 0 0 3px #facc15;transform:translateY(-10px)}\n  .tube.hintB{box-shadow:0 0 0 3px #22c55e}\n  .seg{height:25%;border-top:1.5px solid #ffffff30;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:900;text-shadow:0 1px 3px #000a}\n  .doneBadge{position:absolute;inset:auto 0 46% 0;text-align:center;font-size:20px;z-index:2}\n  .toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}\n  .toolbar button{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:12px;padding:10px 3px;font-weight:900;cursor:pointer;font-size:12.5px}\n"},"match3":{"title":"Match3 Daily 🍬 — One Board, 25 Moves, Beat the World!","body":"<div class=\"wrap\">\n  <nav class=\"topbar\" aria-label=\"Arcade navigation\"><a class=\"back\" href=\"../index.html\">⬅ Arcade<\/a><span class=\"brand\">🎮 Play<b>Daily10<\/b><\/span><button class=\"iconbtn\" id=\"soundBtn\" title=\"Sound\">🔊<\/button><\/nav>\n  <main>\n  <header class=\"hero\">\n    <div style=\"font-size:42px\">🍬<\/div>\n    <h1>Match<span class=\"grad\">3<\/span> Daily<\/h1>\n    <p class=\"tag\">Swap neighbors to match <b>3+ in a row<\/b>.<br>Daily: <b>same board, 25 moves<\/b> — the whole world vs one scoreboard.<\/p>\n  <\/header>\n  <noscript><p class=\"banner target\">JavaScript is required to play this game. Please enable JavaScript and reload.<\/p><\/noscript>\n\n  <div id=\"challBanner\"><\/div>\n  <div class=\"modes\">\n    <button id=\"mDaily\" class=\"active\" onclick=\"setMode('daily')\">☀️ Daily (25 moves) #<span id=\"dNum\"><\/span><\/button>\n    <button id=\"mFree\" onclick=\"setMode('free')\">♾️ Free (40 moves)<\/button>\n  <\/div>\n  <div class=\"stats\">\n    <div class=\"stat\"><b id=\"score\">0<\/b><span>Score<\/span><\/div>\n    <div class=\"stat\"><b id=\"movesLeft\">25<\/b><span>Moves Left<\/span><\/div>\n    <div class=\"stat\"><b id=\"best\">0<\/b><span>Best<\/span><\/div>\n    <div class=\"stat\"><b id=\"streak\">🔥0<\/b><span>Streak<\/span><\/div>\n  <\/div>\n  <div class=\"targets\" id=\"targets\">\n    <span data-t=\"1200\">🥉 1,200<\/span><span data-t=\"2400\">🥈 2,400<\/span><span data-t=\"3800\">🥇 3,800<\/span><span data-t=\"5500\">👑 5,500<\/span>\n  <\/div>\n\n  <div class=\"panel\">\n    <div id=\"board\"><\/div>\n    <div class=\"msg\" id=\"msg\"><\/div>\n    <div class=\"toolbar\">\n      <button onclick=\"hint()\">💡 Hint (−50 pts)<\/button>\n      <button onclick=\"newGame()\">🔄 Restart<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"btns\">\n    <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n    <button class=\"act primary\" onclick=\"newGame()\">🎮 New Game<\/button>\n    <button class=\"act ghost\" onclick=\"challengeMe()\">⚔️ Challenge a Friend<\/button>\n    <button class=\"act ghost\" onclick=\"PD.whatsapp(shareText())\">💬 WhatsApp<\/button>\n  <\/div>\n\n  <details class=\"howto\"><summary>🎮 How to Play (10 seconds)<\/summary>\n    <ul>\n      <li><b>Swipe<\/b> a candy (or <b>tap two neighbors<\/b>) to swap them.<\/li>\n      <li>Line up <b>3 or more<\/b> of a kind and they pop! New candies rain down.<\/li>\n      <li><b>4-in-a-row<\/b> and <b>5-in-a-row<\/b> pay big bonuses, and chain reactions multiply everything: Chain ×2, ×3… 🔥<\/li>\n      <li>Only swaps that make a match count as a move — failed swaps are free to try.<\/li>\n      <li>No moves possible? The board <b>auto-shuffles for free<\/b>. You can never get stuck.<\/li>\n      <li>☀️ <b>Daily:<\/b> identical starting board + identical refill stream for everyone — pure skill decides the score.<\/li>\n    <\/ul>\n  <\/details>\n  <\/main>\n  <footer>🧩 Puzzle • Game #7 of 10 • <a href=\"../index.html\">Play the other 9 today →<\/a><\/footer>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\"><div class=\"modal\">\n  <div class=\"big\" id=\"ovEmoji\">🍬<\/div><h2 id=\"ovTitle\"><\/h2><p id=\"ovText\"><\/p>\n  <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n  <button class=\"act primary\" onclick=\"PD.hideModal();newGame()\">▶️ Play Again<\/button>\n  <button class=\"act ghost\" onclick=\"PD.hideModal()\">👀 View Board<\/button>\n<\/div><\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>","js":"\nconst GAME=\"match3\", N=8, TYPES=6;\nconst EMOJIS=[\"🍓\",\"🍋\",\"🍇\",\"🍊\",\"🫐\",\"🥝\"];\nconst BGS=[\"linear-gradient(145deg,#7f1d2e,#450a16)\",\"linear-gradient(145deg,#713f12,#422006)\",\"linear-gradient(145deg,#4c1d95,#2e1065)\",\n \"linear-gradient(145deg,#7c2d12,#431407)\",\"linear-gradient(145deg,#1e3a8a,#172554)\",\"linear-gradient(145deg,#14532d,#052e16)\"];\nlet board,score,movesLeft,mode=\"daily\",rng,sel=null,hintCells=[],lock=false,over=false,currentSeed=\"\",startXY=null,runId=0;\nlet beat=PD.challengeBanner(), challSeed=PD.challengeSeed();\ndocument.getElementById(\"dNum\").textContent=PD.dailyNumber();\n\nfunction setMode(m){mode=m; beat=(m===\"daily\")?PD.challengeBanner():null; if(m!==\"daily\"){const cb=document.getElementById(\"challBanner\"); if(cb)cb.className=\"banner\";}document.getElementById(\"mDaily\").classList.toggle(\"active\",m===\"daily\");\n  document.getElementById(\"mFree\").classList.toggle(\"active\",m===\"free\");newGame();}\nfunction rndType(){return Math.floor(rng()*TYPES)}\nfunction findMatches(bd){\n  const set=new Set(); let maxRun=0;\n  for(let r=0;r<N;r++){let run=1;for(let c=1;c<=N;c++){\n    if(c<N&&bd[r][c]===bd[r][c-1]&&bd[r][c]!==null)run++;\n    else{if(run>=3){maxRun=Math.max(maxRun,run);for(let k=1;k<=run;k++)set.add(r+\",\"+(c-k))}run=1}}}\n  for(let c=0;c<N;c++){let run=1;for(let r=1;r<=N;r++){\n    if(r<N&&bd[r][c]===bd[r-1][c]&&bd[r][c]!==null)run++;\n    else{if(run>=3){maxRun=Math.max(maxRun,run);for(let k=1;k<=run;k++)set.add((r-k)+\",\"+c)}run=1}}}\n  return{set,maxRun};\n}\nfunction hasMove(bd){\n  const dirs=[[0,1],[1,0]];\n  for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[dr,dc]of dirs){\n    const r2=r+dr,c2=c+dc; if(r2>=N||c2>=N)continue;\n    [bd[r][c],bd[r2][c2]]=[bd[r2][c2],bd[r][c]];\n    const ok=findMatches(bd).set.size>0;\n    [bd[r][c],bd[r2][c2]]=[bd[r2][c2],bd[r][c]];\n    if(ok)return[[r,c],[r2,c2]];\n  } return null;\n}\nfunction genBoard(){\n  for(let attempt=0;attempt<60;attempt++){\n    const bd=[];\n    for(let r=0;r<N;r++){bd.push([]);for(let c=0;c<N;c++){\n      let t; do{t=rndType()}while((c>=2&&bd[r][c-1]===t&&bd[r][c-2]===t)||(r>=2&&bd[r-1][c]===t&&bd[r-2][c]===t));\n      bd[r].push(t);\n    }}\n    if(hasMove(bd))return bd;\n  }\n  // Guaranteed-valid deterministic fallback (verified: no matches, has a move)\n  const off=Math.floor(rng()*TYPES), bd=[];\n  for(let r=0;r<N;r++){bd.push([]);for(let c=0;c<N;c++)bd[r].push((Math.floor(r/2)+c+off)%TYPES)}\n  return bd;\n}\nfunction newGame(){\n  runId++; startXY=null;\n  currentSeed=(mode===\"daily\"&&challSeed)||(mode===\"daily\"?\"match3-\"+PD.todayStr():\"match3-free-\"+Date.now());\n  rng=PD.rngFrom(currentSeed);\n  board=genBoard();\n  score=0;movesLeft=mode===\"daily\"?25:40;sel=null;hintCells=[];lock=false;over=false;\n  PD.hideModal(); render();\n  setMsg(mode===\"daily\"?\"☀️ Daily board #\"+PD.dailyNumber()+\" — 25 moves. Make them count!\":\"♾️ Free board — 40 moves of candy chaos!\");\n}\nfunction setMsg(t){document.getElementById(\"msg\").textContent=t}\nfunction stats(){\n  document.getElementById(\"score\").textContent=PD.fmt(score);\n  document.getElementById(\"movesLeft\").textContent=movesLeft;\n  document.getElementById(\"best\").textContent=PD.fmt(PD.getBest(GAME,mode));\n  document.getElementById(\"streak\").textContent=\"🔥\"+PD.streak(GAME);\n  document.querySelectorAll(\"#targets span\").forEach(s=>s.classList.toggle(\"hit\",score>=+s.dataset.t));\n}\nfunction render(matchedSet=null){\n  const fk=document.activeElement?.dataset?.kb;\n  const b=document.getElementById(\"board\"); b.innerHTML=\"\";\n  for(let r=0;r<N;r++)for(let c=0;c<N;c++){\n    const d=document.createElement(\"div\"); d.className=\"tile\";\n    const v=board[r][c];\n    d.textContent=v===null?\"\":EMOJIS[v]; if(v!==null)d.style.background=BGS[v];\n    if(sel&&sel[0]===r&&sel[1]===c)d.classList.add(\"sel\");\n    if(hintCells.some(([hr,hc])=>hr===r&&hc===c))d.classList.add(\"hinted\");\n    if(matchedSet&&matchedSet.has(r+\",\"+c))d.classList.add(\"matched\");\n    d.tabIndex=(r===0&&c===0)?0:-1; d.dataset.kb=\"tile-\"+r+\"-\"+c;\n    d.setAttribute(\"role\",\"button\");\n    d.setAttribute(\"aria-label\",\"Row \"+(r+1)+\", column \"+(c+1)+(v===null?\", empty\":\", \"+[\"strawberry\",\"lemon\",\"grapes\",\"orange\",\"blueberries\",\"kiwi\"][v])+(sel&&sel[0]===r&&sel[1]===c?\", selected\":\"\"));\n    d.addEventListener(\"pointerdown\",e=>{if(e.button>0)return;startXY={x:e.clientX,y:e.clientY,r,c}});\n    d.addEventListener(\"pointerup\",e=>onTapOrSwipe(e,r,c));\n    d.addEventListener(\"pointercancel\",()=>{startXY=null});\n    d.addEventListener(\"keydown\",e=>{\n      if(e.code===\"Space\"||e.code===\"Enter\"){e.preventDefault();tapTile(r,c);return}\n      const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.code];\n      if(mv){e.preventDefault();const nr=Math.max(0,Math.min(N-1,r+mv[0])),nc=Math.max(0,Math.min(N-1,c+mv[1]));\n        document.querySelector(`[data-kb=\"tile-${nr}-${nc}\"]`)?.focus();}\n    });\n    b.appendChild(d);\n  } if(fk)document.querySelector(`[data-kb=\"${fk}\"]`)?.focus({preventScroll:true});\n  stats();\n}\nfunction tapTile(r,c){\n  if(lock||over)return;\n  if(!sel){sel=[r,c];hintCells=[];PD.sfx.click();render();return}\n  if(sel[0]===r&&sel[1]===c){sel=null;render();return}\n  const adjacent=Math.abs(sel[0]-r)+Math.abs(sel[1]-c)===1;\n  if(adjacent){const from=sel;sel=null;trySwap(from,[r,c])}\n  else{sel=[r,c];hintCells=[];PD.sfx.click();render()}\n}\nasync function onTapOrSwipe(e,r,c){\n  if(lock||over||!startXY)return;\n  const dx=e.clientX-startXY.x, dy=e.clientY-startXY.y; const sr=startXY.r, sc=startXY.c; startXY=null; r=sr; c=sc;\n  if(Math.hypot(dx,dy)>26){ // swipe\n    const horiz=Math.abs(dx)>Math.abs(dy);\n    const r2=r+(horiz?0:Math.sign(dy)), c2=c+(horiz?Math.sign(dx):0);\n    if(r2>=0&&r2<N&&c2>=0&&c2<N)trySwap([r,c],[r2,c2]);\n    return;\n  }\n  tapTile(r,c);\n}\nasync function trySwap(a,b){\n  if(lock||over)return; lock=true; hintCells=[]; const myRun=runId;\n  [board[a[0]][a[1]],board[b[0]][b[1]]]=[board[b[0]][b[1]],board[a[0]][a[1]]];\n  render(); PD.sfx.pop(4); await PD.sleep(170);\n  if(myRun!==runId)return;\n  if(!findMatches(board).set.size){\n    [board[a[0]][a[1]],board[b[0]][b[1]]]=[board[b[0]][b[1]],board[a[0]][a[1]]];\n    render(); setMsg(\"🚫 No match — that swap was free, try another!\"); PD.sfx.bad(); lock=false; return;\n  }\n  movesLeft--;\n  let chain=0;\n  while(true){\n    const {set,maxRun}=findMatches(board);\n    if(!set.size)break;\n    chain++;\n    let pts=set.size*10*chain;\n    if(maxRun>=4)pts+=(maxRun-3)*60*chain;\n    if(set.size>=6)pts+=50*chain;\n    score+=pts;\n    PD.sfx.pop(3+chain);\n    setMsg(chain>1?\"🔥 CHAIN ×\"+chain+\"! +\"+PD.fmt(pts):\"✨ +\"+PD.fmt(pts)+(maxRun>=4?\" • \"+maxRun+\" in a row!\":\"\"));\n    if(chain>=3||maxRun>=5)PD.celebrate([\"🍬\",\"🍓\",\"⭐\"],14);\n    render(set); await PD.sleep(250);\n    if(myRun!==runId)return;\n    set.forEach(k=>{const[r,c]=k.split(\",\").map(Number);board[r][c]=null});\n    // gravity + refill\n    for(let c=0;c<N;c++){\n      const stack=[]; for(let r=N-1;r>=0;r--)if(board[r][c]!==null)stack.push(board[r][c]);\n      for(let r=N-1,i=0;r>=0;r--,i++)board[r][c]=i<stack.length?stack[i]:rndType();\n    }\n    render(); await PD.sleep(190);\n    if(myRun!==runId)return;\n  }\n  PD.saveBest(GAME,score,mode);\n  if(movesLeft<=0){lock=false;return gameOver()}\n  if(!hasMove(board)){\n    setMsg(\"🔀 No possible moves — free shuffle!\"); PD.sfx.good(); await PD.sleep(650);\n    if(myRun!==runId)return;\n    let vals=board.flat(), shuffled=false;\n    for(let tries=0;tries<80&&!shuffled;tries++){\n      for(let i=vals.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]]}\n      const nb=[]; for(let r=0;r<N;r++)nb.push(vals.slice(r*N,r*N+N));\n      if(!findMatches(nb).set.size&&hasMove(nb)){board=nb;shuffled=true}\n    }\n    if(!shuffled)board=genBoard(); // never leave the player stuck\n    render();\n  }\n  lock=false; stats();\n}\nfunction hint(){\n  if(lock||over)return;\n  const mv=hasMove(board);\n  if(!mv){PD.toast(\"No moves — board will shuffle\");return}\n  if(score>=50)score-=50;\n  hintCells=mv; sel=null; render();\n  setMsg(\"💡 Swap the two glowing candies (−50 pts)\");\n  const hr=runId; setTimeout(()=>{if(hr===runId){hintCells=[];render()}},1600);\n}\nfunction gameOver(){\n  over=true; if(mode===\"daily\")PD.markPlayed(GAME);\n  PD.saveBest(GAME,score,mode); stats();\n  const medal=score>=5500?\"👑 CANDY ROYALTY!\":score>=3800?\"🥇 Gold!\":score>=2400?\"🥈 Silver!\":score>=1200?\"🥉 Bronze!\":\"🍬 Sweet effort!\";\n  PD.celebrate([\"🍬\",\"🍓\",\"🍋\"],score>=2400?26:10);\n  PD.showModal(\"🍬\",\"Out of Moves!\",\n   \"Final score: <b>\"+PD.fmt(score)+\"<\/b><br>\"+medal+PD.challengeResultLine(score,beat)+\n   \"<br>Pro tip: play from the bottom — falling candies create free chain reactions.\");\n}\nfunction shareText(){\n  return \"🍬 Match3 \"+(mode===\"daily\"?\"Daily #\"+PD.dailyNumber()+\" (25 moves)\":\"Free (40 moves)\")+\n   \"\\nScore: \"+PD.fmt(score)+\" • 🔥\"+PD.streak(GAME)+\"\\n\\n\"+\n   board.map(r=>r.map(v=>EMOJIS[v]).join(\"\")).join(\"\\n\")+\"\\n\\nSame board, same candies — beat my score! 👇\"}\nfunction challengeMe(){if(mode!==\"daily\"){PD.toast(\"☀️ Switch to Daily mode to create a fair, same-rules challenge\");return} PD.challengeLink(score,currentSeed)}\nfunction doShare(){PD.share(shareText(),\"Match3 Daily 🍬\")}\nnewGame();\n","css":"\n  #board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;touch-action:none;width:100%}\n  .tile{aspect-ratio:1;min-width:0;overflow:hidden;border-radius:13px;display:flex;align-items:center;justify-content:center;\n    font-size:min(6.9vw,30px);line-height:1;cursor:pointer;user-select:none;border:1.5px solid #ffffff2a;transition:transform .12s,box-shadow .12s}\n  .tile:hover{transform:scale(1.06)}\n  .tile.sel{box-shadow:0 0 0 3px #facc15,0 0 18px #facc1588;transform:scale(1.13)}\n  .tile.hinted{box-shadow:0 0 0 3px #22c55e,0 0 16px #22c55e99;transform:scale(1.1)}\n  .tile.matched{animation:matchpop .24s ease forwards}\n  @keyframes matchpop{40%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(0);opacity:0}}\n  .tile.fall{animation:fallin .22s ease}\n  @keyframes fallin{from{transform:translateY(-14px);opacity:.5}to{transform:translateY(0);opacity:1}}\n  .targets{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:8px 0 2px;font-size:12px;font-weight:900}\n  .targets span{background:#00000030;border:1px solid var(--line);padding:5px 10px;border-radius:999px;opacity:.55}\n  .targets span.hit{opacity:1;background:#14532d;border-color:#22c55e}\n  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}\n  .toolbar button{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:12px;padding:11px;font-weight:900;cursor:pointer}\n"},"mergemelon":{"title":"MergeMelon Daily 🍉 — Merge Fruits, Grow the Watermelon!","body":"<div class=\"wrap\">\n  <nav class=\"topbar\" aria-label=\"Arcade navigation\"><a class=\"back\" href=\"../index.html\">⬅ Arcade<\/a><span class=\"brand\">🎮 Play<b>Daily10<\/b><\/span><button class=\"iconbtn\" id=\"soundBtn\" title=\"Sound\">🔊<\/button><\/nav>\n  <main>\n  <header class=\"hero\">\n    <div style=\"font-size:42px\">🍉<\/div>\n    <h1>Merge<span class=\"grad\">Melon<\/span> Daily<\/h1>\n    <p class=\"tag\">Merge two matching fruits to evolve the next one:<br>🍒→🍓→🍇→🍊→🍋→🥝→🍎→🍐→🍑→🍍→🍈→<b>🍉 WATERMELON!<\/b><\/p>\n  <\/header>\n  <noscript><p class=\"banner target\">JavaScript is required to play this game. Please enable JavaScript and reload.<\/p><\/noscript>\n\n  <div id=\"challBanner\"><\/div>\n  <div class=\"modes\">\n    <button id=\"mDaily\" class=\"active\" onclick=\"setMode('daily')\">☀️ Daily #<span id=\"dNum\"><\/span><\/button>\n    <button id=\"mFree\" onclick=\"setMode('free')\">♾️ Free Play<\/button>\n  <\/div>\n\n  <div class=\"stats\">\n    <div class=\"stat\"><b id=\"score\">0<\/b><span>Score<\/span><\/div>\n    <div class=\"stat\"><b id=\"best\">0<\/b><span>Best<\/span><\/div>\n    <div class=\"stat\"><b id=\"moves\">0<\/b><span>Moves<\/span><\/div>\n    <div class=\"stat\"><b id=\"streak\">🔥0<\/b><span>Streak<\/span><\/div>\n  <\/div>\n\n  <div class=\"panel\">\n    <div class=\"nextbar\">\n      <div><div class=\"subtxt\" style=\"text-align:left\">NEXT — tap a column ⬇️<\/div><div class=\"nextbig\" id=\"nextFruit\">🍒<\/div><\/div>\n      <div style=\"text-align:right\"><div class=\"subtxt\" style=\"text-align:right\">Coming up<\/div><div class=\"queue\" id=\"queue\"><\/div><div class=\"subtxt\" style=\"text-align:right\" id=\"topFruit\">Biggest: —<\/div><\/div>\n    <\/div>\n    <div class=\"colhint\"><span>⬇️<\/span><span>⬇️<\/span><span>⬇️<\/span><span>⬇️<\/span><span>⬇️<\/span><span>⬇️<\/span><\/div>\n    <div id=\"board\"><\/div>\n    <div class=\"msg\" id=\"msg\"><\/div>\n    <div class=\"evo\" id=\"evo\"><\/div>\n  <\/div>\n\n  <div class=\"btns\">\n    <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n    <button class=\"act primary\" onclick=\"newGame()\">🔄 New Game<\/button>\n    <button class=\"act ghost\" onclick=\"challengeMe()\">⚔️ Challenge a Friend<\/button>\n    <button class=\"act ghost\" onclick=\"PD.whatsapp(shareText())\">💬 WhatsApp<\/button>\n  <\/div>\n\n  <details class=\"howto\"><summary>🎮 How to Play (10 seconds)<\/summary>\n    <ul>\n      <li><b>Tap any column<\/b> — the fruit drops to the bottom.<\/li>\n      <li>Two <b>matching fruits touching<\/b> (up/down/left/right) merge into the next bigger fruit. 🍒+🍒 = 🍓<\/li>\n      <li>Chain merges build <b>COMBOS<\/b> ×2, ×3… for bonus points.<\/li>\n      <li>Create a <b>🍉 Watermelon<\/b> to win. If the board fills up — game over!<\/li>\n      <li>☀️ <b>Daily mode:<\/b> everyone on Earth gets the fruits in the same order today.<\/li>\n      <li>Secret: two watermelons merging explode for a <b>5,000-point bonus<\/b> 💥<\/li>\n    <\/ul>\n  <\/details>\n  <\/main>\n  <footer>🧩 Puzzle • Game #2 of 10 • <a href=\"../index.html\">Play the other 9 today →<\/a><\/footer>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\"><div class=\"modal\">\n  <div class=\"big\" id=\"ovEmoji\">🍉<\/div><h2 id=\"ovTitle\"><\/h2><p id=\"ovText\"><\/p>\n  <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n  <button class=\"act primary\" onclick=\"PD.hideModal();newGame()\">▶️ Play Again<\/button>\n  <button class=\"act ghost\" onclick=\"PD.hideModal()\">👀 View Board<\/button>\n<\/div><\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>","js":"\nconst GAME=\"mergemelon\";\nconst FRUITS=[\"🍒\",\"🍓\",\"🍇\",\"🍊\",\"🍋\",\"🥝\",\"🍎\",\"🍐\",\"🍑\",\"🍍\",\"🍈\",\"🍉\"];\nconst NAMES=[\"Cherry\",\"Strawberry\",\"Grapes\",\"Orange\",\"Lemon\",\"Kiwi\",\"Apple\",\"Pear\",\"Peach\",\"Pineapple\",\"Melon\",\"WATERMELON\"];\nconst COLS=6, ROWS=7;\nlet grid,score,moves,mode=\"daily\",rng,queue=[],lock=false,won=false,currentSeed=\"\",runId=0;\nlet beat=PD.challengeBanner(), challSeed=PD.challengeSeed();\ndocument.getElementById(\"dNum\").textContent=PD.dailyNumber();\ndocument.getElementById(\"evo\").innerHTML=\"<small>EVOLUTION — MERGE 2 OF A KIND TO GROW THE NEXT<\/small>\"+FRUITS.join(\" → \");\n\nfunction nextLevel(){const r=rng();return r<.40?0:r<.70?1:r<.90?2:3}\nfunction fillQueue(){while(queue.length<4)queue.push(nextLevel())}\nfunction setMode(m){mode=m; beat=(m===\"daily\")?PD.challengeBanner():null; if(m!==\"daily\"){const cb=document.getElementById(\"challBanner\"); if(cb)cb.className=\"banner\";}document.getElementById(\"mDaily\").classList.toggle(\"active\",m===\"daily\");\n  document.getElementById(\"mFree\").classList.toggle(\"active\",m===\"free\");newGame();}\nfunction newGame(){\n  runId++;\n  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));\n  score=0;moves=0;won=false;lock=false;queue=[];\n  currentSeed = (mode===\"daily\"&&challSeed) || (mode===\"daily\" ? \"mergemelon-\"+PD.todayStr() : \"melon-free-\"+Date.now());\n  rng=PD.rngFrom(currentSeed); fillQueue(); PD.hideModal(); render();\n  document.getElementById(\"msg\").textContent = mode===\"daily\" ? \"☀️ Daily board #\"+PD.dailyNumber()+\" — same fruits for everyone!\" : \"♾️ Free play — endless fruit fun!\";\n}\nfunction stats(){\n  document.getElementById(\"score\").textContent=PD.fmt(score);\n  document.getElementById(\"best\").textContent=PD.fmt(PD.get(PD.bestKey(GAME)));\n  document.getElementById(\"moves\").textContent=moves;\n  document.getElementById(\"streak\").textContent=\"🔥\"+PD.streak(GAME);\n  document.getElementById(\"nextFruit\").textContent=FRUITS[queue[0]];\n  document.getElementById(\"queue\").textContent=queue.slice(1,4).map(i=>FRUITS[i]).join(\"\");\n  let top=-1;grid.flat().forEach(v=>{if(v!==null&&v>top)top=v});\n  document.getElementById(\"topFruit\").textContent=top<0?\"Biggest: —\":\"Biggest: \"+FRUITS[top]+\" \"+NAMES[top];\n}\nfunction render(pop,drop){\n  const b=document.getElementById(\"board\");b.innerHTML=\"\";\n  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){\n    const d=document.createElement(\"div\");d.className=\"cell\";const v=grid[r][c];\n    if(v!==null){d.classList.add(\"filled\");d.textContent=FRUITS[v];d.title=NAMES[v]}\n    if(pop&&pop[0]===r&&pop[1]===c)d.classList.add(\"pop\");\n    if(drop&&drop[0]===r&&drop[1]===c)d.classList.add(\"drop\");\n    d.onclick=()=>dropIn(c);b.appendChild(d);\n  } stats();\n}\nfunction gravity(){for(let c=0;c<COLS;c++){const st=[];for(let r=ROWS-1;r>=0;r--)if(grid[r][c]!==null)st.push(grid[r][c]);\n  for(let r=ROWS-1,i=0;r>=0;r--,i++)grid[r][c]=i<st.length?st[i]:null}}\nfunction findPair(){for(let r=ROWS-1;r>=0;r--)for(let c=0;c<COLS;c++){const v=grid[r][c];if(v===null)continue;\n  if(r+1<ROWS&&grid[r+1][c]===v)return[[r+1,c],[r,c]];\n  if(c+1<COLS&&grid[r][c+1]===v)return[[r,c],[r,c+1]]}return null}\nasync function dropIn(c){\n  if(lock)return;\n  let tr=-1;for(let r=ROWS-1;r>=0;r--)if(grid[r][c]===null){tr=r;break}\n  if(tr===-1){PD.toast(\"⚠️ That column is full! Pick another\");PD.sfx.bad();return}\n  lock=true;const myRun=runId;const lvl=queue.shift();fillQueue();grid[tr][c]=lvl;moves++;PD.sfx.pop(lvl);\n  render(null,[tr,c]);await PD.sleep(150);\n  if(myRun!==runId)return;\n  let chain=0,pair;\n  while((pair=findPair())){\n    chain++;const[[ar,ac],[br,bc]]=pair,v=grid[ar][ac];\n    if(v===FRUITS.length-1){grid[ar][ac]=null;grid[br][bc]=null;score+=5000*chain;\n      document.getElementById(\"msg\").textContent=\"💥 DOUBLE WATERMELON BONUS +\"+PD.fmt(5000*chain)+\"!\";PD.celebrate([\"🍉\",\"💥\",\"⭐\"],18);}\n    else{grid[ar][ac]=v+1;grid[br][bc]=null;const pts=(v+2)*(v+2)*10*chain;score+=pts;PD.sfx.pop(v+2);\n      document.getElementById(\"msg\").textContent=chain>1?\"🔥 COMBO ×\"+chain+\"! +\"+PD.fmt(pts):FRUITS[v]+\"+\"+FRUITS[v]+\" → \"+FRUITS[v+1]+\" \"+NAMES[v+1]+\"! +\"+PD.fmt(pts);\n      if(v+1===FRUITS.length-1&&!won){won=true;gravity();render([ar,ac]);await PD.sleep(300);if(myRun!==runId)return;onWin();}}\n    gravity();render([ar,ac]);await PD.sleep(210);\n    if(myRun!==runId)return;\n  }\n  if(!chain)document.getElementById(\"msg\").textContent=\"\";\n  PD.saveBest(GAME,score);render();lock=false;\n  if(!won&&grid[0].every(v=>v!==null)&&!findPair())onGameOver();\n}\nfunction finish(){if(mode===\"daily\")PD.markPlayed(GAME);PD.saveBest(GAME,score);stats()}\nfunction onWin(){finish();PD.celebrate([\"🍉\",\"🎉\",\"⭐\",\"🍒\"],32);\n  PD.showModal(\"🍉\",\"WATERMELON! You Win! 🎉\",\"Score: <b>\"+PD.fmt(score)+\"<\/b> • Moves: \"+moves+\n  \"<br>Only a small % of players ever grow the watermelon!\"+PD.challengeResultLine(score,beat)+\n  \"<br>Keep playing for combo points, or share your glory 📲\")}\nfunction onGameOver(){finish();let top=-1;grid.flat().forEach(v=>{if(v!==null&&v>top)top=v});PD.sfx.bad();\n  PD.showModal(FRUITS[Math.max(top,0)],\"Board Full — Game Over!\",\"Score: <b>\"+PD.fmt(score)+\"<\/b> • Moves: \"+moves+\n  \"<br>Biggest fruit: \"+FRUITS[top]+\" \"+NAMES[top]+PD.challengeResultLine(score,beat)+\n  \"<br>One more try? The watermelon is waiting 🍉\")}\naddEventListener(\"keydown\",e=>{const n=+e.key; if(n>=1&&n<=6)dropIn(n-1)});\nfunction shareText(){\n  let top=-1;grid.flat().forEach(v=>{if(v!==null&&v>top)top=v});\n  return \"🍉 MergeMelon \"+(mode===\"daily\"?\"Daily #\"+PD.dailyNumber():\"Free Play\")+\"\\nScore: \"+PD.fmt(score)+\n   \" | Moves: \"+moves+\" | Biggest: \"+(top>=0?FRUITS[top]:\"—\")+\" | 🔥\"+PD.streak(GAME)+\"\\n\\n\"+\n   grid.map(r=>r.map(v=>v===null?\"⬛\":FRUITS[v]).join(\"\")).join(\"\\n\")+\"\\n\\nCan you grow the watermelon? 👇\"}\nfunction challengeMe(){if(mode!==\"daily\"){PD.toast(\"☀️ Switch to Daily mode to create a fair, same-rules challenge\");return} PD.challengeLink(score,currentSeed)}\nfunction doShare(){PD.share(shareText(),\"MergeMelon Daily 🍉\")}\nnewGame();\n","css":"\n  .nextbar{display:flex;align-items:center;justify-content:space-between;background:#00000030;border:1px solid var(--line);border-radius:16px;padding:9px 15px;margin:8px 0}\n  .nextbig{font-size:42px;line-height:1;animation:pulse 1.4s infinite}\n  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}\n  .queue{font-size:22px;letter-spacing:4px}\n  .colhint{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:0 9px;margin-bottom:4px;text-align:center;font-size:14px;opacity:.7}\n  #board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}\n  .cell{aspect-ratio:1;border-radius:15px;background:#ffffff10;border:1px solid #ffffff12;display:flex;align-items:center;justify-content:center;font-size:min(8.4vw,37px);cursor:pointer;user-select:none;transition:background .1s}\n  .cell:hover{background:#ffffff22}\n  .cell.filled{background:linear-gradient(180deg,#ffffff,#e2e8f0);box-shadow:0 3px 0 #0005}\n  .cell.pop{animation:pop .28s ease}\n  @keyframes pop{0%{transform:scale(.45)}60%{transform:scale(1.22)}100%{transform:scale(1)}}\n  .cell.drop{animation:drp .18s ease}\n  @keyframes drp{from{transform:translateY(-18px);opacity:.4}to{transform:translateY(0);opacity:1}}\n  .evo{background:#00000028;border:1px solid var(--line);border-radius:14px;padding:9px 11px;margin:11px 0;text-align:center;font-size:19px;overflow-x:auto;white-space:nowrap}\n  .evo small{display:block;font-size:10.5px;color:var(--muted);white-space:normal;font-weight:800;letter-spacing:.5px}\n"},"mini-sudoku":{"title":"Mini Sudoku Daily 🔢 — A Friendly 6×6 Brain Workout!","body":"<div class=\"wrap\">\n  <nav class=\"topbar\" aria-label=\"Arcade navigation\"><a class=\"back\" href=\"../index.html\">⬅ Arcade<\/a><span class=\"brand\">🎮 Play<b>Daily10<\/b><\/span><button class=\"iconbtn\" id=\"soundBtn\" title=\"Sound\">🔊<\/button><\/nav>\n  <main>\n  <header class=\"hero\">\n    <div style=\"font-size:42px\">🔢<\/div>\n    <h1>Mini <span class=\"grad\">Sudoku<\/span> Daily<\/h1>\n    <p class=\"tag\">Fill the grid so every <b>row<\/b>, <b>column<\/b> and <b>box<\/b> contains<br><b>1 – 6 exactly once<\/b>. No math — just pure logic!<\/p>\n  <\/header>\n  <noscript><p class=\"banner target\">JavaScript is required to play this game. Please enable JavaScript and reload.<\/p><\/noscript>\n\n  <div id=\"challBanner\"><\/div>\n  <div class=\"modes\">\n    <button id=\"mDaily\" class=\"active\" onclick=\"setMode('daily')\">☀️ Daily #<span id=\"dNum\"><\/span><\/button>\n    <button id=\"mEasy\" onclick=\"setMode(19)\">😊 Easy<\/button>\n    <button id=\"mMed\" onclick=\"setMode(16)\">🧠 Medium<\/button>\n    <button id=\"mHard\" onclick=\"setMode(13)\">🔥 Hard<\/button>\n  <\/div>\n  <div class=\"stats\">\n    <div class=\"stat\"><b id=\"time\">0:00<\/b><span>Time<\/span><\/div>\n    <div class=\"stat\"><b id=\"mistakes\">0/5<\/b><span>Mistakes<\/span><\/div>\n    <div class=\"stat\"><b id=\"hints\">0<\/b><span>Hints<\/span><\/div>\n    <div class=\"stat\"><b id=\"best\">0<\/b><span>Best Score<\/span><\/div>\n  <\/div>\n\n  <div class=\"panel\">\n    <div class=\"gridwrap\" id=\"gridWrap\">\n      <div id=\"grid\"><\/div>\n      <div class=\"pausedVeil\">⏸️ PAUSED<br><span style=\"font-size:13px;opacity:.8\">Press Resume to keep solving<\/span><\/div>\n    <\/div>\n    <div class=\"pad\" id=\"pad\"><\/div>\n    <div class=\"toolbar\">\n      <button id=\"notesBtn\" onclick=\"toggleNotes()\">✏️ Notes: OFF<\/button>\n      <button onclick=\"eraseCell()\">⌫ Erase<\/button>\n      <button onclick=\"useHint()\">💡 Hint (−60)<\/button>\n      <button onclick=\"togglePause()\" id=\"pauseBtn\">⏸️ Pause<\/button>\n    <\/div>\n    <div class=\"msg\" id=\"msg\">Generating a unique-solution puzzle…<\/div>\n  <\/div>\n\n  <div class=\"btns\">\n    <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n    <button class=\"act primary\" onclick=\"newGame()\">🎮 New Puzzle<\/button>\n    <button class=\"act ghost\" onclick=\"PD.challengeLink(lastScore,currentSeed)\">⚔️ Challenge a Friend<\/button>\n    <button class=\"act ghost\" onclick=\"PD.whatsapp(shareText())\">💬 WhatsApp<\/button>\n  <\/div>\n\n  <details class=\"howto\"><summary>🎮 How to Play (10 seconds)<\/summary>\n    <ul>\n      <li>Tap an empty cell, then tap a <b>number 1–6<\/b> below (or use your keyboard).<\/li>\n      <li>Every <b>row<\/b>, <b>column<\/b> and <b>2×3 box<\/b> must contain each number exactly once.<\/li>\n      <li>✏️ <b>Notes mode<\/b> lets you pencil in candidates without committing.<\/li>\n      <li>Wrong numbers turn red and count as a mistake — <b>5 mistakes ends the game<\/b>.<\/li>\n      <li>Every puzzle here is generated with a <b>single unique solution<\/b> (our solver checks each removal!).<\/li>\n      <li>☀️ Daily difficulty grows through the week: gentle Monday → fiery Sunday 🔥<\/li>\n    <\/ul>\n  <\/details>\n  <\/main>\n  <footer>🧩 Puzzle • Game #10 of 10 • <a href=\"../index.html\">Play the other 9 today →<\/a><\/footer>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\"><div class=\"modal\">\n  <div class=\"big\" id=\"ovEmoji\">🔢<\/div><h2 id=\"ovTitle\"><\/h2><p id=\"ovText\"><\/p>\n  <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n  <button class=\"act primary\" onclick=\"PD.hideModal();newGame()\">▶️ New Puzzle<\/button>\n  <button class=\"act ghost\" onclick=\"PD.hideModal()\">👀 View Grid<\/button>\n<\/div><\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>","js":"\nconst GAME=\"sudoku\", N=6, BOX_R=2, BOX_C=3;\nlet solution,puzzle,grid,given,hintedCells,notes,sel=null,notesMode=false,\n    mistakes=0,hintsUsed=0,elapsed=0,timerInt=null,paused=false,completed=false,failed=false,\n    givensTarget=16,lastScore=0,currentSeed=\"\",isDailyMode=true,genRun=0;\nlet beat=PD.challengeBanner(), challSeed=PD.challengeSeed();\ndocument.getElementById(\"dNum\").textContent=PD.dailyNumber();\n\n/* ---------- Puzzle generation with unique-solution guarantee ---------- */\nfunction shuffled(arr,rng){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction makeSolution(rng){\n  const base=[]; for(let r=0;r<N;r++){base.push([]);for(let c=0;c<N;c++)base[r].push(((r%BOX_R)*BOX_C+Math.floor(r/BOX_R)+c)%N+1)}\n  const digitMap=shuffled([1,2,3,4,5,6],rng);\n  let g=base.map(r=>r.map(v=>digitMap[v-1]));\n  const rowBandOrder=shuffled([0,1,2],rng);\n  let rows=[]; rowBandOrder.forEach(b=>{shuffled([0,1],rng).forEach(off=>rows.push(g[b*2+off]))});\n  g=rows;\n  const colStackOrder=shuffled([0,1],rng); const colOrder=[];\n  colStackOrder.forEach(s=>{shuffled([0,1,2],rng).forEach(off=>colOrder.push(s*3+off))});\n  g=g.map(r=>colOrder.map(c=>r[c]));\n  return g;\n}\nfunction isSafe(bd,r,c,v){\n  for(let i=0;i<N;i++)if(bd[r][i]===v||bd[i][c]===v)return false;\n  const br=Math.floor(r/BOX_R)*BOX_R, bc=Math.floor(c/BOX_C)*BOX_C;\n  for(let dr=0;dr<BOX_R;dr++)for(let dc=0;dc<BOX_C;dc++)if(bd[br+dr][bc+dc]===v)return false;\n  return true;\n}\nfunction countSolutions(bd,limit=2){\n  let best=null,bestOpts=null;\n  for(let r=0;r<N&&!best;r++)for(let c=0;c<N;c++)if(bd[r][c]===0){\n    const opts=[1,2,3,4,5,6].filter(v=>isSafe(bd,r,c,v));\n    if(!bestOpts||opts.length<bestOpts.length){best=[r,c];bestOpts=opts;if(opts.length<=1)break}\n  }\n  if(!best)return 1;\n  if(!bestOpts.length)return 0;\n  let total=0; const[r,c]=best;\n  for(const v of bestOpts){bd[r][c]=v; total+=countSolutions(bd,limit); bd[r][c]=0; if(total>=limit)return total}\n  return total;\n}\nfunction generate(seedStr,givens){\n  const rng=PD.rngFrom(seedStr);\n  const sol=makeSolution(rng);\n  const pz=sol.map(r=>[...r]);\n  const positions=shuffled(Array.from({length:36},(_,i)=>i),rng);\n  let remaining=36;\n  for(const p of positions){\n    if(remaining<=givens)break;\n    const r=Math.floor(p/N),c=p%N, backup=pz[r][c];\n    pz[r][c]=0;\n    if(countSolutions(pz.map(x=>[...x]))!==1){pz[r][c]=backup}\n    else remaining--;\n  }\n  return{sol,pz,actualGivens:remaining};\n}\n/* ---------- Flow ---------- */\nfunction dailyGivens(){return [13,19,18,17,16,15,14][new Date().getUTCDay()]} // Sun hardest … Mon gentlest\nfunction setMode(m){\n  isDailyMode = m===\"daily\";\n  beat = isDailyMode ? PD.challengeBanner() : null;\n  if(!isDailyMode){const cb=document.getElementById(\"challBanner\"); if(cb)cb.className=\"banner\";}\n  givensTarget = isDailyMode ? dailyGivens() : m;\n  document.getElementById(\"mDaily\").classList.toggle(\"active\",m===\"daily\");\n  document.getElementById(\"mEasy\").classList.toggle(\"active\",m===19);\n  document.getElementById(\"mMed\").classList.toggle(\"active\",m===16);\n  document.getElementById(\"mHard\").classList.toggle(\"active\",m===13);\n  newGame();\n}\nfunction newGame(){\n  const myGen=++genRun;\n  clearInterval(timerInt); elapsed=0; mistakes=0; hintsUsed=0; sel=null; notesMode=false;\n  paused=false; completed=false; failed=false; lastScore=0;\n  document.getElementById(\"gridWrap\").classList.remove(\"paused\");\n  document.getElementById(\"pauseBtn\").textContent=\"⏸️ Pause\";\n  updat
