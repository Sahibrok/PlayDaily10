eNotesBtn();\n  document.getElementById(\"msg\").textContent=\"Generating a unique-solution puzzle…\";\n  setTimeout(()=>{\n    if(myGen!==genRun)return;\n    let core;\n    const sdParts=(isDailyMode&&challSeed&&challSeed.includes(\"|\"))?challSeed.split(\"|\"):null;\n    const parsedG=sdParts?Number(sdParts[0]):NaN;\n    if(sdParts&&Number.isInteger(parsedG)&&parsedG>=13&&parsedG<=19&&sdParts[1]){givensTarget=parsedG;core=sdParts.slice(1).join(\"|\");currentSeed=challSeed;isDailyMode=true}\n    else{core=isDailyMode?\"sudoku-\"+PD.todayStr():\"sudoku-free-\"+Date.now();currentSeed=givensTarget+\"|\"+core}\n    const g=generate(core,givensTarget);\n    solution=g.sol; puzzle=g.pz; givensTarget=g.actualGivens;\n    grid=puzzle.map(r=>[...r]);\n    given=puzzle.map(r=>r.map(v=>v!==0));\n    hintedCells=new Set();\n    notes={}; for(let i=0;i<36;i++)notes[i]=new Set();\n    PD.hideModal(); buildPad(); render(); startTimer();\n    const diffName=givensTarget>=18?\"😊 Easy\":givensTarget>=15?\"🧠 Medium\":\"🔥 Hard\";\n    document.getElementById(\"msg\").textContent=(isDailyMode?\"☀️ Daily #\"+PD.dailyNumber()+\" • \":\"🎲 \")+diffName+\" • \"+givensTarget+\" clues. Good luck!\";\n  },30);\n}\nfunction startTimer(){\n  clearInterval(timerInt);\n  timerInt=setInterval(()=>{if(!paused&&!completed&&!failed){elapsed++;\n    document.getElementById(\"time\").textContent=Math.floor(elapsed/60)+\":\"+String(elapsed%60).padStart(2,\"0\")}},1000);\n}\nfunction boxOf(r,c){return[Math.floor(r/BOX_R),Math.floor(c/BOX_C)]}\nfunction conflicts(r,c){\n  const v=grid[r][c]; if(!v)return false;\n  for(let i=0;i<N;i++){if(i!==c&&grid[r][i]===v)return true; if(i!==r&&grid[i][c]===v)return true}\n  const br=Math.floor(r/BOX_R)*BOX_R,bc=Math.floor(c/BOX_C)*BOX_C;\n  for(let dr=0;dr<BOX_R;dr++)for(let dc=0;dc<BOX_C;dc++){const rr=br+dr,cc=bc+dc;\n    if((rr!==r||cc!==c)&&grid[rr][cc]===v)return true}\n  return false;\n}\nfunction render(){\n  const hadCellFocus=document.activeElement?.classList?.contains(\"sc\");\n  const ge=document.getElementById(\"grid\"); ge.innerHTML=\"\";\n  const selVal=sel?grid[sel[0]][sel[1]]:0;\n  for(let r=0;r<N;r++)for(let c=0;c<N;c++){\n    const d=document.createElement(\"div\");\n    d.className=\"sc\"+(given[r][c]?\" given\":hintedCells.has(r*6+c)?\" hinted\":\" user\")\n      +((c===2)?\" br\":\"\")+((r===1||r===3)?\" bb\":\"\");\n    if(sel){\n      const[br,bc]=boxOf(r,c),[sr,sc]=boxOf(sel[0],sel[1]);\n      if(r===sel[0]||c===sel[1]||(br===sr&&bc===sc))d.classList.add(\"hl\");\n      if(selVal&&grid[r][c]===selVal)d.classList.add(\"same\");\n      if(r===sel[0]&&c===sel[1])d.classList.add(\"sel\");\n    }\n    if(grid[r][c]!==0){ d.textContent=grid[r][c]; if(conflicts(r,c)||(!given[r][c]&&grid[r][c]!==solution[r][c]))d.classList.add(\"wrong\"); }\n    else if(notes[r*6+c].size){\n      const nd=document.createElement(\"div\"); nd.className=\"notes\";\n      for(let v=1;v<=6;v++){const s=document.createElement(\"span\");s.textContent=notes[r*6+c].has(v)?v:\"\";nd.appendChild(s)}\n      d.appendChild(nd);\n    }\n    d.tabIndex=(sel?(r===sel[0]&&c===sel[1]):(r===0&&c===0))?0:-1;\n    d.dataset.kb=\"sc-\"+r+\"-\"+c; d.setAttribute(\"role\",\"button\");\n    d.setAttribute(\"aria-label\",\"Row \"+(r+1)+\", column \"+(c+1)+(grid[r][c]?\", value \"+grid[r][c]:\", empty\")+(given[r][c]?\", given clue\":\"\"));\n    d.onclick=()=>{if(paused)return;sel=[r,c];PD.sfx.click();render()};\n    d.onkeydown=e=>{if(e.code===\"Space\"||e.code===\"Enter\"){e.preventDefault();d.click()}};\n    ge.appendChild(d);\n  }\n  if(hadCellFocus&&sel)document.querySelector(`[data-kb=\"sc-${sel[0]}-${sel[1]}\"]`)?.focus({preventScroll:true});\n  document.getElementById(\"mistakes\").textContent=mistakes+\"/5\";\n  document.getElementById(\"hints\").textContent=hintsUsed;\n  document.getElementById(\"best\").textContent=PD.fmt(PD.get(PD.bestKey(GAME)));\n  // digit completion dimming\n  document.querySelectorAll(\"#pad button\").forEach((b,i)=>{\n    const count=grid.reduce((acc,row,r)=>acc+row.filter((v,c)=>v===i+1&&v===solution[r][c]).length,0); // only CORRECT placements count\n    b.classList.toggle(\"doneDigit\",count>=6);\n    const sm=b.querySelector(\"small\"); if(sm)sm.textContent=Math.max(0,6-count)+\" left\";\n  });\n}\nfunction buildPad(){\n  const pad=document.getElementById(\"pad\"); pad.innerHTML=\"\";\n  for(let v=1;v<=6;v++){const b=document.createElement(\"button\");\n    b.innerHTML=v+\"<small><\/small>\"; b.onclick=()=>enterValue(v); pad.appendChild(b)}\n}\nfunction enterValue(v){\n  if(!sel||paused||completed||failed)return;\n  const[r,c]=sel;\n  if(given[r][c]||hintedCells.has(r*6+c)){PD.toast(\"🔒 That cell is locked\");return}\n  if(notesMode){\n    if(grid[r][c]!==0)return;\n    notes[r*6+c].has(v)?notes[r*6+c].delete(v):notes[r*6+c].add(v);\n    PD.sfx.click(); render(); return;\n  }\n  grid[r][c]=v; notes[r*6+c].clear();\n  if(v!==solution[r][c]){\n    mistakes++; PD.sfx.bad();\n    document.getElementById(\"msg\").textContent=\"❌ \"+v+\" doesn't belong there (\"+mistakes+\"/5 mistakes)\";\n    render();\n    if(mistakes>=5)return onFail();\n  } else {\n    // only a CORRECT digit may erase that candidate from neighbours' notes\n    for(let i=0;i<N;i++){notes[r*6+i].delete(v);notes[i*6+c].delete(v)}\n    const br=Math.floor(r/BOX_R)*BOX_R,bc=Math.floor(c/BOX_C)*BOX_C;\n    for(let dr=0;dr<BOX_R;dr++)for(let dc=0;dc<BOX_C;dc++)notes[(br+dr)*6+(bc+dc)].delete(v);\n    PD.sfx.pop(5);\n    document.getElementById(\"msg\").textContent=\"✅ Correct!\";\n    render(); checkWin();\n  }\n}\nfunction eraseCell(){\n  if(!sel||paused||completed||failed)return;\n  const[r,c]=sel; if(given[r][c]||hintedCells.has(r*6+c))return;\n  grid[r][c]=0; notes[r*6+c].clear(); PD.sfx.click(); render();\n}\nfunction toggleNotes(){notesMode=!notesMode;updateNotesBtn()}\nfunction updateNotesBtn(){const b=document.getElementById(\"notesBtn\");\n  b.textContent=\"✏️ Notes: \"+(notesMode?\"ON\":\"OFF\"); b.classList.toggle(\"on\",notesMode)}\nfunction useHint(){\n  if(paused||completed||failed)return;\n  let target=null;\n  if(sel&&!given[sel[0]][sel[1]]&&grid[sel[0]][sel[1]]!==solution[sel[0]][sel[1]])target=sel;\n  else{const empty=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]!==solution[r][c])empty.push([r,c]);\n    if(empty.length)target=empty[Math.floor(Math.random()*empty.length)]}\n  if(!target)return;\n  const[r,c]=target; grid[r][c]=solution[r][c]; hintedCells.add(r*6+c); notes[r*6+c].clear();\n  hintsUsed++; sel=[r,c]; PD.sfx.good(); render();\n  document.getElementById(\"msg\").textContent=\"💡 Revealed a \"+solution[r][c]+\" for you (−60 pts)\";\n  checkWin();\n}\ndocument.addEventListener(\"visibilitychange\",()=>{\n  if(document.hidden&&timerInt&&!paused&&!completed&&!failed)togglePause();\n});\nfunction togglePause(){\n  if(completed||failed)return;\n  paused=!paused;\n  document.getElementById(\"gridWrap\").classList.toggle(\"paused\",paused);\n  document.getElementById(\"pauseBtn\").textContent=paused?\"▶️ Resume\":\"⏸️ Pause\";\n}\naddEventListener(\"keydown\",e=>{\n  if(paused||completed||failed)return;\n  if(e.key>=\"1\"&&e.key<=\"6\")enterValue(+e.key);\n  else if(e.key===\"Backspace\"||e.key===\"Delete\")eraseCell();\n  else if(sel&&e.key.startsWith(\"Arrow\")){\n    e.preventDefault();\n    let[r,c]=sel;\n    if(e.key===\"ArrowUp\")r=Math.max(0,r-1); if(e.key===\"ArrowDown\")r=Math.min(N-1,r+1);\n    if(e.key===\"ArrowLeft\")c=Math.max(0,c-1); if(e.key===\"ArrowRight\")c=Math.min(N-1,c+1);\n    sel=[r,c]; render();\n  }\n});\nfunction scoreNow(){\n  const missing=36-givensTarget;\n  return Math.max(100,600+missing*15-elapsed-mistakes*80-hintsUsed*60);\n}\nfunction checkWin(){\n  if(!grid.every((row,r)=>row.every((v,c)=>v===solution[r][c])))return;\n  completed=true; clearInterval(timerInt);\n  lastScore=scoreNow();\n  if(isDailyMode)PD.markPlayed(GAME);\n  PD.saveBest(GAME,lastScore); render(); PD.celebrate([\"🔢\",\"🧠\",\"🎉\"],26);\n  const timeStr=Math.floor(elapsed/60)+\":\"+String(elapsed%60).padStart(2,\"0\");\n  const stars=mistakes===0&&hintsUsed===0?\"⭐⭐⭐ FLAWLESS!\":mistakes<=2?\"⭐⭐ Sharp mind!\":\"⭐ Solved!\";\n  PD.showModal(\"🏆\",\"Puzzle Solved!\",\n   \"Time: <b>\"+timeStr+\"<\/b> • Mistakes: \"+mistakes+\" • Hints: \"+hintsUsed+\n   \"<br>Score: <b>\"+PD.fmt(lastScore)+\"<\/b><br>\"+stars+PD.challengeResultLine(lastScore,beat));\n}\nfunction onFail(){\n  failed=true; clearInterval(timerInt); lastScore=0; PD.sfx.bad();\n  if(isDailyMode)PD.markPlayed(GAME); // a finished attempt still counts toward today's quest\n  PD.showModal(\"💥\",\"5 Mistakes — Game Over\",\n   \"This puzzle got the better of you… this time.<br>Tip: fill Notes ✏️ first, and only commit when a cell has ONE candidate left.\"+\n   PD.challengeResultLine(0,beat));\n}\nfunction shareText(){\n  const timeStr=Math.floor(elapsed/60)+\":\"+String(elapsed%60).padStart(2,\"0\");\n  if(!completed)return \"🔢 Mini Sudoku Daily — a friendly 6×6 logic puzzle with exactly one solution.\\nCan your brain beat today's grid? 👇\";\n  return \"🔢 Mini Sudoku \"+(isDailyMode?\"Daily #\"+PD.dailyNumber():\"Free\")+\" — SOLVED ✅\\n\"+\n   \"⏱️ \"+timeStr+\" • Mistakes: \"+mistakes+\" • Hints: \"+hintsUsed+\"\\nScore: \"+PD.fmt(lastScore)+\" • 🔥\"+PD.streak(GAME)+\n   \"\\n\\nSame puzzle — solve it faster! 👇\"}\nfunction doShare(){PD.share(shareText(),\"Mini Sudoku Daily 🔢\")}\nnewGame();\n","css":"\n  #grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border:3px solid #e2e8f0;border-radius:14px;overflow:hidden;background:#e2e8f0}\n  .sc{aspect-ratio:1;background:#0f1e3d;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;user-select:none;\n    font-size:min(8vw,34px);font-weight:800;border-right:1px solid #ffffff22;border-bottom:1px solid #ffffff22}\n  .sc.br{border-right:3px solid #e2e8f0}.sc.bb{border-bottom:3px solid #e2e8f0}\n  .sc.given{color:#f8fafc;background:#16294f}\n  .sc.user{color:#7dd3fc}\n  .sc.hinted{color:#4ade80}\n  .sc.wrong{color:#fb7185!important;background:#4c0519}\n  .sc.hl{background:#1d3465}\n  .sc.same{background:#3b2f63}\n  .sc.sel{box-shadow:inset 0 0 0 3px #facc15;background:#42360a}\n  .notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));\n    font-size:10px;color:#93c5fd;font-weight:700;text-align:center;line-height:1.25}\n  .pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin-top:12px}\n  .pad button{height:56px;border-radius:14px;border:1.5px solid var(--line);background:linear-gradient(180deg,#ffffff20,#ffffff0d);\n    color:#fff;font-size:23px;font-weight:900;cursor:pointer;position:relative}\n  .pad button small{position:absolute;bottom:3px;right:7px;font-size:9.5px;opacity:.65;font-weight:800}\n  .pad button.doneDigit{opacity:.32}\n  .pad button:active{transform:scale(.94)}\n  .toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:9px}\n  .toolbar button{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:12px;padding:11px 3px;font-weight:900;cursor:pointer;font-size:12.5px}\n  .toolbar button.on{background:var(--gold);color:#422006}\n  .pausedVeil{display:none;position:absolute;inset:0;background:#020617d9;border-radius:14px;align-items:center;justify-content:center;font-size:24px;font-weight:900;z-index:3}\n  .gridwrap{position:relative}\n  .gridwrap.paused .pausedVeil{display:flex}\n"},"perfect-circle":{"title":"Perfect Circle Daily ⭕ — How Perfect Is Your Circle?","body":"<div class=\"wrap\">\n  <nav class=\"topbar\" aria-label=\"Arcade navigation\"><a class=\"back\" href=\"../index.html\">⬅ Arcade<\/a><span class=\"brand\">🎮 Play<b>Daily10<\/b><\/span><button class=\"iconbtn\" id=\"soundBtn\" title=\"Sound\">🔊<\/button><\/nav>\n  <main>\n  <header class=\"hero\">\n    <div style=\"font-size:42px\">⭕<\/div>\n    <h1>Perfect <span class=\"grad\">Circle<\/span> Daily<\/h1>\n    <p class=\"tag\">Draw a circle in <b>one stroke<\/b>. We grade its roundness.<br>95%+ = 😇 Halo Legend. 99%+ = …are you a robot?<\/p>\n  <\/header>\n  <noscript><p class=\"banner target\">JavaScript is required to play this game. Please enable JavaScript and reload.<\/p><\/noscript>\n\n  <div id=\"challBanner\"><\/div>\n  <div class=\"banner target\" id=\"targetBox\"><\/div>\n\n  <div class=\"stats\">\n    <div class=\"stat\"><b id=\"dayBest\">—<\/b><span id=\"dayBestLabel\">Today Best<\/span><\/div>\n    <div class=\"stat\"><b id=\"allBest\">—<\/b><span>All-Time<\/span><\/div>\n    <div class=\"stat\"><b id=\"attempts\">0<\/b><span>Tries<\/span><\/div>\n    <div class=\"stat\"><b id=\"streak\">🔥0<\/b><span>Streak<\/span><\/div>\n  <\/div>\n\n  <div class=\"canvasbox\"><canvas id=\"cv\" tabindex=\"0\" role=\"img\" aria-label=\"Drawing area. Draw one circle with a finger, mouse, or stylus.\" width=\"640\" height=\"640\"><\/canvas><\/div>\n\n  <div style=\"min-height:104px;margin-top:10px\">\n    <div id=\"scoreBig\">✏️<\/div>\n    <div id=\"verdict\">Draw your circle in the box above!<\/div>\n    <div class=\"subtxt\" id=\"detail\">One smooth stroke — go all the way around, then lift your finger<\/div>\n  <\/div>\n\n  <div class=\"btns\">\n    <button class=\"act primary\" onclick=\"clearCanvas()\">🔄 Try Again<\/button>\n    <button class=\"act green\" onclick=\"doShare()\">📲 Share Score + Image<\/button>\n    <button class=\"act ghost\" onclick=\"PD.challengeLink(bestToday(),'circle-'+displayDate)\">⚔️ Challenge a Friend<\/button>\n    <button class=\"act ghost\" onclick=\"PD.whatsapp(shareText())\">💬 WhatsApp<\/button>\n  <\/div>\n\n  <div class=\"ranks\"><b>🏅 Rank Badges:<\/b><br>\n  🥔 Potato &lt;50% &nbsp;•&nbsp; 🥚 Egg 50–70% &nbsp;•&nbsp; 🌕 Moon 70–85%<br>\n  🎯 Sharpshooter 85–95% &nbsp;•&nbsp; 😇 <b>Halo Legend 95%+<\/b> &nbsp;•&nbsp; 🤖 Robot?! 99%+<\/div>\n\n  <details class=\"howto\"><summary>🎮 How to Play (10 seconds)<\/summary>\n    <ul>\n      <li>Draw a circle with your finger or mouse in <b>one single stroke<\/b>.<\/li>\n      <li>Your score blends <b>roundness<\/b>, full 360° coverage, a <b>closed loop<\/b>, and matching <b>today's size target<\/b>.<\/li>\n      <li>The dashed pink circle after grading is the \"true\" circle closest to yours — compare!<\/li>\n      <li>Tip: slow and steady with a relaxed wrist beats fast and wobbly.<\/li>\n    <\/ul>\n  <\/details>\n  <\/main>\n  <footer>⏱️ Timing &amp; Skill • Game #3 of 10 • <a href=\"../index.html\">Play the other 9 today →<\/a><\/footer>\n<\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>","js":"\nconst GAME=\"circle\";\nconst cv=document.getElementById(\"cv\"),ctx=cv.getContext(\"2d\"),W=cv.width;\nlet pts=[],drawing=false,lastScore=null,attempts=0,activePointerId=null;\nconst beat=PD.challengeBanner();\n/* A challenge link carries the challenger's DATE: you play their exact size target. */\nconst seedParam=PD.challengeSeed();\nlet seedDateMatch=typeof seedParam===\"string\"?seedParam.match(/^circle-(\\d{4}-\\d{2}-\\d{2})$/):null;\nlet displayDate=seedDateMatch?seedDateMatch[1]:PD.todayStr();\nlet displayDayNum=PD.dailyNumberFor(displayDate);\nif(!Number.isFinite(displayDayNum)||new Date(displayDate+\"T00:00:00Z\").toISOString().slice(0,10)!==displayDate){\n  seedDateMatch=null; displayDate=PD.todayStr(); displayDayNum=PD.dailyNumberFor(displayDate);\n}\nconst isPastChallenge=!!seedDateMatch&&displayDate!==PD.todayStr();\nconst TARGETS=[{n:\"BIG ⭕ — use most of the box!\",r:.42},{n:\"MEDIUM ⭕\",r:.31},{n:\"SMALL ⭕ — coin-sized, careful!\",r:.19},{n:\"BIG ⭕ again!\",r:.40},{n:\"MEDIUM ⭕\",r:.29}];\nconst target=TARGETS[((displayDayNum-1)%TARGETS.length+TARGETS.length)%TARGETS.length];\ndocument.getElementById(\"targetBox\").textContent=(seedDateMatch?\"⚔️ Challenge target #\":\"🎯 Today's target #\")+displayDayNum+\": \"+target.n+(isPastChallenge?\"  (from a friend's link; today's streak is unaffected)\":\"\");\n/* Keep day-bests in ONE bounded map instead of one storage key per date.\n   The old per-date key is still read once as a legacy fallback. */\nconst DAYBEST_KEY=\"pd_circle_daybest_map\";\nconst legacyDayKey=GAME+\"_daybest_\"+displayDate;\nfunction dayBestMap(){\n  try{ const parsed=JSON.parse(PD.lsGet(DAYBEST_KEY)||\"{}\");\n    return parsed && typeof parsed===\"object\" && !Array.isArray(parsed) ? parsed : {};\n  }catch(e){ return {}; }\n}\nconst storedDayBest=()=>Math.max(+dayBestMap()[displayDate]||0,+PD.lsGet(legacyDayKey)||0);\nfunction saveStoredDayBest(score){\n  const map=dayBestMap(); delete map[displayDate]; map[displayDate]=score;\n  const kept={}; Object.keys(map).slice(-31).forEach(date=>{ const v=+map[date]; if(Number.isFinite(v)&&v>0)kept[date]=v; });\n  PD.lsSet(DAYBEST_KEY,JSON.stringify(kept));\n}\nconst bestToday=()=>Math.max(storedDayBest(), lastScore??0); // always share the BEST, never a later weaker try\n\nfunction stats(){\n  document.getElementById(\"dayBestLabel\").textContent=seedDateMatch?(\"Day #\"+displayDayNum+\" Best\"):\"Today Best\";\n  document.getElementById(\"dayBest\").textContent=storedDayBest()?storedDayBest().toFixed(1)+\"%\":\"—\";\n  const ab=PD.get(PD.bestKey(GAME));\n  document.getElementById(\"allBest\").textContent=ab?ab.toFixed(1)+\"%\":\"—\";\n  document.getElementById(\"attempts\").textContent=attempts;\n  document.getElementById(\"streak\").textContent=\"🔥\"+PD.streak(GAME);\n}\nfunction guide(){\n  ctx.clearRect(0,0,W,W);\n  ctx.save();ctx.strokeStyle=\"#ddd6fe\";ctx.lineWidth=3;ctx.setLineDash([10,10]);\n  ctx.beginPath();ctx.arc(W/2,W/2,target.r*W,0,Math.PI*2);ctx.stroke();ctx.restore();\n  ctx.fillStyle=\"#a78bfa\";ctx.font=\"700 21px system-ui\";ctx.textAlign=\"center\";\n  ctx.fillText(\"draw about this size\",W/2,W/2);\n}\nfunction clearCanvas(){pts=[];guide();\n  document.getElementById(\"scoreBig\").textContent=\"✏️\";\n  document.getElementById(\"verdict\").textContent=\"One more — rounder this time!\";\n  document.getElementById(\"detail\").textContent=(seedDateMatch?\"This challenge day's\":\"Today's\")+\" best to beat: \"+bestToday().toFixed(1)+\"%\";}\nfunction pos(e){const r=cv.getBoundingClientRect();if(!r.width||!r.height)return{x:W/2,y:W/2};return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*W/r.height}}\ncv.addEventListener(\"pointerdown\",e=>{if(e.button>0||drawing)return;drawing=true;activePointerId=e.pointerId;pts=[pos(e)];try{cv.setPointerCapture?.(e.pointerId)}catch(err){}ctx.clearRect(0,0,W,W);PD.sfx.click();});\ncv.addEventListener(\"pointermove\",e=>{if(!drawing||e.pointerId!==activePointerId)return;pts.push(pos(e));\n  ctx.strokeStyle=\"#7c3aed\";ctx.lineWidth=7;ctx.lineCap=\"round\";ctx.lineJoin=\"round\";\n  ctx.beginPath();ctx.moveTo(pts[pts.length-2].x,pts[pts.length-2].y);ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);ctx.stroke();});\ncv.addEventListener(\"pointerup\",e=>{if(e.pointerId!==activePointerId)return;activePointerId=null;if(drawing){drawing=false;grade()}});\ncv.addEventListener(\"pointercancel\",e=>{if(e.pointerId!==activePointerId)return;activePointerId=null;drawing=false});\n\nfunction show(s,v,d){\n  document.getElementById(\"scoreBig\").innerHTML=(s>=95?\"😇<br>\":\"\")+s.toFixed(1)+\"%\";\n  document.getElementById(\"verdict\").textContent=v;\n  document.getElementById(\"detail\").innerHTML=d;\n}\n/* Re-sample the stroke every ~6px of ARC LENGTH.\n   Raw pointer events pile up where the finger moves slowly, which would\n   secretly weight slow patches more than fast ones in centre/radius maths. */\nfunction resample(points,step=6){\n  if(points.length<2)return points;\n  const out=[points[0]];let carry=0;\n  for(let i=1;i<points.length;i++){\n    let a=points[i-1]; const b=points[i];\n    let d=Math.hypot(b.x-a.x,b.y-a.y);\n    while(carry+d>=step){\n      const t=(step-carry)/d, np={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};\n      out.push(np); a=np; d=Math.hypot(b.x-a.x,b.y-a.y); carry=0;\n      if(d===0)break;\n    }\n    carry+=d;\n  }\n  out.push(points[points.length-1]); return out;\n}\nfunction grade(){\n  const sampled=resample(pts);\n  if(sampled.length<24){show(0,\"🥔 That's a potato!\",\"Draw a bigger, complete loop\");PD.sfx.bad();return}\n  let cx=0,cy=0;sampled.forEach(p=>{cx+=p.x;cy+=p.y});cx/=sampled.length;cy/=sampled.length;\n  const radii=sampled.map(p=>Math.hypot(p.x-cx,p.y-cy));\n  const meanR=radii.reduce((a,b)=>a+b,0)/radii.length;\n  if(meanR<35){show(0,\"🔹 Too tiny!\",\"Aim for today's target size\");PD.sfx.bad();return}\n  const variance=radii.reduce((a,r)=>a+(r-meanR)*(r-meanR),0)/radii.length;\n  const cvRatio=Math.sqrt(variance)/meanR;\n  const bins=new Set(sampled.map(p=>Math.floor(((Math.atan2(p.y-cy,p.x-cx)+Math.PI)/(Math.PI*2))*36)));\n  const coverage=bins.size/36;\n  const gap=Math.hypot(pts[0].x-pts[pts.length-1].x,pts[0].y-pts[pts.length-1].y)/(2*meanR);\n  const closure=Math.max(0,1-gap*0.9);\n  const sizeScore=Math.max(0,1-Math.abs(1-meanR/(target.r*W))*0.55);\n  let score=100*Math.exp(-3.2*cvRatio)*(0.55+0.45*coverage)*(0.7+0.3*closure)*(0.85+0.15*sizeScore);\n  score=Math.min(99.9,Math.max(0,score));\n  ctx.save();ctx.strokeStyle=\"#f43f5e\";ctx.lineWidth=3.5;ctx.setLineDash([8,8]);\n  ctx.beginPath();ctx.arc(cx,cy,meanR,0,Math.PI*2);ctx.stroke();ctx.restore();\n  if(score>=95){ctx.font=\"52px serif\";ctx.textAlign=\"center\";ctx.fillText(\"😇\",cx,Math.max(52,cy-meanR-12))}\n  attempts++;lastScore=score;\n  if(score>storedDayBest())saveStoredDayBest(score);\n  PD.saveBest(GAME,score);\n  if(!isPastChallenge)PD.markPlayed(GAME); // a friend's old day mustn't fake today's streak\n  stats();\n  let v,d;\n  if(score>=99){v=\"🤖 ARE YOU A ROBOT?!\";d=\"99%+ — virtually superhuman!\";PD.celebrate([\"⭕\",\"🤖\",\"⭐\"],30)}\n  else if(score>=95){v=\"😇 HALO LEGEND!\";d=\"95%+ — screenshot this masterpiece!\";PD.celebrate([\"⭕\",\"😇\",\"🎉\"],26)}\n  else if(score>=85){v=\"🎯 Sharpshooter!\";d=\"So close to the halo — one smoother stroke…\";PD.sfx.great()}\n  else if(score>=70){v=\"🌕 Moon-like!\";d=\"Good loop, slightly wobbly edges\";PD.sfx.good()}\n  else if(score>=50){v=\"🥚 That's an egg\";d=\"Slower, rounder, relax your wrist\";PD.sfx.click()}\n  else{v=\"🥔 Potato Circle!\";d=\"Everyone's first circle is a potato 😄 Try again\";PD.sfx.bad()}\n  d+=PD.challengeResultLine(Math.round(score*10)/10,beat);\n  show(score,v,d);\n}\nfunction rankEmoji(s){return s>=99?\"🤖\":s>=95?\"😇\":s>=85?\"🎯\":s>=70?\"🌕\":s>=50?\"🥚\":\"🥔\"}\nfunction shareText(){const s=bestToday();\n  return \"⭕ Perfect Circle Daily #\"+displayDayNum+\"\\nMy circle: \"+s.toFixed(1)+\"% \"+rankEmoji(s)+\n  \"\\n🎯 Target: \"+target.n+\"\\nCan you beat 95% and earn the halo? 😇👇\"}\nasync function doShare(){\n  try{\n    const blob= await new Promise(r=>cv.toBlob(r,\"image/png\"));\n    if(!blob)throw new Error(\"no-image\");\n    const file=new File([blob],\"my-perfect-circle.png\",{type:\"image/png\"});\n    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:shareText(),title:\"Perfect Circle Daily ⭕\"});return}\n  }catch(e){}\n  PD.share(shareText(),\"Perfect Circle Daily ⭕\");\n}\nguide();stats();\n","css":"\n  .canvasbox{background:#fff;border-radius:22px;padding:8px;box-shadow:var(--shadow)}\n  canvas#cv{display:block;width:100%;height:auto;border-radius:16px;background:#fafafa;touch-action:none;cursor:crosshair}\n  #scoreBig{font-size:54px;font-weight:900;line-height:1.05;color:#fde68a;text-align:center}\n  #verdict{font-size:17px;font-weight:900;text-align:center;margin-top:2px}\n  .ranks{background:#00000028;border:1px solid var(--line);border-radius:15px;padding:11px 14px;font-size:13px;line-height:1.75}\n"},"snake":{"title":"Snake Daily Maze 🐍 — A New Maze Every Day!","body":"<div class=\"wrap\">\n  <nav class=\"topbar\" aria-label=\"Arcade navigation\"><a class=\"back\" href=\"../index.html\">⬅ Arcade<\/a><span class=\"brand\">🎮 Play<b>Daily10<\/b><\/span><button class=\"iconbtn\" id=\"soundBtn\" title=\"Sound\">🔊<\/button><\/nav>\n  <main>\n  <header class=\"hero\">\n    <div style=\"font-size:42px\">🐍<\/div>\n    <h1>Snake <span class=\"grad\">Daily Maze<\/span><\/h1>\n    <p class=\"tag\">Eat 🍎, grow long, dodge the violet walls.<br><b>Swipe<\/b>, use the pad, or arrow keys — don't bite yourself!<\/p>\n  <\/header>\n  <noscript><p class=\"banner target\">JavaScript is required to play this game. Please enable JavaScript and reload.<\/p><\/noscript>\n\n  <div id=\"challBanner\"><\/div>\n  <div class=\"modes\">\n    <button id=\"mDaily\" class=\"active\" onclick=\"setMode('daily')\">☀️ Daily Maze #<span id=\"dNum\"><\/span><\/button>\n    <button id=\"mFree\" onclick=\"setMode('free')\">♾️ Free Maze<\/button>\n    <button id=\"mOpen\" onclick=\"setMode('open')\">🌤️ Open Field<\/button>\n  <\/div>\n  <div class=\"stats\">\n    <div class=\"stat\"><b id=\"apples\">🍎0<\/b><span>Apples<\/span><\/div>\n    <div class=\"stat\"><b id=\"score\">0<\/b><span>Score<\/span><\/div>\n    <div class=\"stat\"><b id=\"time\">0:00<\/b><span>Time<\/span><\/div>\n    <div class=\"stat\"><b id=\"best\">0<\/b><span>Best<\/span><\/div>\n  <\/div>\n\n  <div class=\"panel\">\n    <canvas class=\"game\" id=\"cv\" tabindex=\"0\" role=\"img\" aria-label=\"Snake maze game. Use swipe, the direction pad, or arrow keys.\" width=\"476\" height=\"476\"><\/canvas>\n    <div class=\"dpad\">\n      <span class=\"blank\"><\/span><button onclick=\"setDir(0,-1)\" aria-label=\"Move up\">⬆️<\/button><span class=\"blank\"><\/span>\n      <button onclick=\"setDir(-1,0)\" aria-label=\"Move left\">⬅️<\/button><button onclick=\"setDir(0,1)\" aria-label=\"Move down\">⬇️<\/button><button onclick=\"setDir(1,0)\" aria-label=\"Move right\">➡️<\/button>\n    <\/div>\n    <div class=\"toolbar\">\n      <button onclick=\"togglePause()\" id=\"pauseBtn\">▶️ Start<\/button>\n      <button onclick=\"newGame()\">🔄 Restart<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"btns\">\n    <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n    <button class=\"act primary\" onclick=\"newGame()\">🐍 Play Again<\/button>\n    <button class=\"act ghost\" onclick=\"challengeMe()\">⚔️ Challenge a Friend<\/button>\n    <button class=\"act ghost\" onclick=\"PD.whatsapp(shareText())\">💬 WhatsApp<\/button>\n  <\/div>\n\n  <details class=\"howto\"><summary>🎮 How to Play (10 seconds)<\/summary>\n    <ul>\n      <li>Steer with <b>swipes<\/b>, the on-screen pad, <b>arrow keys<\/b> or WASD.<\/li>\n      <li>Every 🍎 makes you longer (+100). Surviving earns +2 per second.<\/li>\n      <li>Speed rises every 5 apples. Hitting a wall, the border, or your own tail ends the run.<\/li>\n      <li>☀️ <b>Daily Maze:<\/b> same walls and same apple order for every player today. Mazes are generated with guaranteed open paths.<\/li>\n      <li>Pro tip: hug the walls in big loops — greedy shortcuts are how tails get bitten 🌀<\/li>\n    <\/ul>\n  <\/details>\n  <\/main>\n  <footer>🕹️ Arcade • Game #8 of 10 • <a href=\"../index.html\">Play the other 9 today →<\/a><\/footer>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\"><div class=\"modal\">\n  <div class=\"big\" id=\"ovEmoji\">🐍<\/div><h2 id=\"ovTitle\"><\/h2><p id=\"ovText\"><\/p>\n  <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n  <button class=\"act primary\" onclick=\"PD.hideModal();newGame()\">▶️ Play Again<\/button>\n  <button class=\"act ghost\" onclick=\"PD.hideModal()\">👀 View Maze<\/button>\n<\/div><\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>","js":"\nconst GAME=\"snake\", cv=document.getElementById(\"cv\"), ctx=cv.getContext(\"2d\");\nconst G=17, CELL=cv.width/G;\nlet mode=\"daily\",state=\"ready\",snake,dir,nextDirs,apple,walls,wallSet,rng,applesN,score,elapsed,acc,lastTs,stepMs,currentSeed=\"\";\nlet beat=PD.challengeBanner(), challSeed=PD.challengeSeed();\ndocument.getElementById(\"dNum\").textContent=PD.dailyNumber();\nconst C=8; // center cell\n\nfunction setMode(m){mode=m; beat=(m===\"daily\")?PD.challengeBanner():null; if(m!==\"daily\"){const cb=document.getElementById(\"challBanner\"); if(cb)cb.className=\"banner\";}\n  document.getElementById(\"mDaily\").classList.toggle(\"active\",m===\"daily\");\n  document.getElementById(\"mFree\").classList.toggle(\"active\",m===\"free\");\n  document.getElementById(\"mOpen\").classList.toggle(\"active\",m===\"open\"); newGame();}\nfunction reachableFrom(start,blocked){\n  const seen=new Set([start]),q=[start.split(\",\").map(Number)];\n  while(q.length){const[x,y]=q.shift();\n    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){\n      const nx=x+dx,ny=y+dy,k=nx+\",\"+ny;\n      if(nx<0||ny<0||nx>=G||ny>=G||blocked.has(k)||seen.has(k))continue;\n      seen.add(k);q.push([nx,ny]);}}\n  return seen;\n}\nfunction genMaze(){\n  if(mode===\"open\")return new Set();\n  for(let attempt=0;attempt<120;attempt++){\n    const ws=new Set();\n    const target= mode===\"daily\" ? 26 + Math.floor(rng()*10) : 30;\n    while(ws.size<target){\n      const x=Math.floor(rng()*G),y=Math.floor(rng()*G);\n      if(Math.abs(x-C)<=2&&Math.abs(y-C)<=2)continue;          // safe spawn zone\n      ws.add(x+\",\"+y);\n      if(rng()<0.55){const dx=rng()<0.5?1:0,dy=dx?0:1;          // short wall segments\n        const nx=x+dx,ny=y+dy; if(nx<G&&ny<G&&!(Math.abs(nx-C)<=2&&Math.abs(ny-C)<=2))ws.add(nx+\",\"+ny);}\n    }\n    const reach=reachableFrom(C+\",\"+C,ws);\n    if(reach.size>=(G*G-ws.size)*0.93)return ws;\n  }\n  return new Set();\n}\nfunction spawnApple(){\n  const blocked=new Set([...wallSet,...snake.map(s=>s[0]+\",\"+s[1])]);\n  const reach=reachableFrom(snake[0][0]+\",\"+snake[0][1],wallSet);\n  const free=[...reach].filter(k=>!blocked.has(k));\n  if(!free.length)return null;\n  return free[Math.floor(rng()*free.length)].split(\",\").map(Number);\n}\nfunction newGame(){\n  currentSeed=(mode===\"daily\"&&challSeed)||(mode===\"daily\"?\"snake-\"+PD.todayStr():\"snake-\"+mode+\"-\"+Date.now());\n  rng=PD.rngFrom(currentSeed);\n  wallSet=genMaze();\n  snake=[[C,C],[C-1,C],[C-2,C]]; dir=[1,0]; nextDirs=[];\n  apple=spawnApple();\n  applesN=0;score=0;elapsed=0;acc=0;stepMs=150;state=\"ready\";\n  document.getElementById(\"pauseBtn\").textContent=\"▶️ Start\";\n  PD.hideModal(); stats(); draw();\n}\nfunction stats(){\n  document.getElementById(\"apples\").textContent=\"🍎\"+applesN;\n  document.getElementById(\"score\").textContent=PD.fmt(score);\n  document.getElementById(\"best\").textContent=PD.fmt(PD.getBest(GAME,mode));\n  document.getElementById(\"time\").textContent=Math.floor(elapsed/60)+\":\"+String(Math.floor(elapsed%60)).padStart(2,\"0\");\n}\nfunction setDir(x,y){\n  if(state===\"ready\")startGame();\n  const last=nextDirs.length?nextDirs[nextDirs.length-1]:dir;\n  if(last[0]===-x&&last[1]===-y)return;         // no 180° turns\n  if(last[0]===x&&last[1]===y)return;\n  if(nextDirs.length<3)nextDirs.push([x,y]);\n}\nwindow.setDir=setDir;\nfunction startGame(){ if(state!==\"ready\")return; state=\"playing\";\n  document.getElementById(\"pauseBtn\").textContent=\"⏸️ Pause\"; lastTs=performance.now(); requestAnimationFrame(loop); }\nfunction togglePause(){\n  if(state===\"ready\")return startGame();\n  if(state===\"playing\"){state=\"paused\";document.getElementById(\"pauseBtn\").textContent=\"▶️ Resume\";draw()}\n  else if(state===\"paused\"){state=\"playing\";document.getElementById(\"pauseBtn\").textContent=\"⏸️ Pause\";lastTs=performance.now();requestAnimationFrame(loop)}\n}\naddEventListener(\"keydown\",e=>{\n  if(e.code===\"Space\"&&/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;\n  const map={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};\n  if(map[e.code]){e.preventDefault();setDir(...map[e.code])}\n  if(e.code===\"Space\"||e.code===\"KeyP\"){e.preventDefault();togglePause()}\n});\nlet swipeStart=null;\ncv.addEventListener(\"pointerdown\",e=>{if(e.button>0)return;swipeStart={x:e.clientX,y:e.clientY};if(state===\"ready\")startGame()});\ncv.addEventListener(\"pointerup\",e=>{\n  if(!swipeStart)return;\n  const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y; swipeStart=null;\n  if(Math.hypot(dx,dy)<22)return;\n  Math.abs(dx)>Math.abs(dy)?setDir(Math.sign(dx),0):setDir(0,Math.sign(dy));\n});\ndocument.addEventListener(\"visibilitychange\",()=>{if(document.hidden&&state===\"playing\")togglePause()});\nfunction loop(ts){\n  if(state!==\"playing\")return;\n  const dt=Math.min(100,ts-lastTs); lastTs=ts; acc+=dt; elapsed+=dt/1000;\n  score=applesN*100+Math.floor(elapsed)*2;\n  while(acc>=stepMs){acc-=stepMs; if(!step()){draw();stats();return}}\n  draw(); stats(); requestAnimationFrame(loop);\n}\nfunction step(){\n  if(nextDirs.length)dir=nextDirs.shift();\n  const head=[snake[0][0]+dir[0],snake[0][1]+dir[1]];\n  const eats=apple&&head[0]===apple[0]&&head[1]===apple[1];\n  const bodyToCheck=eats?snake:snake.slice(0,-1);\n  if(head[0]<0||head[1]<0||head[0]>=G||head[1]>=G||wallSet.has(head[0]+\",\"+head[1])||\n     bodyToCheck.some(([x,y])=>x===head[0]&&y===head[1])){gameOver();return false}\n  snake.unshift(head);\n  if(eats){\n    applesN++; PD.sfx.good();\n    if(applesN%5===0){stepMs=Math.max(82,stepMs-9);PD.toast(\"⚡ Speed up!\")}\n    apple=spawnApple();\n    if(!apple){winGame();return false}\n  } else snake.pop();\n  return true;\n}\nfunction finish(){PD.saveBest(GAME,score,mode);if(mode===\"daily\")PD.markPlayed(GAME);stats()}\nfunction gameOver(){\n  state=\"dead\"; finish(); PD.sfx.bad();\n  const tier=applesN>=25?\"🏆 SNAKE LEGEND!\":applesN>=15?\"🥇 Maze Master!\":applesN>=8?\"🥈 Slither Pro!\":\"🌱 The maze wins this round!\";\n  PD.showModal(\"💥\",\"Crashed!\",\"Apples eaten: 🍎 <b>\"+applesN+\"<\/b> • Length: \"+snake.length+\" • Score: <b>\"+PD.fmt(score)+\"<\/b>\"+\n   \"<br>\"+tier+PD.challengeResultLine(score,beat)+\"<br>Same maze, same apples — one more run?\");\n}\nfunction winGame(){\n  state=\"won\"; score+=1000; finish(); PD.celebrate([\"🐍\",\"🍎\",\"🏆\"],30);\n  PD.showModal(\"🏆\",\"YOU CONQUERED THE MAZE!\",\"Incredible — no room left for a new apple!<br>Score: <b>\"+PD.fmt(score)+\"<\/b>\"+PD.challengeResultLine(score,beat));\n}\nfunction draw(){\n  ctx.fillStyle=\"#0a1428\"; ctx.fillRect(0,0,cv.width,cv.height);\n  for(let y=0;y<G;y++)for(let x=0;x<G;x++)if((x+y)%2===0){ctx.fillStyle=\"#0e1c3a\";ctx.fillRect(x*CELL,y*CELL,CELL,CELL)}\n  wallSet.forEach(k=>{const[x,y]=k.split(\",\").map(Number);\n    const g=ctx.createLinearGradient(x*CELL,y*CELL,x*CELL+CELL,y*CELL+CELL);\n    g.addColorStop(0,\"#8b5cf6\");g.addColorStop(1,\"#5b21b6\");ctx.fillStyle=g;\n    ctx.beginPath();ctx.roundRect(x*CELL+1.5,y*CELL+1.5,CELL-3,CELL-3,6);ctx.fill();});\n  if(apple){ctx.font=(CELL-2)+\"px serif\";ctx.textAlign=\"center\";ctx.textBaseline=\"middle\";\n    ctx.fillText(\"🍎\",apple[0]*CELL+CELL/2,apple[1]*CELL+CELL/2+1)}\n  // snake (tail → head)\n  for(let i=snake.length-1;i>=0;i--){\n    const[x,y]=snake[i], t=i/snake.length;\n    ctx.fillStyle=i===0?\"#4ade80\":`hsl(${130+t*40},72%,${46-t*14}%)`;\n    ctx.beginPath();ctx.roundRect(x*CELL+2,y*CELL+2,CELL-4,CELL-4,i===0?10:8);ctx.fill();\n    if(i===0){\n      ctx.fillStyle=\"#052e16\";\n      const ex=dir[0]*5,ey=dir[1]*5,px=x*CELL+CELL/2,py=y*CELL+CELL/2;\n      const perp=[-dir[1],dir[0]];\n      [[-6],[6]].forEach(([o])=>{ctx.beginPath();\n        ctx.arc(px+ex+perp[0]*o,py+ey+perp[1]*o,3,0,7);ctx.fill()});\n    }\n  }\n  ctx.textAlign=\"center\";\n  if(state===\"ready\"){ctx.fillStyle=\"#00000077\";ctx.fillRect(0,cv.height/2-52,cv.width,96);\n    ctx.fillStyle=\"#fff\";ctx.font=\"900 24px system-ui\";ctx.fillText(mode===\"daily\"?\"☀️ TODAY'S MAZE\":\"🐍 READY?\",cv.width/2,cv.height/2-16);\n    ctx.font=\"700 15px system-ui\";ctx.fillText(\"Swipe / arrows / pad to start\",cv.width/2,cv.height/2+16); }\n  if(state===\"paused\"){ctx.fillStyle=\"#00000088\";ctx.fillRect(0,0,cv.width,cv.height);\n    ctx.fillStyle=\"#fff\";ctx.font=\"900 32px system-ui\";ctx.fillText(\"⏸️ PAUSED\",cv.width/2,cv.height/2); }\n  if(state===\"dead\"){ctx.font=\"30px serif\";ctx.fillText(\"💥\",snake[0][0]*CELL+CELL/2,snake[0][1]*CELL+CELL/2)}\n}\nfunction shareText(){\n  return \"🐍 Snake \"+(mode===\"daily\"?\"Daily Maze #\"+PD.dailyNumber():mode===\"open\"?\"Open Field\":\"Free Maze\")+\n   \"\\n🍎 Apples: \"+applesN+\" • Length: \"+snake.length+\" • Score: \"+PD.fmt(score)+\" • 🔥\"+PD.streak(GAME)+\n   \"\\n\\nSame maze, same apple order — out-slither me! 👇\"}\nfunction challengeMe(){if(mode!==\"daily\"){PD.toast(\"☀️ Switch to Daily mode to create a fair, same-rules challenge\");return} PD.challengeLink(score,currentSeed)}\nfunction doShare(){PD.share(shareText(),\"Snake Daily Maze 🐍\")}\nnewGame();\n","css":"\n  .dpad{display:grid;grid-template-columns:repeat(3,64px);gap:7px;justify-content:center;margin-top:12px}\n  .dpad button{height:54px;border-radius:15px;border:1px solid var(--line);background:var(--card2);color:#fff;font-size:22px;cursor:pointer}\n  .dpad button:active{background:var(--gold);color:#422006}\n  .dpad .blank{visibility:hidden}\n  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}\n  .toolbar button{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:12px;padding:11px;font-weight:900;cursor:pointer}\n  @media (min-width:760px){.dpad{display:none}}\n"},"stackup":{"title":"StackUp Daily 🏗️ — How Tall Can You Build?","body":"<div class=\"wrap\">\n  <nav class=\"topbar\" aria-label=\"Arcade navigation\"><a class=\"back\" href=\"../index.html\">⬅ Arcade<\/a><span class=\"brand\">🎮 Play<b>Daily10<\/b><\/span><button class=\"iconbtn\" id=\"soundBtn\" title=\"Sound\">🔊<\/button><\/nav>\n  <main>\n  <header class=\"hero\">\n    <div style=\"font-size:42px\">🏗️<\/div>\n    <h1>Stack<span class=\"grad\">Up<\/span> Daily<\/h1>\n    <p class=\"tag\">The block slides left ↔ right. <b>Tap<\/b> to drop it.<br>Only the overlapping part survives — <b>how tall can you go?<\/b><\/p>\n  <\/header>\n  <noscript><p class=\"banner target\">JavaScript is required to play this game. Please enable JavaScript and reload.<\/p><\/noscript>\n\n  <div id=\"challBanner\"><\/div>\n  <div class=\"modes\">\n    <button id=\"mDaily\" class=\"active\" onclick=\"setMode('daily')\">☀️ Daily #<span id=\"dNum\"><\/span><\/button>\n    <button id=\"mFree\" onclick=\"setMode('free')\">♾️ Free Play<\/button>\n    <button id=\"mZen\" onclick=\"setMode('zen')\">🧘 Zen (relaxed)<\/button>\n  <\/div>\n  <div class=\"stats\">\n    <div class=\"stat\"><b id=\"height\">0<\/b><span>Height<\/span><\/div>\n    <div class=\"stat\"><b id=\"score\">0<\/b><span>Score<\/span><\/div>\n    <div class=\"stat\"><b id=\"best\">0<\/b><span>Best<\/span><\/div>\n    <div class=\"stat\"><b id=\"perfects\">⭐0<\/b><span>Perfects<\/span><\/div>\n  <\/div>\n\n  <div class=\"panel\">\n    <canvas class=\"game\" id=\"cv\" tabindex=\"0\" role=\"img\" aria-label=\"StackUp tower game. Tap or press Space to drop the moving block.\" width=\"480\" height=\"620\"><\/canvas>\n    <div class=\"toolbar\">\n      <button onclick=\"togglePause()\" id=\"pauseBtn\">⏸️ Pause<\/button>\n      <button onclick=\"newGame()\">🔄 Restart<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"btns\">\n    <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n    <button class=\"act primary\" onclick=\"newGame()\">🏗️ Build Again<\/button>\n    <button class=\"act ghost\" onclick=\"challengeMe()\">⚔️ Challenge a Friend<\/button>\n    <button class=\"act ghost\" onclick=\"PD.whatsapp(shareText())\">💬 WhatsApp<\/button>\n  <\/div>\n\n  <details class=\"howto\"><summary>🎮 How to Play (10 seconds)<\/summary>\n    <ul>\n      <li>Watch the block slide. <b>Tap / Click / Space<\/b> to drop it onto the tower.<\/li>\n      <li>Whatever hangs over the edge gets <b>sliced off forever<\/b> — your next block is that much smaller.<\/li>\n      <li>Land a <b>⭐ PERFECT<\/b> (dead-center) and your block <b>grows back<\/b> a little + streak bonus!<\/li>\n      <li>Miss the tower completely and the run ends. Speed rises as you climb.<\/li>\n      <li>☀️ <b>Daily:<\/b> today has its own speed &amp; color pattern (weekends are spicier 🌶️). 🧘 <b>Zen:<\/b> half speed, pure relaxation — scores don't record streaks.<\/li>\n    <\/ul>\n  <\/details>\n  <\/main>\n  <footer>⏱️ Timing &amp; Skill • Game #6 of 10 • <a href=\"../index.html\">Play the other 9 today →<\/a><\/footer>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\"><div class=\"modal\">\n  <div class=\"big\" id=\"ovEmoji\">🏗️<\/div><h2 id=\"ovTitle\"><\/h2><p id=\"ovText\"><\/p>\n  <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n  <button class=\"act primary\" onclick=\"PD.hideModal();newGame()\">▶️ Build Again<\/button>\n  <button class=\"act ghost\" onclick=\"PD.hideModal()\">👀 View Tower<\/button>\n<\/div><\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>","js":"\nconst GAME=\"stackup\", cv=document.getElementById(\"cv\"), ctx=cv.getContext(\"2d\");\nconst W=cv.width,H=cv.height,BH=30,BASE_W=240;\nlet mode=\"daily\",state=\"ready\",blocks,moving,dir,speed,score,heightN=0,perfectN,perfectStreak,rng,lastTs,falling,currentSeed=\"\",runId=0;\nlet beat=PD.challengeBanner(), challSeed=PD.challengeSeed();\ndocument.getElementById(\"dNum\").textContent=PD.dailyNumber();\nfunction hueFor(level){return (level*14+(seedHue||200))%360}\nlet seedHue=200;\nfunction setMode(m){mode=m; beat=(m===\"daily\")?PD.challengeBanner():null; if(m!==\"daily\"){const cb=document.getElementById(\"challBanner\"); if(cb)cb.className=\"banner\";}\n  document.getElementById(\"mDaily\").classList.toggle(\"active\",m===\"daily\");\n  document.getElementById(\"mFree\").classList.toggle(\"active\",m===\"free\");\n  document.getElementById(\"mZen\").classList.toggle(\"active\",m===\"zen\"); newGame();}\nfunction seedDateStr(){\n  const m=typeof currentSeed===\"string\"&&currentSeed.match(/^stackup-(\\d{4}-\\d{2}-\\d{2})$/);\n  if(!m)return null;\n  const d=new Date(m[1]+\"T00:00:00Z\");\n  return (!Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===m[1])?m[1]:null;\n}\nfunction dailyBaseSpeed(){\n  if(mode===\"zen\")return 0.55;\n  if(mode!==\"daily\")return 1;\n  // A challenge link replays the CHALLENGER's weekday speed, not today's\n  const ds=seedDateStr();\n  const dow=ds?new Date(ds+\"T00:00:00Z\").getUTCDay():new Date().getUTCDay(); // Mon gentle → weekend spicy\n  return [1.25,0.85,0.92,1.0,1.08,1.16,1.25][dow];\n}\nfunction newGame(){\n  runId++; flashMsg=\"\";\n  currentSeed=(mode===\"daily\"&&challSeed)||(mode===\"daily\"?\"stackup-\"+PD.todayStr():\"stackup-\"+mode+\"-\"+Date.now());\n  rng=PD.rngFrom(currentSeed); seedHue=Math.floor(rng()*360);\n  blocks=[{x:(W-BASE_W)/2,w:BASE_W,level:0}];\n  heightN=0;perfectN=0;perfectStreak=0;score=0;falling=null;state=\"ready\";\n  speed=2.1*dailyBaseSpeed(); dir=rng()<0.5?1:-1;\n  spawnMoving();\n  document.getElementById(\"pauseBtn\").textContent=\"⏸️ Pause\";\n  PD.hideModal(); stats(); draw();\n}\nfunction spawnMoving(){\n  const below=blocks[blocks.length-1];\n  moving={x:dir>0?0:W-below.w,w:below.w,level:blocks.length};\n}\nfunction bestVariant(){return mode===\"zen\"?\"free\":mode}\nfunction stats(){\n  document.getElementById(\"height\").textContent=heightN;\n  document.getElementById(\"score\").textContent=PD.fmt(score);\n  document.getElementById(\"best\").textContent=PD.fmt(PD.getBest(GAME,bestVariant()));\n  document.getElementById(\"perfects\").textContent=\"⭐\"+perfectN;\n}\nfunction startIfNeeded(){if(state===\"ready\"){state=\"playing\";lastTs=performance.now();requestAnimationFrame(loop)}}\ncv.addEventListener(\"pointerdown\",e=>{if(e.button>0)return;e.preventDefault();if(state===\"paused\"||state===\"dead\")return;if(state===\"ready\"){startIfNeeded();return}drop()});\naddEventListener(\"keydown\",e=>{if(e.code===\"Space\"&&/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;if(e.code===\"Space\"||e.code===\"ArrowDown\"){e.preventDefault();if(state===\"ready\"){startIfNeeded();return}if(state===\"playing\")drop()}\n  if(e.code===\"KeyP\")togglePause()});\ndocument.addEventListener(\"visibilitychange\",()=>{if(document.hidden&&state===\"playing\")togglePause()});\nfunction togglePause(){\n  if(state===\"playing\"){state=\"paused\";document.getElementById(\"pauseBtn\").textContent=\"▶️ Resume\";draw()}\n  else if(state===\"paused\"){state=\"playing\";document.getElementById(\"pauseBtn\").textContent=\"⏸️ Pause\";lastTs=performance.now();requestAnimationFrame(loop)}\n}\nfunction loop(ts){\n  if(state!==\"playing\")return;\n  const dt=Math.min(0.05,(ts-lastTs)/1000); lastTs=ts;\n  moving.x+=dir*speed*180*dt;\n  if(moving.x<=0){moving.x=0;dir=1} if(moving.x+moving.w>=W){moving.x=W-moving.w;dir=-1}\n  if(falling){falling.y+=620*dt;falling.rot+=falling.vr*dt;if(falling.y>H+80)falling=null}\n  draw(); requestAnimationFrame(loop);\n}\nfunction drop(){\n  const below=blocks[blocks.length-1];\n  const left=Math.max(moving.x,below.x), right=Math.min(moving.x+moving.w,below.x+below.w);\n  const overlap=right-left;\n  if(overlap<=0){\n    falling={x:moving.x,w:moving.w,y:yOf(moving.level+1)+4,level:moving.level,rot:0,vr:(moving.x<below.x?-2.4:2.4)};\n    return gameOver();\n  }\n  const offset=Math.abs(moving.x-below.x);\n  const perfect=offset<=7;\n  // sliced-off piece animation\n  if(!perfect){\n    if(moving.x<below.x)falling={x:moving.x,w:below.x-moving.x,y:yOf(moving.level+1)+4,level:moving.level,rot:0,vr:-2.2};\n    else if(moving.x+moving.w>below.x+below.w)falling={x:below.x+below.w,w:(moving.x+moving.w)-(below.x+below.w),y:yOf(moving.level+1)+4,level:moving.level,rot:0,vr:2.2};\n  }\n  let nw=overlap, nx=left;\n  heightN++; score+=10;\n  if(perfect){\n    perfectN++; perfectStreak++;\n    nw=Math.min(BASE_W,below.w+12); nx=Math.max(0,Math.min(W-nw,below.x+(below.w-nw)/2));\n    score+=15+perfectStreak*5;\n    PD.sfx.good();\n    flashMsg=\"⭐ PERFECT! ×\"+perfectStreak+\" streak  +\"+(15+perfectStreak*5);\n  } else { perfectStreak=0; PD.sfx.pop(3); flashMsg=\"\"; }\n  blocks.push({x:nx,w:nw,level:moving.level});\n  speed=Math.min(5.2*dailyBaseSpeed(),speed+0.055*dailyBaseSpeed());\n  dir=(heightN%2===0)?1:-1;\n  spawnMoving(); stats(); draw();\n  clearTimeout(drop._t); drop._t=setTimeout(()=>{flashMsg=\"\";if(state!==\"playing\")draw()},900);\n}\nlet flashMsg=\"\";\nfunction yOf(level){\n  const camRow=Math.max(0,blocks.length-13);\n  return H-70-(level-camRow)*BH;\n}\nfunction blockColor(level){return `hsl(${hueFor(level)},78%,${52+((level*7)%14)}%)`}\nfunction drawBlock(x,y,w,level,alpha=1){\n  ctx.save(); ctx.globalAlpha=alpha;\n  const g=ctx.createLinearGradient(x,y,x+w,y+BH);\n  g.addColorStop(0,blockColor(level)); g.addColorStop(1,`hsl(${hueFor(level)+28},75%,42%)`);\n  ctx.fillStyle=g;\n  ctx.beginPath(); ctx.roundRect(x,y-BH+4,w,BH-4,7); ctx.fill();\n  ctx.strokeStyle=\"#ffffff55\"; ctx.stroke();\n  ctx.restore();\n}\nfunction draw(){\n  const grd=ctx.createLinearGradient(0,0,0,H);\n  grd.addColorStop(0,\"#111c3f\");grd.addColorStop(.55,\"#22356e\");grd.addColorStop(1,\"#0a0f24\");\n  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);\n  ctx.fillStyle=\"#ffffff16\";\n  for(let i=0;i<9;i++){ctx.fillRect(0,H-70-i*BH*3,W,1)}\n  // ground\n  ctx.fillStyle=\"#0f172a\";ctx.fillRect(0,H-66,W,66);\n  ctx.fillStyle=\"#facc15\";ctx.fillRect(0,H-70,W,4);\n  // height markers\n  ctx.fillStyle=\"#ffffff88\";ctx.font=\"800 12px system-ui\";ctx.textAlign=\"left\";\n  for(let m=10;m<=Math.max(50,heightN+10);m+=10){const y=yOf(m);if(y>30&&y<H-80)ctx.fillText(\"— \"+m,8,y-6)}\n  blocks.forEach(b=>drawBlock(b.x,yOf(b.level+1)+BH,b.w,b.level));\n  if(falling){ctx.save();ctx.translate(falling.x+falling.w/2,falling.y);ctx.rotate(falling.rot);\n    drawBlock(-falling.w/2,BH-4,falling.w,falling.level,.85);ctx.restore()}\n  if(state!==\"dead\"&&moving)drawBlock(moving.x,yOf(moving.level+1)+BH,moving.w,moving.level);\n  // guide line\n  if(state===\"playing\"&&moving){ctx.save();ctx.strokeStyle=\"#ffffff33\";ctx.setLineDash([4,7]);\n    ctx.beginPath();ctx.moveTo(moving.x+moving.w/2,yOf(moving.level+1)+BH);ctx.lineTo(moving.x+moving.w/2,H-70);ctx.stroke();ctx.restore()}\n  ctx.textAlign=\"center\";\n  if(state===\"ready\"){ctx.fillStyle=\"#fff\";ctx.font=\"900 24px system-ui\";ctx.fillText(\"👆 TAP TO START BUILDING\",W/2,110);\n    ctx.font=\"700 15px system-ui\";ctx.fillText(mode===\"daily\"?((seedDateStr()&&seedDateStr()!==PD.todayStr())?\"Challenge speed: \":\"Today's speed: \")+Math.round(dailyBaseSpeed()*100)+\"% — same for everyone\":\"Stack as tall as you can!\",W/2,140)}\n  if(flashMsg&&state===\"playing\"){ctx.fillStyle=\"#fde68a\";ctx.font=\"900 21px system-ui\";ctx.fillText(flashMsg,W/2,84)}\n  if(state===\"paused\"){ctx.fillStyle=\"#00000088\";ctx.fillRect(0,0,W,H);ctx.fillStyle=\"#fff\";ctx.font=\"900 32px system-ui\";ctx.fillText(\"⏸️ PAUSED\",W/2,H/2)}\n}\nfunction gameOver(){\n  state=\"dead\";\n  if(mode===\"daily\")PD.markPlayed(GAME);\n  if(mode!==\"zen\")PD.saveBest(GAME,score,bestVariant());\n  stats(); PD.sfx.bad();\n  // let the missed block fall, then show results (cancelled if player restarts)\n  const myRun=runId;\n  const anim=t0=>{const stepFn=ts=>{\n    if(myRun!==runId)return;\n    if(falling){falling.y+=9;falling.rot+=falling.vr*0.016;if(falling.y>H+90)falling=null}\n    draw(); if(ts-t0<650)requestAnimationFrame(stepFn); else showEnd();};requestAnimationFrame(stepFn)};\n  anim(performance.now());\n}\nfunction showEnd(){\n  const tier=heightN>=60?\"🏆 SKYSCRAPER LEGEND!\":heightN>=40?\"🥇 Master Builder!\":heightN>=25?\"🥈 Tower Pro!\":heightN>=12?\"🥉 Solid stack!\":\"🌱 Every skyscraper starts somewhere!\";\n  PD.showModal(\"🏗️\",\"Tower Height: \"+heightN,\n   \"Score: <b>\"+PD.fmt(score)+\"<\/b> • ⭐ Perfect drops: \"+perfectN+\"<br>\"+tier+PD.challengeResultLine(score,beat)+\n   \"<br>Tip: drop a hair BEFORE the center — your eyes lag a few milliseconds 😉\");\n}\nfunction towerEmoji(){\n  const rows=blocks.slice(-9).reverse().map(b=>{\n    const filled=Math.max(1,Math.round(b.w/BASE_W*7));\n    const leftPad=Math.max(0,Math.round((b.x)/W*7));\n    return \"⬛\".repeat(leftPad)+\"🟦\".repeat(filled);\n  });\n  return rows.join(\"\\n\");\n}\nfunction shareText(){\n  return \"🏗️ StackUp \"+(mode===\"daily\"?\"Daily #\"+PD.dailyNumber():mode===\"zen\"?\"Zen\":\"Free Play\")+\n   \"\\nHeight: \"+heightN+\" • Score: \"+PD.fmt(score)+\" • ⭐ Perfects: \"+perfectN+\" • 🔥\"+PD.streak(GAME)+\n   \"\\n\\n\"+towerEmoji()+\"\\n\\nSame speed pattern — build taller than me! 👇\"}\nfunction challengeMe(){if(mode!==\"daily\"){PD.toast(\"☀️ Switch to Daily mode to create a fair, same-rules challenge\");return} PD.challengeLink(score,currentSeed)}\nfunction doShare(){PD.share(shareText(),\"StackUp Daily 🏗️\")}\nnewGame();\n","css":".toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}\n .toolbar button{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:12px;padding:11px;font-weight:900;cursor:pointer}"},"stop5000":{"title":"Stop 5.000 ⏱️ — The Hidden-Timer Challenge!","body":"<div class=\"wrap\">\n  <nav class=\"topbar\" aria-label=\"Arcade navigation\"><a class=\"back\" href=\"../index.html\">⬅ Arcade<\/a><span class=\"brand\">🎮 Play<b>Daily10<\/b><\/span><button class=\"iconbtn\" id=\"soundBtn\" title=\"Sound\">🔊<\/button><\/nav>\n  <main>\n  <header class=\"hero\">\n    <div style=\"font-size:42px\">⏱️<\/div>\n    <h1>Stop <span class=\"grad\">5.000<\/span><\/h1>\n    <p class=\"tag\">Three rounds of pure timing: <b>⚡ Reaction<\/b> • <b>⏱️ The Hidden 5.000<\/b> • <b>🎯 Precision Bar<\/b>.<br>Perfect game = <b>1,000 points<\/b>. Robots only… probably.<\/p>\n  <\/header>\n  <noscript><p class=\"banner target\">JavaScript is required to play this game. Please enable JavaScript and reload.<\/p><\/noscript>\n\n  <div id=\"challBanner\"><\/div>\n  <div class=\"modes\">\n    <button id=\"mDaily\" class=\"active\" onclick=\"setMode('daily')\">☀️ Daily Course #<span id=\"dNum\"><\/span><\/button>\n    <button id=\"mFree\" onclick=\"setMode('free')\">♾️ Practice<\/button>\n  <\/div>\n  <div class=\"stats three\">\n    <div class=\"stat\"><b id=\"total\">0<\/b><span>Total / 1000<\/span><\/div>\n    <div class=\"stat\"><b id=\"best\">0<\/b><span>Best<\/span><\/div>\n    <div class=\"stat\"><b id=\"streak\">🔥0<\/b><span>Streak<\/span><\/div>\n  <\/div>\n\n  <div class=\"roundchips\">\n    <div class=\"rchip\" id=\"chip1\">⚡ ROUND 1<br>Reaction<b>—<\/b><\/div>\n    <div class=\"rchip\" id=\"chip2\">⏱️ ROUND 2<br>Stop at 5.000<b>—<\/b><\/div>\n    <div class=\"rchip\" id=\"chip3\">🎯 ROUND 3<br>Precision Bar<b>—<\/b><\/div>\n  <\/div>\n\n  <div class=\"panel\">\n    <div id=\"stage\" class=\"idle\" onclick=\"stageTap()\" tabindex=\"0\" role=\"button\" aria-label=\"Timing stage: tap, or press Space, to play each round\">\n      <div class=\"bigNo\" id=\"stageBig\">▶️<\/div>\n      <div class=\"stageLbl\" id=\"stageLbl\">Tap here to begin Round 1 — Reaction.<br>Wait for GREEN… then tap as fast as humanly possible!<\/div>\n      <div id=\"stageExtra\" style=\"width:100%\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"btns\">\n    <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n    <button class=\"act primary\" onclick=\"newGame()\">🔄 Restart Course<\/button>\n    <button class=\"act ghost\" onclick=\"challengeMe()\">⚔️ Challenge a Friend<\/button>\n    <button class=\"act ghost\" onclick=\"PD.whatsapp(shareText())\">💬 WhatsApp<\/button>\n  <\/div>\n\n  <details class=\"howto\"><summary>🎮 How to Play (10 seconds)<\/summary>\n    <ul>\n      <li><b>⚡ Round 1 — Reaction:<\/b> the panel turns green at a surprise moment (same moment for everyone today). Tap instantly! Tapping early = foul (−25).<\/li>\n      <li><b>⏱️ Round 2 — Stop 5.000:<\/b> a timer starts… and at 3.000s the numbers <b>vanish<\/b>. Count in your head and stop it at exactly <b>5.000<\/b>.<\/li>\n      <li><b>🎯 Round 3 — Precision Bar:<\/b> stop the sliding marker dead-center in the golden zone.<\/li>\n      <li>Scoring: 350 + 400 + 250 = <b>1,000 max<\/b>. A truly perfect 5.000 earns the 🤖 <b>ROBOT?!<\/b> badge.<\/li>\n    <\/ul>\n  <\/details>\n  <\/main>\n  <footer>⏱️ Timing &amp; Skill • Game #9 of 10 • <a href=\"../index.html\">Play the other 9 today →<\/a><\/footer>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\"><div class=\"modal\">\n  <div class=\"big\" id=\"ovEmoji\">⏱️<\/div><h2 id=\"ovTitle\"><\/h2><p id=\"ovText\"><\/p>\n  <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n  <button class=\"act primary\" onclick=\"PD.hideModal();newGame()\">▶️ Run It Again<\/button>\n  <button class=\"act ghost\" onclick=\"PD.hideModal()\">👀 Close<\/button>\n<\/div><\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>","js":"\nconst GAME=\"stop5\";\nlet mode=\"daily\",phase=\"idle\",cfg={},res={},fouls=0,runId=0,timeoutId=null,rafId=null,\n    goAt=0,timerStartAt=0,barPos=0,barDir=1,currentSeed=\"\",completed=false;\nlet beat=PD.challengeBanner(), challSeed=PD.challengeSeed();\ndocument.getElementById(\"dNum\").textContent=PD.dailyNumber();\nconst $=id=>document.getElementById(id);\n\nfunction setStage(big,lbl,cls,extra=\"\"){\n  const st=$(\"stage\"); st.className=cls; $(\"stageBig\").innerHTML=big; $(\"stageLbl\").innerHTML=lbl; $(\"stageExtra\").innerHTML=extra;\n}\nfunction setMode(m){mode=m; beat=(m===\"daily\")?PD.challengeBanner():null; if(m!==\"daily\"){const cb=document.getElementById(\"challBanner\"); if(cb)cb.className=\"banner\";}$(\"mDaily\").classList.toggle(\"active\",m===\"daily\");$(\"mFree\").classList.toggle(\"active\",m===\"free\");newGame();}\nfunction cleanup(){clearTimeout(timeoutId);cancelAnimationFrame(rafId)}\nfunction newGame(){\n  cleanup(); runId++;\n  currentSeed=(mode===\"daily\"&&challSeed)||(mode===\"daily\"?\"stop5-\"+PD.todayStr():\"stop5-free-\"+Date.now());\n  const rng=PD.rngFrom(currentSeed);\n  cfg={delay:1300+rng()*2900, barSpeed:0.52+rng()*0.36, barStart:rng()};\n  res={}; fouls=0; completed=false; phase=\"idle\";\n  [1,2,3].forEach(i=>{const c=$(\"chip\"+i);c.className=\"rchip\"+(i===1?\" active\":\"\");c.querySelector(\"b\").textContent=\"—\"});\n  PD.hideModal(); stats();\n  setStage(\"▶️\",\"Tap here to begin <b>Round 1 — Reaction<\/b>.<br>Wait for GREEN… then tap as fast as humanly possible!\",\"idle\");\n}\nfunction totalScore(){return Math.max(0,Math.round((res.r1||0)+(res.r2||0)+(res.r3||0)-fouls*25))}\nfunction stats(){\n  $(\"total\").textContent=PD.fmt(totalScore());\n  $(\"best\").textContent=PD.fmt(PD.get(PD.bestKey(GAME)));\n  $(\"streak\").textContent=\"🔥\"+PD.streak(GAME);\n}\nfunction chipDone(n,text){const c=$(\"chip\"+n);c.classList.remove(\"active\");c.classList.add(\"done\");c.querySelector(\"b\").textContent=text;\n  if(n<3)$(\"chip\"+(n+1)).classList.add(\"active\"); stats();}\n\n/* ---------- Round 1: Reaction ---------- */\nfunction startReaction(myRun){\n  phase=\"reactWait\";\n  setStage(\"🔴\",\"Wait for it… wait for it…<br><small>Tap the instant this turns GREEN<\/small>\",\"wait\");\n  timeoutId=setTimeout(()=>{\n    if(myRun!==runId)return;\n    phase=\"reactGo\"; goAt=performance.now();\n    setStage(\"⚡ TAP!\",\"\",\"go\"); PD.sfx.pop(10);\n  },cfg.delay);\n}\nfunction finishReaction(){\n  const ms=Math.round(performance.now()-goAt);\n  res.r1ms=ms;\n  res.r1=Math.max(0,350-Math.max(0,ms-150)*0.9);\n  phase=\"between1\";\n  const rank=ms<180?\"🚀 Superhuman!\":ms<230?\"⚡ Lightning!\":ms<280?\"🎯 Sharp!\":ms<350?\"👍 Solid\":\"🐢 Sleepy… coffee?\";\n  PD.sfx.good();\n  chipDone(1,ms+\" ms • \"+Math.round(res.r1)+\" pts\");\n  setStage(ms+\"<small style='font-size:26px'> ms<\/small>\",rank+\" &nbsp;•&nbsp; <b>+\"+Math.round(res.r1)+\" pts<\/b><br><small>Tap for Round 2 — the hidden 5.000 ⏱️<\/small>\",\"done\");\n}\n/* ---------- Round 2: Hidden timer ---------- */\nfunction startTimerRound(myRun){\n  phase=\"timerRun\"; timerStartAt=performance.now();\n  const tick=()=>{\n    if(myRun!==runId||phase!==\"timerRun\")return;\n    const el=(performance.now()-timerStartAt)/1000;\n    if(el<3) setStage(el.toFixed(3),\"Count with me… the numbers vanish at 3.000 😈<br><small>STOP at exactly 5.000<\/small>\",\"idle\");\n    else setStage('<span class=\"pulseDot\">⏱️<\/span>',\"It's hidden now — trust your inner clock…<br><small>Tap at exactly 5.000!<\/small>\",\"dark\");\n    if(el>=8)return finishTimer(8000); // auto-stop safety\n    rafId=requestAnimationFrame(tick);\n  }; tick();\n}\nfunction finishTimer(forcedMs){\n  cancelAnimationFrame(rafId);\n  const ms=forcedMs??Math.round(performance.now()-timerStartAt);\n  const diff=Math.abs(ms-5000);\n  res.r2ms=ms; res.r2diff=diff;\n  res.r2=Math.max(0,400-diff*0.35);\n  phase=\"between2\";\n  const rank=diff===0?\"🤖 ROBOT?! PERFECT 5.000!!\":diff<=15?\"🤖 Machine-grade timing!!\":diff<=60?\"🎯 Incredible!\":diff<=150?\"👏 Excellent!\":diff<=350?\"👍 Close!\":\"🕰️ The clock fooled you\";\n  if(diff<=60)PD.celebrate([\"⏱️\",\"🤖\",\"⭐\"],18); else PD.sfx.good();\n  chipDone(2,(ms/1000).toFixed(3)+\"s • \"+Math.round(res.r2)+\" pts\");\n  setStage((ms/1000).toFixed(3),rank+\"<br>Off by just <b>\"+(diff/1000).toFixed(3)+\"s<\/b> • <b>+\"+Math.round(res.r2)+\" pts<\/b><br><small>Tap for Round 3 — Precision Bar 🎯<\/small>\",\"done\");\n}\n/* ---------- Round 3: Precision bar ---------- */\nfunction startBarRound(myRun){\n  phase=\"barRun\"; barPos=cfg.barStart; barDir=1;\n  const extra=`<div class=\"track\"><div class=\"zone\"><\/div><div class=\"zoneCore\"><\/div><div class=\"marker\" id=\"marker\"><\/div><\/div>`;\n  let last=performance.now();\n  const tick=ts=>{\n    if(myRun!==runId||phase!==\"barRun\")return;\n    const dt=Math.min(0.05,(ts-last)/1000); last=ts;\n    barPos+=barDir*cfg.barSpeed*dt;\n    if(barPos>=1){barPos=1;barDir=-1} if(barPos<=0){barPos=0;barDir=1}\n    setStage(\"🎯\",\"Stop the marker <b>dead-center<\/b> in the golden zone!<br><small>Tap anywhere to STOP<\/small>\",\"idle\",extra);\n    const m=$(\"marker\"); if(m)m.style.left=(barPos*100)+\"%\";\n    rafId=requestAnimationFrame(tick);\n  };\n  rafId=requestAnimationFrame(tick);\n}\nfunction finishBar(){\n  cancelAnimationFrame(rafId);\n  const errPct=Math.abs(barPos-0.5)*100; // 0..50\n  res.r3err=errPct;\n  res.r3=Math.max(0,250-errPct*7);\n  phase=\"final\"; completed=true;\n  chipDone(3,errPct.toFixed(1)+\"% off • \"+Math.round(res.r3)+\" pts\");\n  const extra=`<div class=\"track\"><div class=\"zone\"><\/div><div class=\"zoneCore\"><\/div><div class=\"marker\" style=\"left:${barPos*100}%\"><\/div><\/div>`;\n  const rank=errPct<0.8?\"🎯 BULLSEYE!!\":errPct<3?\"🔥 Surgical!\":errPct<8?\"👏 Great stop!\":errPct<16?\"👍 Not bad\":\"🎢 It slid away…\";\n  setStage(errPct.toFixed(1)+\"<small style='font-size:24px'>% off<\/small>\",rank+\" • <b>+\"+Math.round(res.r3)+\" pts<\/b>\",\"done\",extra);\n  if(mode===\"daily\")PD.markPlayed(GAME);\n  PD.saveBest(GAME,totalScore()); stats();\n  if(totalScore()>=700)PD.celebrate([\"⏱️\",\"🎯\",\"🏆\"],24); else PD.sfx.great();\n  const myRun=runId; setTimeout(()=>{if(myRun===runId&&phase===\"final\")showFinal()},650);\n}\nfunction showFinal(){\n  const t=totalScore();\n  const title=t>=900?\"🤖 CERTIFIED ROBOT?!\":t>=800?\"🏆 Timing Champion!\":t>=650?\"🥇 Clock Master!\":t>=450?\"🥈 Sharp Timer!\":t>=250?\"🥉 Getting Warmer!\":\"🐢 Time Is A Mystery\";\n  PD.showModal(\"⏱️\",title+\" — \"+PD.fmt(t)+\" / 1000\",\n   \"⚡ Reaction: <b>\"+res.r1ms+\" ms<\/b> (\"+Math.round(res.r1)+\" pts)<br>\"+\n   \"⏱️ Stop 5.000: <b>\"+(res.r2ms/1000).toFixed(3)+\"s<\/b> — off by \"+(res.r2diff/1000).toFixed(3)+\"s (\"+Math.round(res.r2)+\" pts)<br>\"+\n   \"🎯 Precision: <b>\"+res.r3err.toFixed(1)+\"% off<\/b> (\"+Math.round(res.r3)+\" pts)\"+\n   (fouls?\"<br>🚨 Fouls: −\"+(fouls*25):\"\")+PD.challengeResultLine(t,beat));\n}\n/* ---------- Master tap router ---------- */\nfunction stageTap(){\n  const myRun=runId;\n  switch(phase){\n    case \"idle\": startReaction(myRun); break;\n    case \"reactWait\":\n      cleanup(); fouls++; phase=\"foulRetry\"; PD.sfx.bad(); stats();\n      setStage(\"🚨 TOO SOON!\",\"Foul! −25 points. Patience, grasshopper…<br><small>Tap to retry Round 1<\/small>\",\"wait\");\n      break;\n    case \"foulRetry\": cfg.delay=1100+Math.random()*2600; startReaction(myRun); break;\n    case \"reactGo\": finishReaction(); break;\n    case \"between1\":\n      setStage(\"⏱️\",\"Round 2 — tap to START the timer.<br>Numbers vanish at 3.000… <b>stop at 5.000<\/b>\",\"idle\");\n      phase=\"timerReady\"; break;\n    case \"timerReady\": startTimerRound(myRun); break;\n    case \"timerRun\": finishTimer(); break;\n    case \"between2\":\n      setStage(\"🎯\",\"Round 3 — tap to release the marker.<br>Then tap again to stop it <b>dead-center<\/b>\",\"idle\");\n      phase=\"barReady\"; break;\n    case \"barReady\": startBarRound(myRun); break;\n    case \"barRun\": finishBar(); break;\n    case \"final\": showFinal(); break;\n  }\n}\ndocument.getElementById(\"stage\").addEventListener(\"keydown\",e=>{\n  if(e.code===\"Space\"||e.code===\"Enter\"){e.preventDefault();stageTap()}\n});\ndocument.addEventListener(\"visibilitychange\",()=>{\n  if(document.hidden&&[\"reactWait\",\"reactGo\",\"timerRun\",\"barRun\"].includes(phase)){\n    newGame(); PD.toast(\"⏸️ Run reset — the tab was hidden during a timed round\");\n  }\n});\nfunction shareText(){\n  if(!completed)return \"⏱️ Stop 5.000 — can you stop a hidden timer at exactly 5.000 seconds?\\n3 rounds • 1000 points • One perfect robot score 👇\";\n  return \"⏱️ Stop 5.000 \"+(mode===\"daily\"?\"Daily #\"+PD.dailyNumber():\"Practice\")+\" — TOTAL: \"+PD.fmt(totalScore())+\"/1000\\n\"+\n   \"⚡ Reaction: \"+res.r1ms+\" ms\\n⏱️ Hidden timer: \"+(res.r2ms/1000).toFixed(3)+\"s (off by \"+(res.r2diff/1000).toFixed(3)+\"s!)\"+\n   \"\\n🎯 Precision: \"+res.r3err.toFixed(1)+\"% off-center\\n🔥\"+PD.streak(GAME)+\"\\n\\nBeat my inner clock! 👇\"}\nfunction challengeMe(){if(mode!==\"daily\"){PD.toast(\"☀️ Switch to Daily mode to create a fair, same-rules challenge\");return} PD.challengeLink(totalScore(),currentSeed)}\nfunction doShare(){PD.share(shareText(),\"Stop 5.000 ⏱️\")}\nnewGame();\n","css":"\n  #stage{border-radius:20px;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;\n    text-align:center;padding:22px;cursor:pointer;user-select:none;transition:background .15s;touch-action:manipulation;position:relative;overflow:hidden}\n  #stage.wait{background:linear-gradient(160deg,#7f1d1d,#dc2626)}\n  #stage.go{background:linear-gradient(160deg,#14532d,#22c55e)}\n  #stage.idle{background:linear-gradient(160deg,#1e3a8a,#7c3aed)}\n  #stage.done{background:linear-gradient(160deg,#713f12,#d97706)}\n  #stage.dark{background:linear-gradient(160deg,#0f172a,#334155)}\n  .bigNo{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 4px 18px #0007}\n  .stageLbl{font-size:15px;font-weight:800;opacity:.95;line-height:1.55;margin-top:8px;max-width:420px}\n  .roundchips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:11px 0}\n  .rchip{background:#00000030;border:1.5px solid var(--line);border-radius:15px;padding:10px 6px;text-align:center;font-size:12px}\n  .rchip b{display:block;font-size:16.5px;margin-top:2px}\n  .rchip.active{border-color:var(--gold);background:#42200666}\n  .rchip.done{border-color:var(--green)}\n  .track{width:100%;height:44px;background:#ffffff22;border:2px solid #ffffff55;border-radius:999px;position:relative;margin-top:20px}\n  .track .zone{position:absolute;left:46%;width:8%;top:0;bottom:0;background:#facc15;border-radius:6px}\n  .track .zoneCore{position:absolute;left:49.2%;width:1.6%;top:0;bottom:0;background:#fff}\n  .track .marker{position:absolute;top:-7px;width:16px;height:54px;border-radius:8px;background:#f472b6;border:2.5px solid #fff;transform:translateX(-50%)}\n  .pulseDot{font-size:58px;animation:pl 1s infinite}\n  @keyframes pl{0%,100%{opacity:.25;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}\n"},"tapfly":{"title":"TapFly Daily 🚀 — Thread All 30 Gates!","body":"<div class=\"wrap\">\n  <nav class=\"topbar\" aria-label=\"Arcade navigation\"><a class=\"back\" href=\"../index.html\">⬅ Arcade<\/a><span class=\"brand\">🎮 Play<b>Daily10<\/b><\/span><button class=\"iconbtn\" id=\"soundBtn\" title=\"Sound\">🔊<\/button><\/nav>\n  <main>\n  <header class=\"hero\">\n    <div style=\"font-size:42px\">🚀<\/div>\n    <h1>Tap<span class=\"grad\">Fly<\/span> Daily<\/h1>\n    <p class=\"tag\"><b>Tap / Click / Space<\/b> to fly up. Let go to fall.<br>Thread today's <b>30 gates<\/b> to finish the course!<\/p>\n  <\/header>\n  <noscript><p class=\"banner target\">JavaScript is required to play this game. Please enable JavaScript and reload.<\/p><\/noscript>\n\n  <div id=\"challBanner\"><\/div>\n  <div class=\"modes\">\n    <button id=\"mDaily\" class=\"active\" onclick=\"setMode('daily')\">☀️ Daily Course #<span id=\"dNum\"><\/span><\/button>\n    <button id=\"mFree\" onclick=\"setMode('free')\">♾️ Endless<\/button>\n  <\/div>\n  <div class=\"stats\">\n    <div class=\"stat\"><b id=\"gates\">0/30<\/b><span>Gates<\/span><\/div>\n    <div class=\"stat\"><b id=\"score\">0<\/b><span>Score<\/span><\/div>\n    <div class=\"stat\"><b id=\"best\">0<\/b><span>Best<\/span><\/div>\n    <div class=\"stat\"><b id=\"streak\">🔥0<\/b><span>Streak<\/span><\/div>\n  <\/div>\n\n  <div class=\"panel\">\n    <div class=\"gwrap\">\n      <canvas class=\"game\" id=\"cv\" tabindex=\"0\" role=\"img\" aria-label=\"TapFly rocket game. Tap or press Space to fly through the gates.\" width=\"480\" height=\"640\"><\/canvas>\n      <div id=\"hud\"><span id=\"hudGate\"><\/span><\/div>\n    <\/div>\n    <div class=\"toolbar\">\n      <button onclick=\"togglePause()\" id=\"pauseBtn\">⏸️ Pause<\/button>\n      <button onclick=\"newGame()\">🔄 Restart<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"btns\">\n    <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n    <button class=\"act primary\" onclick=\"newGame()\">▶️ Fly Again<\/button>\n    <button class=\"act ghost\" onclick=\"challengeMe()\">⚔️ Challenge a Friend<\/button>\n    <button class=\"act ghost\" onclick=\"PD.whatsapp(shareText())\">💬 WhatsApp<\/button>\n  <\/div>\n\n  <details class=\"howto\"><summary>🎮 How to Play (10 seconds)<\/summary>\n    <ul>\n      <li><b>Tap anywhere on the game<\/b> (or press Space) to flap upward. Gravity does the rest.<\/li>\n      <li>Fly through the <b>gap in every gate<\/b>. Touching a pipe, the ground, or the ceiling ends the run.<\/li>\n      <li>☀️ <b>Daily Course:<\/b> exactly 30 gates, generated from today's date — identical for every player on Earth. Finishers earn a time bonus!<\/li>\n      <li>♾️ <b>Endless:<\/b> survive as long as you can while the speed slowly rises.<\/li>\n      <li>Rhythm tip: small, steady taps beat big panicky ones. 🧘<\/li>\n    <\/ul>\n  <\/details>\n  <\/main>\n  <footer>🕹️ Arcade • Game #5 of 10 • <a href=\"../index.html\">Play the other 9 today →<\/a><\/footer>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\"><div class=\"modal\">\n  <div class=\"big\" id=\"ovEmoji\">🚀<\/div><h2 id=\"ovTitle\"><\/h2><p id=\"ovText\"><\/p>\n  <button class=\"act green\" onclick=\"doShare()\">📲 Share Result<\/button>\n  <button class=\"act primary\" onclick=\"PD.hideModal();newGame()\">▶️ Fly Again<\/button>\n  <button class=\"act ghost\" onclick=\"PD.hideModal()\">👀 Close<\/button>\n<\/div><\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>","js":"\nconst GAME=\"tapfly\", cv=document.getElementById(\"cv\"), ctx=cv.getContext(\"2d\");\nconst W=cv.width,H=cv.height,GAP=172,PW=74,SPACING=238,TOTAL=30;\nlet mode=\"daily\",state=\"ready\",bird,gates,passed,score,speed,rng,lastTs,runSecs=0,finished=false,stars=[],currentSeed=\"\";\nlet beat=PD.challengeBanner(), challSeed=PD.challengeSeed();\ndocument.getElementById(\"dNum\").textContent=PD.dailyNumber();\n\nfunction setMode(m){mode=m; beat=(m===\"daily\")?PD.challengeBanner():null; if(m!==\"daily\"){const cb=document.getElementById(\"challBanner\"); if(cb)cb.className=\"banner\";}document.getElementById(\"mDaily\").classList.toggle(\"active\",m===\"daily\");\n  document.getElementById(\"mFree\").classList.toggle(\"active\",m===\"free\");newGame();}\nfunction gapCenter(prev){\n  let c=140+rng()*(H-280);\n  if(prev!==null)c=Math.max(140,Math.min(H-140,prev+(c-prev)*0.62));\n  return c;\n}\nfunction newGame(){\n  currentSeed=(mode===\"daily\"&&challSeed)||(mode===\"daily\"?\"tapfly-\"+PD.todayStr():\"tapfly-free-\"+Date.now());\n  rng=PD.rngFrom(currentSeed);\n  bird={x:96,y:H/2,vy:0,r:16};\n  gates=[]; let prev=H/2;\n  const count=mode===\"daily\"?TOTAL:14;\n  for(let i=0;i<count;i++){prev=gapCenter(prev);gates.push({x:W+60+i*SPACING,c:prev,counted:false,n:i+1})}\n  stars=Array.from({length:70},()=>({x:rng()*W*3,y:rng()*H,s:rng()*2+0.6,v:12+rng()*25}));\n  passed=0;score=0;speed=168;state=\"ready\";finished=false;runSecs=0;\n  document.getElementById(\"pauseBtn\").textContent=\"⏸️ Pause\";\n  PD.hideModal(); stats(); draw();\n}\nfunction stats(){\n  document.getElementById(\"gates\").textContent=mode===\"daily\"?passed+\"/\"+TOTAL:passed;\n  document.getElementById(\"score\").textContent=PD.fmt(score);\n  document.getElementById(\"best\").textContent=PD.fmt(PD.getBest(GAME,mode));\n  document.getElementById(\"streak\").textContent=\"🔥\"+PD.streak(GAME);\n  document.getElementById(\"hudGate\").textContent=state===\"ready\"?\"👆 TAP TO START\":(mode===\"daily\"?\"🚀 \"+passed+\" / \"+TOTAL+\"\":\"🚀 \"+passed);\n}\nfunction flap(){\n  if(state===\"ready\"){state=\"playing\";lastTs=performance.now();requestAnimationFrame(loop)}\n  if(state===\"playing\"){bird.vy=-430;PD.sfx.pop(6)}\n}\ncv.addEventListener(\"pointerdown\",e=>{if(e.button>0)return;e.preventDefault();if(state!==\"paused\")flap()});\naddEventListener(\"keydown\",e=>{if(e.code===\"Space\"&&/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;if(e.code===\"Space\"||e.code===\"ArrowUp\"){e.preventDefault();if(state!==\"paused\")flap()}\n  if(e.code===\"KeyP\")togglePause()});\ndocument.addEventListener(\"visibilitychange\",()=>{if(document.hidden&&state===\"playing\")togglePause()});\nfunction togglePause(){\n  if(state===\"playing\"){state=\"paused\";document.getElementById(\"pauseBtn\").textContent=\"▶️ Resume\";draw()}\n  else if(state===\"paused\"){state=\"playing\";document.getElementById(\"pauseBtn\").textContent=\"⏸️ Pause\";lastTs=performance.now();requestAnimationFrame(loop)}\n}\nfunction loop(ts){\n  if(state!==\"playing\")return;\n  const dt=Math.min(0.033,(ts-lastTs)/1000); lastTs=ts;\n  step(dt); draw(); stats();\n  if(state===\"playing\")requestAnimationFrame(loop);\n}\nfunction step(dt){\n  runSecs+=dt;\n  speed=Math.min(228,168+passed*1.8);\n  bird.vy+=1420*dt; bird.y+=bird.vy*dt;\n  gates.forEach(g=>g.x-=speed*dt);\n  while(gates.length&&gates[0].x<-140)gates.shift();\n  stars.forEach(s=>{s.x-=s.v*dt;if(s.x<-4)s.x+=W*3});\n  for(const g of gates){\n    if(!g.counted&&g.x+PW<bird.x){g.counted=true;passed++;score+=100;PD.sfx.good();\n      if(mode===\"daily\"&&passed>=TOTAL)return onFinish();\n      if(mode!==\"daily\"){const last=gates[gates.length-1];gates.push({x:last.x+SPACING,c:gapCenter(last.c),counted:false,n:last.n+1})}}\n    // collision (circle vs two pipe rects)\n    if(bird.x+bird.r>g.x&&bird.x-bird.r<g.x+PW){\n      if(bird.y-bird.r<g.c-GAP/2||bird.y+bird.r>g.c+GAP/2)return crash();\n    }\n  }\n  if(bird.y-bird.r<=0||bird.y+bird.r>=H)return crash();\n}\nfunction endAttempt(){PD.saveBest(GAME,score,mode);if(mode===\"daily\")PD.markPlayed(GAME);stats()}\nfunction crash(){\n  state=\"dead\"; endAttempt(); PD.sfx.bad(); draw();\n  const pct=mode===\"daily\"?Math.round(passed/TOTAL*100):null;\n  PD.showModal(\"💥\",\"Crashed at Gate \"+(passed+1)+(mode===\"daily\"?\" of \"+TOTAL:\"\"),\n   \"Gates cleared: <b>\"+passed+\"<\/b> • Score: <b>\"+PD.fmt(score)+\"<\/b>\"+\n   (pct!==null?\"<br>Course completed: \"+pct+\"%\":\"\")+PD.challengeResultLine(score,beat)+\n   \"<br>Flight tip: aim for the center of the NEXT gap early, not late.\");\n}\nfunction onFinish(){\n  finished=true; state=\"won\";\n  const secs=Math.round(runSecs);\n  const bonus=Math.max(0,600-secs*4); score+=bonus;\n  endAttempt(); PD.celebrate([\"🚀\",\"🏁\",\"⭐\"],30); draw();\n  PD.showModal(\"🏁\",\"COURSE COMPLETE! 🏆\",\n   \"All <b>\"+TOTAL+\" gates<\/b> in \"+secs+\"s • Time bonus: +\"+bonus+\"<br>Final score: <b>\"+PD.fmt(score)+\"<\/b>\"+\n   PD.challengeResultLine(score,beat)+\"<br>You are officially a TapFly ace 😎\");\n}\nfunction draw(){\n  const grd=ctx.createLinearGradient(0,0,0,H); grd.addColorStop(0,\"#0b1e4b\"); grd.addColorStop(.6,\"#153a7a\"); grd.addColorStop(1,\"#7c2d12\");\n  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);\n  ctx.fillStyle=\"#ffffffcc\"; stars.forEach(s=>{if(s.x<W*1.2){ctx.beginPath();ctx.arc(s.x%W,s.y,s.s,0,7);ctx.fill()}});\n  // sun glow\n  const sun=ctx.createRadialGradient(W-80,H-120,8,W-80,H-120,130);\n  sun.addColorStop(0,\"#fde68add\"); sun.addColorStop(1,\"#f59e0b00\"); ctx.fillStyle=sun; ctx.fillRect(0,0,W,H);\n  // gates\n  gates.forEach((g,i)=>{\n    if(g.x>W+90||g.x+PW<-10)return;\n    const topH=g.c-GAP/2, botY=g.c+GAP/2;\n    const pg=ctx.createLinearGradient(g.x,0,g.x+PW,0);\n    pg.addColorStop(0,\"#16a34a\");pg.addColorStop(.45,\"#4ade80\");pg.addColorStop(1,\"#15803d\");\n    ctx.fillStyle=pg;\n    ctx.fillRect(g.x,0,PW,topH); ctx.fillRect(g.x-5,topH-26,PW+10,26);\n    ctx.fillRect(g.x,botY,PW,H-botY); ctx.fillRect(g.x-5,botY,PW+10,26);\n    ctx.strokeStyle=\"#052e16aa\";ctx.lineWidth=2;\n    ctx.strokeRect(g.x,0,PW,topH);ctx.strokeRect(g.x,botY,PW,H-botY);\n    if(g.n%5===0){ctx.fillStyle=\"#fff\";ctx.font=\"900 17px system-ui\";ctx.textAlign=\"center\";ctx.fillText(g.n,g.x+PW/2,botY+44)}\n  });\n  // ground line\n  ctx.fillStyle=\"#00000055\"; ctx.fillRect(0,H-6,W,6);\n  // rocket\n  ctx.save(); ctx.translate(bird.x,bird.y);\n  ctx.rotate(Math.max(-0.5,Math.min(0.8,bird.vy/900)));\n  ctx.font=\"36px serif\"; ctx.textAlign=\"center\"; ctx.textBaseline=\"middle\";\n  ctx.fillText(state===\"dead\"?\"💥\":\"🚀\",0,0); ctx.restore();\n  if(state===\"ready\"){ctx.fillStyle=\"#ffffff\";ctx.font=\"900 25px system-ui\";ctx.textAlign=\"center\";\n    ctx.fillText(\"👆 TAP TO FLY\",W/2,H/2-95);\n    ctx.font=\"700 16px system-ui\";ctx.fillText(mode===\"daily\"?\"Clear all 30 gates of today’s course!\":\"How far can you go?\",W/2,H/2-62);}\n  if(state===\"paused\"){ctx.fillStyle=\"#00000088\";ctx.fillRect(0,0,W,H);\n    ctx.fillStyle=\"#fff\";ctx.font=\"900 32px system-ui\";ctx.textAlign=\"center\";ctx.fillText(\"⏸️ PAUSED\",W/2,H/2);}\n}\nfunction shareText(){\n  return \"🚀 TapFly \"+(mode===\"daily\"?\"Daily Course #\"+PD.dailyNumber():\"Endless\")+\"\\n\"+\n   (finished?\"🏁 COURSE COMPLETE! All \"+TOTAL+\" gates!\":\"Gates cleared: \"+passed+(mode===\"daily\"?\"/\"+TOTAL:\"\"))+\n   \"\\nScore: \"+PD.fmt(score)+\" • 🔥\"+PD.streak(GAME)+\"\\n\\nSame course, same gates — out-fly me! 👇\"}\nfunction challengeMe(){if(mode!==\"daily\"){PD.toast(\"☀️ Switch to Daily mode to create a fair, same-rules challenge\");return} PD.challengeLink(score,currentSeed)}\nfunction doShare(){PD.share(shareText(),\"TapFly Daily 🚀\")}\nnewGame();\n","css":"\n  .gwrap{position:relative}\n  #hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;gap:18px;font-weight:900;color:#fff;text-shadow:0 2px 6px #000c;pointer-events:none;font-size:16px}\n  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}\n  .toolbar button{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:12px;padding:11px;font-weight:900;cursor:pointer}\n"}},"css":":root{\n  --bg1:#070b1a;--bg2:#121a35;--card:#ffffff12;--card2:#ffffff1c;--line:#ffffff24;\n  --gold:#facc15;--green:#22c55e;--pink:#f472b6;--cyan:#38bdf8;--red:#fb7185;--text:#f8fafc;--muted:#cbd5e1;\n  --radius:20px;--shadow:0 18px 50px rgba(0,0,0,.45);\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml{scroll-behavior:smooth}\nbody{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;\n  background:\n   radial-gradient(900px 500px at 15% -10%,#7c3aed55,transparent 60%),\n   radial-gradient(800px 450px at 105% 0%,#0891b255,transparent 55%),\n   radial-gradient(700px 500px at 50% 115%,#db277733,transparent 60%),\n   linear-gradient(160deg,var(--bg1),var(--bg2));}\n.wrap{max-width:560px;margin:0 auto;padding:14px 14px 42px}\n.wrap.wide{max-width:920px}\n.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px}\n.back,.iconbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text);\n  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer}\n.iconbtn{padding:8px 13px;min-height:40px}\n.back{min-height:40px}\n.brand{font-weight:900;letter-spacing:.4px;font-size:14px;opacity:.95}\n.brand b{color:var(--gold)}\nheader.hero{text-align:center;padding:8px 4px 4px}\nh1{margin:4px 0 6px;font-size:34px;line-height:1.08;letter-spacing:-.5px}\nh1 .grad{background:linear-gradient(92deg,#facc15,#f472b6 55%,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}\n.tag{color:var(--muted);font-size:14.5px;line-height:1.55;margin:4px auto 10px;max-width:520px}\n.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}\n.pills i{font-style:normal;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}\n.panel{background:linear-gradient(180deg,var(--card2),#ffffff0d);border:1px solid var(--line);border-radius:var(--radius);\n  padding:14
